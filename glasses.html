:root {
  --bg: #000; --g: #00ff41; --g2: #00c434; --dim: #0d6b24; --faint: #052e11; --hot: #d2ffdc;
  --font: "Share Tech Mono", "Roboto Mono", "Droid Sans Mono", monospace;
  --pad: clamp(16px, 4vw, 28px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body, #app { inline-size: 100%; block-size: 100%; }
body { margin: 0; background: var(--bg); color: var(--g); font-family: var(--font); font-size: clamp(18px, 4.4vw, 26px); overflow: hidden; }
button { font: inherit; color: inherit; }
.hidden { display: none !important; }

#app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: var(--pad); gap: 8px; }
#status { font-size: 0.6em; color: var(--dim); text-align: end; min-block-size: 1em; letter-spacing: .1em; }
#status.live { color: var(--g2); }
#main { min-block-size: 0; display: flex; flex-direction: column; position: relative; }

/* Lists sit at the bottom like the phone; the bottom block is highest priority. */
.list { flex: 1 1 auto; min-block-size: 0; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 6px; padding: 4px; }
.list > :last-child { margin-block-start: auto; }

.block { display: flex; align-items: center; gap: 12px; inline-size: 100%; min-block-size: 2.4em; padding: 0.4em 0.7em; text-align: start;
  background: var(--bg); color: var(--g); border: 2px solid var(--g); border-radius: 0; cursor: pointer; }
.block .name { flex: 1; min-inline-size: 0; overflow-wrap: anywhere; }
.block .proj { color: var(--g2); }
.block .meta { flex: none; font-size: 0.7em; color: var(--g2); }
/* Focus = the phone's solid green "selected" block, plus an outline so it isn't color alone. */
.block:focus-visible, .block:focus { background: var(--g); color: var(--bg); outline: 3px solid var(--hot); outline-offset: 3px; }
.block:focus .proj, .block:focus .meta { color: var(--bg); }
.block.moving { border-style: dashed; }
.block.moving::before { content: "↕"; }

#empty, .note { color: var(--g2); text-align: center; margin: auto 0; font-size: 0.85em; line-height: 1.35; }
#unpaired { margin: auto 0; text-align: center; line-height: 1.4; font-size: 0.9em; }
#unpaired p { margin: 0 0 0.8em; }

nav { display: flex; justify-content: center; }
#navtitle { background: none; border: 2px solid transparent; padding: 6px 14px; display: flex; gap: 16px; align-items: center; cursor: pointer; }
#navtitle .t { font-family: "OCR-A", var(--font); font-size: 1.15em; letter-spacing: .2em; text-shadow: 0 0 10px rgba(0, 255, 65, .55); white-space: nowrap; }
#navtitle .l, #navtitle .r { color: var(--dim); }
#navtitle:focus, #navtitle:focus-visible { border-color: var(--g); outline: 3px solid var(--hot); outline-offset: 3px; }

#overlay { position: fixed; inset: 0; background: var(--bg); padding: var(--pad); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.ohead { text-align: center; margin-block-end: 6px; }
.kicker { font-family: "OCR-A", var(--font); font-size: 0.75em; letter-spacing: .25em; color: var(--g2); }
.otitle { font-size: 1.1em; margin-block-start: 4px; overflow-wrap: anywhere; }
.opts, .olist { display: flex; flex-direction: column; gap: 8px; }
.olist { flex: 1 1 auto; min-block-size: 0; overflow-y: auto; padding: 4px; }
.opt { inline-size: 100%; padding: 0.45em; background: var(--bg); border: 2px solid var(--g); letter-spacing: .12em; cursor: pointer; }
.opt.danger { border-style: dashed; }
.opt.primary { margin-block-start: auto; }

<script>

window.__errs=[];
function __showErr(msg){try{var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;background:#300;color:#fbb;font:13px monospace;padding:8px 10px;white-space:pre-wrap;max-height:40%;overflow:auto';document.body.appendChild(b);}b.textContent+= (b.textContent?'\n':'')+'Error: '+msg;}catch(e){}}
window.addEventListener('error',function(e){__showErr((e.message||'unknown')+(e.filename?' @'+e.filename.split('/').pop()+':'+e.lineno:''));});

/* Paradigm: state, persistence and model rules */
'use strict';

const MIN = 60000, HALF = 30 * MIN, DAY = 24 * 60 * MIN;
let state = null;
let idb = null;

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
function dateStr(d) { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const todayStr = () => dateStr(Date.now());
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function floor30(ms) { const d = new Date(ms); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() < 30 ? 0 : 30); return d.getTime(); }
function ceilHalf(ms) { return Math.max(1, Math.ceil(ms / HALF)) * HALF; }
const Q15 = 15 * MIN;
function nextQuarter(ms) { const d = new Date(ms); if (d.getSeconds() || d.getMilliseconds() || d.getMinutes() % 15) { d.setSeconds(0, 0); d.setMinutes(Math.floor(d.getMinutes() / 15) * 15 + 15); } return d.getTime(); }
function ceilQuarter(ms) { return Math.max(1, Math.ceil(ms / Q15)) * Q15; }
function minToClock(min) { const h = Math.floor(min / 60) % 24, m = min % 60; const ap = h < 12 ? 'AM' : 'PM'; const h12 = h % 12 || 12; return `${h12}:${pad(m)} ${ap}`; }
function msToClock(ms) { const d = new Date(ms); return minToClock(d.getHours() * 60 + d.getMinutes()); }
function fmtDur(ms) { ms = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(ms / 3600), m = Math.floor(ms % 3600 / 60), s = ms % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }
function fmtShort(ms) { const m = Math.round(ms / MIN); return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? pad(m % 60) : ''}` : `${m}m`; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- persistence (IndexedDB) ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('paradigm', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbGet(k) {
  return new Promise((res, rej) => {
    const q = idb.transaction('kv').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
function idbSet(k, v) {
  return new Promise((res, rej) => {
    const t = idb.transaction('kv', 'readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

function freshState() {
  return {
    v: 4, items: {}, blocks: {}, stack: [], backlogs: { project: [], list: [], task: [] }, running: null,
    lastDueCheck: todayStr(),
    calQueue: [],   // completions made on the glasses, waiting for the phone to log them to Google Calendar
    settings: { clientId: '', connected: false, paradigmCalId: '', driveFileId: '', lastBackup: 0 },
    auth: { token: '', exp: 0 }
  };
}
function normalize(s) {
  const f = freshState();
  // v1 -> v2: one backlog becomes three; the placement queue goes to the top of STACK.
  if (!s.backlogs) {
    s.backlogs = { project: [], list: [], task: [] };
    (s.backlog || []).forEach(bid => { const k = blockKind(bid, s); if (k) s.backlogs[k].push(bid); });
  }
  if (Array.isArray(s.placing)) { s.stack = (s.stack || []).concat(s.placing); }
  delete s.backlog; delete s.placing;
  // v3: PROJECT BACKLOG holds projects (item ids), not subtask blocks.
  if ((s.v || 1) < 3) { s.backlogs.project = []; s.v = 3; }
  // v4: no FOCUS timer. Anything mid-session goes back to the bottom of STACK.
  if (s.running) { s.stack = [s.running.bid].concat((s.stack || []).filter(b => b !== s.running.bid)); s.running = null; }
  s.v = 4;
  for (const k of Object.keys(f)) if (s[k] === undefined) s[k] = f[k];
  s.settings = Object.assign(f.settings, s.settings || {});
  s.auth = Object.assign(f.auth, s.auth || {});
  return s;
}

let saveTimer = null;
function save(opts) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 200);
  if (!(opts && opts.noBackup) && typeof scheduleBackup === 'function') scheduleBackup();
  if (!(opts && opts.noSync) && typeof scheduleSync === 'function') scheduleSync();
}
function flush() { clearTimeout(saveTimer); if (idb && state) return idbSet('state', state).catch(e => console.error(e)); }

async function loadState() {
  idb = await idbOpen();
  const s = await idbGet('state');
  state = normalize(s || freshState());
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  repair();
}

/* Keep lists consistent: drop dead blocks, rescue orphans into the backlog. */
function repair() {
  const seen = new Set();
  const clean = arr => arr.filter(b => {
    const ok = state.blocks[b] && state.items[state.blocks[b].itemId] && !seen.has(b);
    if (ok) seen.add(b); return ok;
  });
  if (state.running && !(state.blocks[state.running.bid] && state.items[state.blocks[state.running.bid].itemId])) state.running = null;
  if (state.running) seen.add(state.running.bid);
  state.stack = clean(state.stack);
  for (const k of BLOCK_KINDS) state.backlogs[k] = clean(state.backlogs[k] || []);
  // PROJECT BACKLOG lists every project, by item id.
  const pseen = new Set();
  state.backlogs.project = (state.backlogs.project || []).filter(id => state.items[id] && state.items[id].type === 'project' && !pseen.has(id) && pseen.add(id));
  for (const it of Object.values(state.items)) if (it.type === 'project' && !pseen.has(it.id)) state.backlogs.project.push(it.id);
  for (const [bid, b] of Object.entries(state.blocks)) {
    const it = state.items[b.itemId];
    if (!it || (b.subId && !(it.subtasks || []).some(s => s.id === b.subId))) { delete state.blocks[bid]; continue; }
    if (seen.has(bid)) continue;
    if (b.subId) delete state.blocks[bid];   // a loose subtask simply returns to its project
    else state.backlogs[blockKind(bid)].push(bid);
  }
  // Every task and list that isn't on STACK or in FOCUS lives in its backlog, recurring ones included.
  for (const it of Object.values(state.items)) placeInBacklog(it.id);
}

/* ---------- model queries ---------- */
const TYPES = { task: 'TASK', list: 'LIST', event: 'EVENT', project: 'PROJECT' };
const KINDS = ['project', 'list', 'task'];
const BLOCK_KINDS = ['list', 'task'];
const BACKLOG_TITLE = { project: 'PROJECT BACKLOG', list: 'LIST BACKLOG', task: 'TASK BACKLOG' };
/* Which backlog a block belongs to: project subtasks -> project, otherwise the item's type. */
function blockKind(bid, s) {
  s = s || state;
  const b = s.blocks[bid]; if (!b) return null;
  if (b.subId) return 'project';
  const it = s.items[b.itemId]; if (!it) return null;
  return it.type === 'list' ? 'list' : 'task';
}
function inBacklog(bid) { return BLOCK_KINDS.some(k => state.backlogs[k].includes(bid)); }
function itemByName(name) {
  const n = name.trim().toLowerCase();
  return Object.values(state.items).find(i => i.name.trim().toLowerCase() === n) || null;
}
function findBlock(itemId, subId) {
  return Object.keys(state.blocks).find(b => state.blocks[b].itemId === itemId && (state.blocks[b].subId || null) === (subId || null)) || null;
}
function whereBlock(bid) {
  if (state.running && state.running.bid === bid) return 'running';
  if (state.stack.includes(bid)) return 'stack';
  if (inBacklog(bid)) return 'backlog';
  return null;
}
function detach(bid) {
  state.stack = state.stack.filter(b => b !== bid);
  for (const k of BLOCK_KINDS) state.backlogs[k] = state.backlogs[k].filter(b => b !== bid);
}
function removeBlock(bid) {
  detach(bid);
  if (state.running && state.running.bid === bid) state.running = null;
  delete state.blocks[bid];
}
function blockLabel(bid) {
  const b = state.blocks[bid], it = state.items[b.itemId];
  if (b.subId) { const s = it.subtasks.find(x => x.id === b.subId); return { proj: it.name, name: s ? s.name : '?' }; }
  return { proj: null, name: it.name };
}
function blockName(bid) { const l = blockLabel(bid); return l.proj ? `${l.proj} › ${l.name}` : l.name; }

function newItem(type, name) {
  const it = { id: uid(), type, name: name.trim(), created: Date.now() };
  if (type === 'task') Object.assign(it, { notes: '', recurring: false, schedule: { freq: 'none' } });
  if (type === 'list') Object.assign(it, { subtasks: [], recurring: false, recSubtasks: false, schedule: { freq: 'none' } });
  if (type === 'project') Object.assign(it, { subtasks: [], recurring: false });
  if (type === 'event') Object.assign(it, { event: null });
  return it;
}
function deleteItem(id) {
  for (const bid of Object.keys(state.blocks)) if (state.blocks[bid].itemId === id) removeBlock(bid);
  delete state.items[id];
  state.backlogs.project = state.backlogs.project.filter(x => x !== id);
}
/* Puts a task or list with no block anywhere onto the top (lowest priority) of its backlog. */
function placeInBacklog(itemId) {
  const it = state.items[itemId];
  if (!it || (it.type !== 'task' && it.type !== 'list') || findBlock(itemId, null)) return false;
  const bid = uid();
  state.blocks[bid] = { bid, itemId, subId: null, elapsed: 0 };
  state.backlogs[it.type].push(bid);
  return true;
}
function listProject(id) { if (!state.backlogs.project.includes(id)) state.backlogs.project.push(id); }

/* Adds an item (or project subtask) to STACK. where: 'top' (lowest priority, from a backlog)
   or 'bottom' (highest priority, new from the STACK input). Returns a message or null. */
function addToStack(itemId, subId, where) {
  let bid = findBlock(itemId, subId);
  const w = bid && whereBlock(bid);
  if (w === 'stack') return 'Already on STACK';
  if (w === 'backlog') detach(bid);
  if (!bid) { bid = uid(); state.blocks[bid] = { bid, itemId, subId: subId || null, elapsed: 0 }; }
  if (where === 'bottom') state.stack.unshift(bid); else state.stack.push(bid);
  return null;
}
/* Deletes what a block stands for: the task or list, or just the subtask for a project subtask. */
function deleteBlockItem(bid) {
  const b = state.blocks[bid]; if (!b) return;
  if (b.subId) {
    const it = state.items[b.itemId];
    if (it) it.subtasks = it.subtasks.filter(s => s.id !== b.subId);
    removeBlock(bid);
  } else deleteItem(b.itemId);
}
/* Sends a block to the bottom (highest priority) of its backlog. Project subtasks return to their project. */
function sendToBacklog(bid) {
  if (state.blocks[bid].subId) { removeBlock(bid); return; }
  detach(bid);
  state.backlogs[blockKind(bid)].unshift(bid);
}

/* ---------- schedules ---------- */
function defaultSchedule(freq) {
  const d = new Date();
  return { freq, days: [d.getDay()], dom: d.getDate(), month: d.getMonth() };
}
function matchesSchedule(sch, d) {
  if (!sch || sch.freq === 'none') return false;
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  switch (sch.freq) {
    case 'daily': return true;
    case 'weekly': return (sch.days || []).includes(d.getDay());
    case 'monthly': return d.getDate() === Math.min(sch.dom || 1, dim);
    case 'annually': return d.getMonth() === sch.month && d.getDate() === Math.min(sch.dom || 1, dim);
  }
  return false;
}
/* Drops due recurring items onto the bottom of STACK. Returns ids that arrived. */
function runDueCheck() {
  const today = todayStr();
  if (state.lastDueCheck >= today) return [];
  const due = [];
  for (const it of Object.values(state.items)) {
    if (!it.recurring || !it.schedule || it.schedule.freq === 'none') continue;
    let d = addDays(state.lastDueCheck, 1), n = 0;
    while (d <= today && n++ < 400) { if (matchesSchedule(it.schedule, parseDate(d))) { due.push(it); break; } d = addDays(d, 1); }
  }
  state.lastDueCheck = today;
  due.sort((a, b) => b.created - a.created);
  const arrived = [];
  for (const it of due) {
    let bid = findBlock(it.id, null);
    const w = bid && whereBlock(bid);
    if (w === 'stack' || w === 'running') continue;
    if (w === 'backlog') detach(bid);
    if (!bid) { bid = uid(); state.blocks[bid] = { bid, itemId: it.id, subId: null, elapsed: 0 }; }
    state.stack.unshift(bid);
    arrived.push(bid);
  }
  if (due.length || arrived.length) save();
  return arrived;
}

/* ---------- completion ---------- */
/* Completes a block over the chosen time span; returns what to log on the Paradigm calendar. */
function completeBlock(bid, start, end) {
  const b = state.blocks[bid]; if (!b) return null;
  const it = state.items[b.itemId];
  const res = { name: blockName(bid), start, end };
  if (b.subId) {
    // Done subtasks leave the project, unless it's a recurring project (then it stays, ready to do again).
    if (!it.recurring) it.subtasks = it.subtasks.filter(x => x.id !== b.subId);
  } else if (it.type === 'task') {
    if (!it.recurring) delete state.items[it.id];
  } else if (it.type === 'list') {
    if (!it.recurring) delete state.items[it.id];
    else if (it.recSubtasks) it.subtasks.forEach(s => { s.done = false; });
    else it.subtasks = [];
  }
  removeBlock(bid);
  if (state.items[b.itemId]) placeInBacklog(b.itemId);   // recurring items go back to their backlog
  save();
  return res;
}

/* Paradigm: phone <-> glasses sync through a free Firebase Realtime Database.
   Both devices keep a full local copy. Every change is written as one small record:
     /paradigm/<key>/state.json = { rev, by, at, data: "<the shared state as JSON text>" }
   The higher rev wins. Each device listens for the other's writes (server-sent events). */
'use strict';

const SYNC_FIELDS = ['items', 'blocks', 'stack', 'backlogs', 'lastDueCheck', 'calQueue'];
let syncCfg = null;            // { db, key }
let syncDevice = 'phone';
let syncRev = 0, syncLastSent = '', syncTimer = null, syncES = null, syncPoll = null;
let syncStatus = 'off';        // off | connecting | live | offline
let onSyncAdopt = null;        // callback after remote data is applied
let syncDeferred = null;       // remote record waiting for a drag to finish

function syncConfigured() { return !!(syncCfg && syncCfg.db && syncCfg.key); }
function syncUrl() { return `${syncCfg.db.replace(/\/+$/, '')}/paradigm/${encodeURIComponent(syncCfg.key)}/state.json`; }
function syncPayload() { const o = {}; SYNC_FIELDS.forEach(k => { o[k] = state[k]; }); return JSON.stringify(o); }
function newSyncKey() { const a = new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a, b => b.toString(36).padStart(2, '0')).join('').slice(0, 32); }
function setSyncStatus(s) { syncStatus = s; if (typeof onSyncStatus === 'function') onSyncStatus(s); }

/* Called by save(): push shortly after a change. */
function scheduleSync() {
  if (!syncConfigured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncPush, 600);
}
async function syncPush() {
  if (!syncConfigured()) return;
  const data = syncPayload();
  if (data === syncLastSent) return;
  try {
    // Number this write after whatever is on the server, so the newest change always wins
    // and both devices end up with the same data.
    let base = syncRev;
    try { const cur = await syncFetch(); if (cur && cur.rev > base) base = cur.rev; } catch (e) { /* offline: the PUT below will fail and retry */ }
    const rec = { rev: base + 1, by: syncDevice, at: Date.now(), data };
    const r = await fetch(syncUrl(), { method: 'PUT', body: JSON.stringify(rec) });
    if (!r.ok) throw new Error('sync ' + r.status);
    syncRev = rec.rev; syncLastSent = data; saveSyncMeta();
    if (syncStatus !== 'live') setSyncStatus(syncES ? 'live' : 'connecting');
  } catch (e) {
    setSyncStatus('offline');
    clearTimeout(syncTimer); syncTimer = setTimeout(syncPush, 5000);   // retry until it goes through
  }
}

/* Applies a record from the other device if it's newer than what we have. */
function syncReceive(rec) {
  if (!rec || typeof rec !== 'object' || !rec.data) return;
  if (rec.rev <= syncRev) return;
  if (rec.by === syncDevice && rec.data === syncLastSent) { syncRev = rec.rev; saveSyncMeta(); return; }
  if (typeof dragCtx !== 'undefined' && dragCtx) { syncDeferred = rec; return; }
  let incoming;
  try { incoming = JSON.parse(rec.data); } catch (e) { return; }
  SYNC_FIELDS.forEach(k => { if (incoming[k] !== undefined) state[k] = incoming[k]; });
  if (!state.calQueue) state.calQueue = [];
  repair();
  syncRev = rec.rev; syncLastSent = syncPayload(); saveSyncMeta();
  save({ noSync: true, noBackup: false });
  if (onSyncAdopt) onSyncAdopt();
}
setInterval(() => { if (syncDeferred && !(typeof dragCtx !== 'undefined' && dragCtx)) { const r = syncDeferred; syncDeferred = null; syncReceive(r); } }, 500);

async function syncFetch() {
  const r = await fetch(syncUrl(), { cache: 'no-store' });
  if (!r.ok) throw new Error('sync ' + r.status);
  return r.json();
}

/* Connects: pulls the latest record, pushes ours if we're ahead, then listens live. */
async function syncStart() {
  syncStop();
  if (!syncConfigured()) { setSyncStatus('off'); return; }
  setSyncStatus('connecting');
  try {
    const rec = await syncFetch();
    if (rec && rec.rev > syncRev) syncReceive(rec);
    else if (!rec || syncPayload() !== syncLastSent || rec.rev < syncRev) { syncLastSent = ''; await syncPush(); }
  } catch (e) { setSyncStatus('offline'); }
  try {
    syncES = new EventSource(syncUrl());
    syncES.addEventListener('put', ev => {
      setSyncStatus('live');
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.path === '/') syncReceive(msg.data);
      else syncFetch().then(syncReceive).catch(() => {});
    });
    syncES.addEventListener('patch', () => { syncFetch().then(syncReceive).catch(() => {}); });
    syncES.addEventListener('keep-alive', () => setSyncStatus('live'));
    syncES.onopen = () => setSyncStatus('live');
    syncES.onerror = () => setSyncStatus('offline');
  } catch (e) { /* polling below still works */ }
  // Safety net in case live updates drop silently.
  syncPoll = setInterval(() => { if (!document.hidden) syncFetch().then(syncReceive).catch(() => setSyncStatus('offline')); }, 20000);
}
function syncStop() {
  if (syncES) { syncES.close(); syncES = null; }
  clearInterval(syncPoll); syncPoll = null;
}

/* Paradigm for Meta Ray-Ban Display.
   Same data as the phone (synced), viewed and worked through with arrows + Enter.
   It can complete, reorder, move between STACK and backlogs, check off subtasks and delete,
   but it never creates or renames anything: that stays on the phone.

   Input mirrors the phone:  → (swipe right) on a STACK block = complete,  ← = send to backlog,
   → on a backlog block = add to STACK.  Enter = the actions menu (the phone's hold).
   On the screen name at the bottom, → / ← move between screens like the phone's title swipes. */
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const LS_KEY = 'paradigm.glasses.v1';
const SCREENS = ['project', 'list', 'task', 'stack'];
const SCREEN_TITLE = { project: 'PROJECT BACKLOG', list: 'LIST BACKLOG', task: 'TASK BACKLOG', stack: 'STACK' };
let screen = 'stack';
let focusKey = null;      // keeps focus on the same block across re-renders
let moving = null;        // key of the block being reordered
let overlayOpen = false;

/* ---------- storage + sync (replaces the phone's IndexedDB versions in store.js) ---------- */
async function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { saved = null; }
  const q = new URLSearchParams(location.search);
  const cfg = q.get('db') && q.get('k') ? { db: q.get('db'), key: q.get('k') } : (saved && saved.cfg) || null;
  // A different pairing link means a different phone: start clean.
  const samePair = saved && saved.cfg && cfg && saved.cfg.key === cfg.key;
  state = normalize(samePair && saved.state ? saved.state : freshState());
  syncRev = samePair ? (saved.rev || 0) : 0;
  syncCfg = cfg;
  repair();
}
function flush() {
  try {
    const keep = {}; SYNC_FIELDS.forEach(k => { keep[k] = state[k]; });
    localStorage.setItem(LS_KEY, JSON.stringify({ state: keep, rev: syncRev, cfg: syncCfg }));
  } catch (e) { /* storage full or unavailable: sync still holds the data */ }
}
function saveSyncMeta() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 200); }
function onSyncStatus(s) {
  const el = $('#status'); if (!el) return;
  el.textContent = { live: '● SYNCED', connecting: '○ CONNECTING', offline: '○ OFFLINE', off: '' }[s] || '';
  el.className = s;
}

/* ---------- helpers ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 3500);
}
function listFor(name) { return name === 'stack' ? state.stack : state.backlogs[name]; }
function setList(name, arr) { if (name === 'stack') state.stack = arr; else state.backlogs[name] = arr; }
function keyName(key) { return screen === 'project' ? state.items[key].name : blockName(key); }
function blockInfo(key) {
  if (screen === 'project') return { kind: 'project', it: state.items[key] };
  const b = state.blocks[key]; if (!b) return null;
  const it = state.items[b.itemId];
  return { kind: b.subId ? 'subtask' : it.type, it, b };
}
function hasNotes(info) { return info && info.kind === 'task' && (info.it.notes || '').trim(); }
function openSubtasks(it) { return (it.subtasks || []).filter(s => !s.done); }

/* ---------- main screen ---------- */
function render() {
  if (!state) return;
  const paired = !!(syncCfg && syncCfg.key);
  $('#unpaired').classList.toggle('hidden', paired);
  $('#navtitle .t').textContent = SCREEN_TITLE[screen];
  $('#navtitle .l').style.visibility = screen === 'stack' ? 'hidden' : 'visible';
  $('#navtitle .r').style.visibility = screen === 'project' ? 'hidden' : 'visible';
  const list = $('#list');
  list.innerHTML = '';
  const keys = listFor(screen) || [];
  keys.forEach(key => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'block' + (moving === key ? ' moving' : '');
    btn.dataset.key = key;
    let name, meta = '';
    if (screen === 'project') {
      const it = state.items[key]; if (!it) return;
      const open = openSubtasks(it).length;
      name = esc(it.name); meta = `<span class="meta">${open} open</span>`;
    } else {
      const l = blockLabel(key), info = blockInfo(key);
      name = (l.proj ? `<span class="proj">${esc(l.proj)} ›</span> ` : '') + esc(l.name);
      if (info.kind === 'list' && info.it.subtasks.length) meta = `<span class="meta">${info.it.subtasks.filter(s => s.done).length}/${info.it.subtasks.length}</span>`;
      if (info.it.recurring && !info.b.subId) meta += '<span class="meta">↻</span>';
    }
    btn.innerHTML = `<span class="name">${name}</span>${meta}`;
    btn.addEventListener('keydown', e => blockKey(e, key));
    btn.addEventListener('click', () => { if (moving === key) { moving = null; save(); render(); toast('Moved'); } else openMenu(key); });
    btn.addEventListener('focus', () => { focusKey = key; });
    list.appendChild(btn);
  });
  const empty = $('#empty');
  empty.textContent = screen === 'stack' ? 'STACK is empty. Add things on your phone.' : `Nothing in ${SCREEN_TITLE[screen]}.`;
  empty.classList.toggle('hidden', !!keys.length);
  if (!overlayOpen) restoreFocus();
}
function restoreFocus() {
  const list = $('#list');
  const el = (focusKey && list.querySelector(`[data-key="${CSS.escape(focusKey)}"]`)) || list.querySelector('.block');
  (el || $('#navtitle')).focus({ preventScroll: false });
  if (el) el.scrollIntoView({ block: 'nearest' });
}
function goScreen(name) {
  if (!SCREENS.includes(name)) return;
  screen = name; moving = null; focusKey = null;
  render();
  $('#navtitle').focus();
}

/* Arrow keys on a block mirror the phone's swipes. Up/Down are left to the browser's own focus movement. */
function blockKey(e, key) {
  if (moving === key && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    const arr = listFor(screen).slice(), i = arr.indexOf(key);
    // Lists are drawn bottom-up, so Up means later in the array (lower priority).
    const j = e.key === 'ArrowUp' ? i + 1 : i - 1;
    if (j < 0 || j >= arr.length) return;
    arr.splice(i, 1); arr.splice(j, 0, key);
    setList(screen, arr); focusKey = key; render();
    return;
  }
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault();
  if (moving) return;
  const right = e.key === 'ArrowRight';
  if (screen === 'stack') {
    if (right) openComplete(key);
    else { const k = blockKind(key); focusNext(key); sendToBacklog(key); save(); render(); toast(state.blocks[key] ? `Sent to ${BACKLOG_TITLE[k]}` : 'Returned to project'); }
  } else if (right) {
    if (screen === 'project') openProjectSubs(key);
    else { focusNext(key); detach(key); state.stack.push(key); save(); render(); toast('Added to top of STACK'); }
  }
}
/* After a block leaves the list, focus its neighbour instead of jumping to the end. */
function focusNext(key) {
  const arr = listFor(screen), i = arr.indexOf(key);
  focusKey = arr[i - 1] || arr[i + 1] || null;
}

/* ---------- overlay (one history entry; Back closes it) ---------- */
function openOverlay(build) {
  const ov = $('#overlay');
  ov.innerHTML = '';
  build(ov);
  ov.classList.remove('hidden');
  if (!overlayOpen) { overlayOpen = true; history.pushState({ overlay: 1 }, ''); }
  const f = ov.querySelector('[data-autofocus]') || ov.querySelector('button, [tabindex="0"]');
  if (f) f.focus();
}
function closeOverlay() { if (overlayOpen) history.back(); }
window.addEventListener('popstate', () => {
  if (!overlayOpen) return;
  overlayOpen = false;
  $('#overlay').classList.add('hidden');
  $('#overlay').innerHTML = '';
  render();
});
function btn(label, fn, cls) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'opt' + (cls ? ' ' + cls : ''); b.textContent = label;
  b.addEventListener('click', fn);
  return b;
}
function head(ov, kicker, title) {
  const h = document.createElement('div'); h.className = 'ohead';
  h.innerHTML = `<div class="kicker"></div><div class="otitle"></div>`;
  h.querySelector('.kicker').textContent = kicker;
  h.querySelector('.otitle').textContent = title;
  ov.appendChild(h);
}

/* Enter on a block: the phone's hold. */
function openMenu(key) {
  const info = blockInfo(key); if (!info) return;
  openOverlay(ov => {
    head(ov, info.kind.toUpperCase(), keyName(key));
    const box = document.createElement('div'); box.className = 'opts';
    const add = (label, fn, cls) => box.appendChild(btn(label, fn, cls));
    if (screen === 'stack') {
      add('COMPLETE', () => openComplete(key));
      add(info.kind === 'subtask' ? 'BACK TO PROJECT' : 'TO BACKLOG', () => { closeOverlay(); focusNext(key); sendToBacklog(key); save(); });
    } else if (screen === 'project') {
      add('SUBTASKS', () => openProjectSubs(key));
    } else {
      add('ADD TO STACK', () => { closeOverlay(); focusNext(key); detach(key); state.stack.push(key); save(); toast('Added to top of STACK'); });
    }
    if (info.kind === 'list') add('SUBTASKS', () => openListSubs(info.it.id));
    if (hasNotes(info)) add('NOTES', () => openNotes(info.it));
    add('MOVE', () => { closeOverlay(); moving = key; focusKey = key; toast('↑ ↓ to move, then Enter'); });
    add('DELETE', () => confirmDelete(key, info), 'danger');
    ov.appendChild(box);
    box.firstChild.dataset.autofocus = '1';
  });
}
function confirmDelete(key, info) {
  openOverlay(ov => {
    head(ov, 'DELETE', keyName(key));
    const p = document.createElement('p'); p.className = 'note';
    p.textContent = info.kind === 'project' ? 'Deletes the whole project and its subtasks.' : info.kind === 'subtask' ? 'Deletes this subtask from its project.' : 'This can’t be undone here.';
    ov.appendChild(p);
    const row = document.createElement('div'); row.className = 'row';
    row.appendChild(btn('CANCEL', closeOverlay));
    row.appendChild(btn('DELETE', () => {
      closeOverlay(); focusNext(key);
      if (screen === 'project') deleteItem(key); else deleteBlockItem(key);
      save(); toast('Deleted');
    }, 'danger'));
    ov.appendChild(row);
    row.firstChild.dataset.autofocus = '1';
  });
}

/* Completing: pick when it happened with − / + (15 minutes), like the phone's drag. */
function openComplete(key) {
  const name = blockName(key);
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  let end = Math.min(1440, Math.max(30, Math.ceil(nowMin / 15) * 15)), start = end - 30;
  openOverlay(ov => {
    head(ov, 'COMPLETE', name);
    const mkRow = (label, get, set) => {
      const row = document.createElement('div'); row.className = 'trow';
      const lab = document.createElement('span'); lab.className = 'tlab'; lab.textContent = label;
      const val = document.createElement('span'); val.className = 'tval';
      const minus = btn('−', () => { set(get() - 15); paint(); }, 'small');
      const plus = btn('+', () => { set(get() + 15); paint(); }, 'small');
      minus.setAttribute('aria-label', `${label} 15 minutes earlier`); plus.setAttribute('aria-label', `${label} 15 minutes later`);
      row.append(lab, minus, val, plus); ov.appendChild(row);
      return val;
    };
    const sv = mkRow('START', () => start, v => { start = Math.max(0, Math.min(v, end - 15)); });
    const ev = mkRow('END', () => end, v => { end = Math.min(1440, Math.max(v, start + 15)); });
    const dur = document.createElement('p'); dur.className = 'note'; ov.appendChild(dur);
    function paint() {
      sv.textContent = minToClock(start); ev.textContent = minToClock(end % 1440);
      const m = end - start; dur.textContent = m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : `${m} min`;
    }
    paint();
    const go = btn('COMPLETE', () => {
      const t0 = parseDate(todayStr()).getTime();
      focusNext(key);
      const res = completeBlock(key, t0 + start * MIN, t0 + end * MIN);
      if (res) state.calQueue.push({ id: uid(), name: res.name, start: res.start, end: res.end });
      save(); closeOverlay(); toast(`Completed ${res ? res.name : ''}`);
    }, 'primary');
    go.dataset.autofocus = '1';
    ov.appendChild(go);
  });
}

/* A list's subtasks: → or Enter checks one off and it disappears. */
function openListSubs(itemId) {
  openOverlay(ov => {
    const it = state.items[itemId];
    head(ov, 'SUBTASKS', it.name);
    const list = document.createElement('div'); list.className = 'olist';
    ov.appendChild(list);
    const paint = (focusIdx) => {
      list.innerHTML = '';
      const open = openSubtasks(it);
      if (!open.length) { list.innerHTML = '<p class="note">All subtasks done.</p>'; return; }
      open.forEach((s, i) => {
        const b = btn(s.name, () => check(s, i), 'block');
        b.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); check(s, i); } });
        list.appendChild(b);
      });
      const bs = list.querySelectorAll('button');
      (bs[Math.min(focusIdx || 0, bs.length - 1)] || bs[0]).focus();
    };
    const check = (s, i) => { s.done = true; save(); toast(`Checked off ${s.name}`); paint(i); };
    paint(0);
  });
}
/* A project's subtasks: → adds one to the top of STACK; Enter offers add or delete. */
function openProjectSubs(projectId) {
  openOverlay(ov => {
    const it = state.items[projectId];
    head(ov, 'PROJECT', it.name);
    const list = document.createElement('div'); list.className = 'olist';
    ov.appendChild(list);
    const paint = (focusIdx) => {
      list.innerHTML = '';
      const open = openSubtasks(it);
      if (!open.length) { list.innerHTML = '<p class="note">No open subtasks. Add some on your phone.</p>'; return; }
      open.forEach(s => {
        const bid = findBlock(projectId, s.id), w = bid && whereBlock(bid);
        const b = btn('', () => subMenu(s), 'block');
        b.innerHTML = `<span class="name">${esc(s.name)}</span>${w === 'stack' ? '<span class="meta">STACK</span>' : ''}`;
        b.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); addSub(s); } });
        list.appendChild(b);
      });
      const bs = list.querySelectorAll('button');
      (bs[Math.min(focusIdx || 0, bs.length - 1)] || bs[0]).focus();
    };
    const idx = s => openSubtasks(it).indexOf(s);
    const addSub = s => { const msg = addToStack(projectId, s.id, 'top'); save(); toast(msg || 'Added to top of STACK'); paint(idx(s)); };
    const subMenu = s => {
      const i = idx(s);
      list.innerHTML = '';
      const p = document.createElement('p'); p.className = 'note'; p.textContent = s.name; list.appendChild(p);
      const add = btn('ADD TO STACK', () => addSub(s), 'opt'); list.appendChild(add);
      list.appendChild(btn('DELETE SUBTASK', () => {
        const bid = findBlock(projectId, s.id); if (bid) removeBlock(bid);
        it.subtasks = it.subtasks.filter(x => x.id !== s.id); save(); toast('Deleted'); paint(i);
      }, 'opt danger'));
      list.appendChild(btn('CANCEL', () => paint(i), 'opt'));
      add.focus();
    };
    paint(0);
  });
}
function openNotes(it) {
  openOverlay(ov => {
    head(ov, 'NOTES', it.name);
    const n = document.createElement('div'); n.className = 'notes'; n.tabIndex = 0; n.dataset.autofocus = '1';
    n.textContent = it.notes;
    ov.appendChild(n);
  });
}

/* ---------- boot ---------- */
async function boot() {
  history.replaceState({ home: 1 }, '');
  await loadState();
  syncDevice = 'glasses';
  onSyncAdopt = () => { if (!overlayOpen) render(); };
  const nav = $('#navtitle');
  nav.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    const i = SCREENS.indexOf(screen);
    // → walks out from STACK through the backlogs (like swiping right on the phone); ← walks back.
    goScreen(SCREENS[e.key === 'ArrowRight' ? i - 1 : i + 1]);
  });
  nav.addEventListener('click', () => goScreen('stack'));
  const arrived = runDueCheck();
  render();
  if (arrived.length) toast(`${arrived.length} recurring item${arrived.length > 1 ? 's' : ''} due today`);
  syncStart();
  setInterval(() => { if (state.lastDueCheck < todayStr()) { runDueCheck(); if (!overlayOpen) render(); } }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && syncConfigured()) syncFetch().then(syncReceive).catch(() => {}); });
}
boot();

</script>
