:root {
  --bg: #000; --g: #00ff41; --g2: #00c434; --dim: #0d6b24; --faint: #052e11; --hot: #d2ffdc;
  --font: "Share Tech Mono", "Roboto Mono", "Droid Sans Mono", monospace;
  --pad: clamp(16px, 4vw, 28px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body, #app { inline-size: 100%; block-size: 100%; }
body { margin: 0; background: var(--bg); color: var(--g); font-family: var(--font); font-size: clamp(18px, 4.4vw, 26px); overflow: hidden; }
button { font: inherit; color: inherit; }
.hidden { display: none !important; }

#app { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; padding: var(--pad); gap: 6px; }
#status { font-size: 0.6em; color: var(--dim); text-align: end; min-block-size: 1em; letter-spacing: .1em; }
#status.live { color: var(--g2); }
#main { min-block-size: 0; display: flex; flex-direction: column; position: relative; }

/* Lists sit at the bottom like the phone; the bottom block is highest priority. */
.list { flex: 1 1 auto; min-block-size: 0; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 6px; padding: 4px; }
.list > :last-child { margin-block-start: auto; }

.block { display: flex; align-items: center; gap: 12px; inline-size: 100%; min-block-size: 2.4em; padding: 0.4em 0.7em; text-align: start;
  background: var(--bg); color: var(--g); border: 2px solid var(--g); border-radius: 0; cursor: pointer; }
.block .name { flex: 1; min-inline-size: 0; overflow-wrap: anywhere; }
.block .proj { color: var(--g2); }
.block .meta { flex: none; font-size: 0.7em; color: var(--g2); }
/* Focus = the phone's solid green "selected" block, plus an outline so it isn't color alone. */
.block:focus-visible, .block:focus { border-color: var(--hot); outline: 3px solid var(--hot); outline-offset: 3px; box-shadow: 0 0 14px rgba(0, 255, 65, .5); }
.block.focused { background: var(--g); color: var(--bg); }
.block.focused .proj, .block.focused .meta { color: var(--bg); }
.block.moving { border-style: dashed; }
.block.moving::before { content: "↕"; }

#empty, .note { color: var(--g2); text-align: center; margin: auto 0; font-size: 0.85em; line-height: 1.35; }
#unpaired { margin: auto 0; text-align: center; line-height: 1.4; font-size: 0.9em; }
#unpaired p { margin: 0 0 0.8em; }

nav { display: flex; justify-content: center; }
#navtitle { background: none; border: 2px solid transparent; padding: 6px 14px; display: flex; gap: 16px; align-items: center; cursor: pointer; }
#navtitle .t { font-family: "OCR-A", var(--font); font-size: 1.15em; letter-spacing: .2em; text-shadow: 0 0 10px rgba(0, 255, 65, .55); white-space: nowrap; }
#navtitle .l, #navtitle .r { color: var(--dim); }
#navtitle:focus, #navtitle:focus-visible { border-color: var(--g); outline: 3px solid var(--hot); outline-offset: 3px; }

#overlay { position: fixed; inset: 0; background: var(--bg); padding: var(--pad); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.ohead { text-align: center; margin-block-end: 6px; }
.kicker { font-family: "OCR-A", var(--font); font-size: 0.75em; letter-spacing: .25em; color: var(--g2); }
.otitle { font-size: 1.1em; margin-block-start: 4px; overflow-wrap: anywhere; }
.opts, .olist { display: flex; flex-direction: column; gap: 8px; }
.olist { flex: 1 1 auto; min-block-size: 0; overflow-y: auto; padding: 4px; }
.opt { inline-size: 100%; padding: 0.45em; background: var(--bg); border: 2px solid var(--g); letter-spacing: .12em; cursor: pointer; }
.opt.danger { border-style: dashed; }
.opt.primary { margin-block-start: auto; }
.opt:focus, .opt:focus-visible { background: var(--g); color: var(--bg); outline: 3px solid var(--hot); outline-offset: 3px; }
.row { display: flex; gap: 10px; }
.row .opt { flex: 1; }
.trow { display: grid; grid-template-columns: 4.5em auto 1fr auto; align-items: center; gap: 10px; }
.tlab { font-size: 0.75em; color: var(--g2); letter-spacing: .15em; }
.tval { text-align: center; font-size: 1.1em; }
.opt.small { inline-size: 2.4em; padding: 0.3em 0; }
.notes { flex: 1; overflow-y: auto; white-space: pre-wrap; line-height: 1.45; border: 2px solid var(--dim); padding: 0.6em; }
.notes:focus { border-color: var(--g); outline: none; }

#toast { position: fixed; inset-inline: var(--pad); inset-block-start: var(--pad); background: var(--bg); border: 2px solid var(--g); padding: 0.4em 0.7em; font-size: 0.8em; text-align: center; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Leave room at the top for the confirmation message, and stack subtasks from the bottom like the phone. */
#overlay { padding-block-start: calc(var(--pad) + 2.2em); }
.olist { flex-direction: column-reverse; }
.olist > :last-child { margin-block-start: auto; }
/* SCHEDULE screen rows */
.evrow { cursor: default; }
.evrow .meta { flex: none; min-inline-size: 5.2em; }
.evrow:focus .meta { color: var(--bg); }
.asof { margin: 0 0 4px; font-size: 0.65em; }

/* Splash */
#splash { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
#splash img { inline-size: min(60vw, 60vh); block-size: auto; }
#splash.gone { opacity: 0; }

/* FOCUS */
#navtitle.focusmode .t { color: var(--hot); }
.hint { margin: 0; text-align: center; font-size: 0.6em; color: var(--g2); letter-spacing: .05em; }

/* Timeline (SCHEDULE and the planner): 1px per minute */
.tl { flex: 1 1 auto; min-block-size: 0; overflow-y: auto; position: relative; border: 2px solid transparent; }
.tl:focus { border-color: var(--dim); outline: none; }
.tl-head { position: sticky; inset-block-start: 0; z-index: 3; background: var(--bg); font-size: 0.6em; color: var(--g2); padding: 2px 4px 6px; }
.tl-grid { position: relative; margin-inline-start: 3.6em; margin-inline-end: 6px; }
.tl-hr { position: absolute; inset-inline: 0; border-block-start: 1px solid var(--faint); }
.tl-hr span { position: absolute; inset-inline-start: -3.6em; inline-size: 3.2em; text-align: end; font-size: 0.55em; color: var(--dim); transform: translateY(-50%); }
.tl-ev { position: absolute; inset-inline: 2px; overflow: hidden; font-size: 0.62em; padding: 2px 6px; border: 1px solid var(--g); color: var(--g); }
.tl-ev b { font-weight: 400; opacity: .8; }
.tl-ev.dim { border-color: var(--dim); color: var(--dim); }
.tl-now { position: absolute; inset-inline: -6px 0; block-size: 2px; background: var(--hot); z-index: 2; }
.tl-sel { position: absolute; inset-inline: 0; z-index: 4; background: rgba(0, 255, 65, .2); border: 2px solid var(--g); color: var(--g); font: inherit; font-size: 0.65em; text-align: start; padding: 2px 8px; cursor: pointer; }
.tl-sel:focus { outline: 3px solid var(--hot); outline-offset: 2px; }

/* SETTINGS (read-only) */
.gset { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; justify-content: flex-end; }
.gsrow { display: flex; justify-content: space-between; gap: 12px; border: 2px solid var(--dim); padding: 0.35em 0.6em; font-size: 0.8em; }
.gsrow .k { color: var(--g2); }
.gsrow:focus { border-color: var(--hot); outline: none; }
.gset .note { margin: 6px 0 0; }

/* Full screens on top: kind at the top, the name at the bottom (like the phone) */
.okind { font-size: 0.6em; letter-spacing: .2em; color: var(--g2); }
#overlay .olist { flex-direction: column-reverse; }
#overlay .olist > :last-child { margin-block-start: auto; }
#overlay .notes { flex: 1; }
#overlay .tl { flex: 1; }
.oinfo { margin: 0; font-size: 0.6em; color: var(--g2); text-align: center; }
.olabel { align-self: center; background: none; border: 2px solid transparent; padding: 6px 14px; display: flex; gap: 16px; align-items: center; cursor: pointer; max-inline-size: 100%; }
.olabel .t { font-family: "OCR-A", var(--font); font-size: 1.05em; letter-spacing: .18em; text-shadow: 0 0 10px rgba(0, 255, 65, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.olabel .l, .olabel .r { color: var(--dim); }
.olabel:focus { border-color: var(--g); outline: 3px solid var(--hot); outline-offset: 3px; }
/* v1.12: lists are two blocks tall (name at the bottom); a task stuck 3+ days on STACK is nudged */
.block.tall { align-items: flex-end; }   /* height set per block from its open subtasks */
.block.static { border-style: dashed; animation: gstale 2.6s ease-in-out infinite; }
.block.static .nudge { color: var(--hot); }
.block.focused.static .nudge { color: var(--bg); }
@keyframes gstale { 50% { box-shadow: 0 0 14px rgba(0, 255, 65, .45); } }
#overlay.slidein { animation: gslide .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes gslide { from { transform: translateX(100%); } to { transform: translateX(0); } }
.opt.addcal { flex: none; }
.tl-sel { display: flex; align-items: flex-end; font-size: 0.75em; }

/* FOCUS: the other blocks vanish but keep their space, so the FOCUS block stays where it was */
.block.unseen { visibility: hidden; }
.hint { min-block-size: 1.3em; }

/* Scheduling for another day */
.oname { flex: none; cursor: default; }
.dayrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-block: 10px; }
.dayrow .tval { text-align: center; font-size: 1.1em; }
.opt.small:disabled { opacity: .3; }

/* ===== 2.0 viewer ===== */
.gscores { display: flex; justify-content: space-between; font-family: "OCR-A", var(--font); font-size: 0.6em; letter-spacing: .15em; color: var(--g2); }
.gscores b { font-weight: 400; color: var(--g); font-size: 1.5em; margin-inline-start: 6px; }
.garea { flex: 1 1 auto; min-block-size: 0; overflow-y: auto; display: flex; flex-direction: column; }
.gcap { flex: none; margin-block-start: auto; border-block-start: 2px dashed var(--g); display: flex; flex-direction: column; }
.gcap .list { flex: 1; overflow: visible; padding: 4px 18px; }
.block.sized { align-items: flex-end; }
.block.active::before, .block.active::after { content: ""; position: absolute; bottom: calc(1.2em - 7px); border: 7px solid transparent; }   /* the bottom row */
.block { position: relative; }
.block.active::before { left: -16px; border-left: 9px solid var(--g); }
.block.active::after { right: -16px; border-right: 9px solid var(--g); }
.block.carry { border-color: #ff3b3b; color: #ff5a5a; }
.block.carry .meta, .block.carry .proj { color: #ff8080; }
.block.carry:focus { border-color: #ff8a8a; outline-color: #ff8a8a; }
.block.carry.active::before { border-left-color: #ff3b3b; }
.block.carry.active::after { border-right-color: #ff3b3b; }
#navtitle { display: flex; justify-content: center; padding: 6px 14px; }
#navtitle .t { font-family: "OCR-A", var(--font); font-size: 1.15em; letter-spacing: .2em; text-shadow: 0 0 10px rgba(0, 255, 65, .55); }
.olabel { align-self: center; padding: 6px 14px; }
.olabel .t { font-family: "OCR-A", var(--font); font-size: 1.05em; letter-spacing: .18em; }

/* 2.1: progress bar */
.gprog { position: relative; padding-block-start: 1.3em; }
.gprog .pcall { position: absolute; top: 0; text-align: center; font-size: 0.5em; letter-spacing: .12em; color: var(--g2); white-space: nowrap; }
.gprog .pcall b { font-weight: 400; color: var(--g); }
.gprog .pbar { position: relative; block-size: 0.55em; border: 1px solid var(--dim); }
.gprog .pdone { position: absolute; inset-block: 0; left: 0; background: var(--g); }
.gprog .pleft { position: absolute; inset-block: 2px; border: 1px dashed var(--g2); }
.gprog .pcap { position: absolute; top: -6px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--hot); }
.gprog .pnums { display: flex; justify-content: space-between; margin-block-start: 4px; font-size: 0.5em; letter-spacing: .14em; color: var(--g2); }
.gprog .pnums b { font-weight: 400; color: var(--g); font-size: 1.3em; margin-inline-start: 4px; }

/* 2.2: MOMENTUM / TODAY; no capacity line */
.gscores { display: flex; justify-content: space-between; font-family: "OCR-A", var(--font); font-size: 0.6em; letter-spacing: .15em; color: var(--g2); }
.gscores b { font-weight: 400; color: var(--g); font-size: 1.5em; margin-inline-start: 6px; }
.garea > .list { flex: 1 0 auto; overflow: visible; padding: 4px 18px; }

</style>
</head>

/* Paradigm: state, persistence and model rules */
'use strict';

const MIN = 60000, HALF = 30 * MIN, DAY = 24 * 60 * MIN;
let state = null;
let idb = null;

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
function dateStr(d) { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const todayStr = () => dateStr(Date.now());
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function floor30(ms) { const d = new Date(ms); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() < 30 ? 0 : 30); return d.getTime(); }
function ceilHalf(ms) { return Math.max(1, Math.ceil(ms / HALF)) * HALF; }
const Q15 = 15 * MIN;
function nextQuarter(ms) { const d = new Date(ms); if (d.getSeconds() || d.getMilliseconds() || d.getMinutes() % 15) { d.setSeconds(0, 0); d.setMinutes(Math.floor(d.getMinutes() / 15) * 15 + 15); } return d.getTime(); }

function minToClock(min) { const h = Math.floor(min / 60) % 24, m = min % 60; const ap = h < 12 ? 'AM' : 'PM'; const h12 = h % 12 || 12; return `${h12}:${pad(m)} ${ap}`; }

function fmtDur(ms) { ms = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(ms / 3600), m = Math.floor(ms % 3600 / 60), s = ms % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- persistence (IndexedDB) ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('paradigm', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbGet(k) {
  return new Promise((res, rej) => {
    const q = idb.transaction('kv').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
function idbSet(k, v) {
  return new Promise((res, rej) => {
    const t = idb.transaction('kv', 'readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

function freshState() {
  return {
    v: 4, items: {}, blocks: {}, stack: [], backlogs: { project: [], list: [], task: [] }, running: null,
    lastDueCheck: todayStr(),
    calQueue: [],   // schedules made on the glasses, waiting for the phone to add them to Google Calendar
    dayCache: null, // today's calendar as last loaded by the phone, for the glasses' SCHEDULE screen
    calImportDate: '', // the day today's calendar events were last added to STACK
    score: { momentum: 8, today: 0, date: todayStr() },   // MOMENTUM is also STACK's capacity, in rows
    settings: { clientId: '', connected: false, paradigmCalId: '', driveFileId: '', lastBackup: 0 },
    auth: { token: '', exp: 0 }

}
function normalize(s) {
  const f = freshState();
  // v1 -> v2: one backlog becomes three; the placement queue goes to the top of STACK.
  if (!s.backlogs) {
    s.backlogs = { project: [], list: [], task: [] };
    (s.backlog || []).forEach(bid => { const k = blockKind(bid, s); if (k) s.backlogs[k].push(bid); });
  }
  if (Array.isArray(s.placing)) { s.stack = (s.stack || []).concat(s.placing); }
  delete s.backlog; delete s.placing;
  // v3: PROJECT BACKLOG holds projects (item ids), not subtask blocks.
  if ((s.v || 1) < 3) { s.backlogs.project = []; s.v = 3; }
  // v4: no FOCUS timer. Anything mid-session goes back to the bottom of STACK.
  if (s.running) { s.stack = [s.running.bid].concat((s.stack || []).filter(b => b !== s.running.bid)); s.running = null; }
  // v5 (2.0): sizes, MOMENTUM/TODAY, no recurring inside Paradigm (repeats live in Google Calendar).
  for (const it of Object.values(s.items || {})) {
    if (it.type !== 'event' && !(it.size >= 1 && it.size <= 4)) it.size = 1;
    if (it.recurring) { it.recurring = false; it.recSubtasks = false; }
    if (it.type === 'project') (it.subtasks || []).forEach(x => { if (!(x.size >= 1 && x.size <= 4)) x.size = 1; });
  }
  s.v = 5;
  for (const k of Object.keys(f)) if (s[k] === undefined) s[k] = f[k];
  s.settings = Object.assign(f.settings, s.settings || {});
  for (const it of Object.values(s.items || {})) if (it.type === 'task' && !Array.isArray(it.subtasks)) it.subtasks = [];   // v1.11: tasks hold subtasks
  s.auth = Object.assign(f.auth, s.auth || {});
  s.score = Object.assign({ momentum: 8, today: 0, date: todayStr() }, s.score || {});
  return s;
}

let saveTimer = null;
function save(opts) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 200);
  if (!(opts && opts.noBackup) && typeof scheduleBackup === 'function') scheduleBackup();
  if (!(opts && opts.noSync) && typeof scheduleSync === 'function') scheduleSync();
}
function flush() { clearTimeout(saveTimer); if (idb && state) return idbSet('state', state).catch(e => console.error(e)); }

async function loadState() {
  idb = await idbOpen();
  const s = await idbGet('state');
  state = normalize(s || freshState());
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  repair();
}

/* Keep lists consistent: drop dead blocks, rescue orphans into the backlog. */
function repair() {
  const seen = new Set();
  const clean = arr => arr.filter(b => {
    const ok = state.blocks[b] && state.items[state.blocks[b].itemId] && !seen.has(b);
    if (ok) seen.add(b); return ok;
  });
  if (state.running && !(state.blocks[state.running.bid] && state.items[state.blocks[state.running.bid].itemId])) state.running = null;
  if (state.running) seen.add(state.running.bid);
  state.stack = clean(state.stack);
  for (const k of BLOCK_KINDS) state.backlogs[k] = clean(state.backlogs[k] || []);
  // PROJECT BACKLOG lists every project, by item id.
  const pseen = new Set();
  state.backlogs.project = (state.backlogs.project || []).filter(id => state.items[id] && state.items[id].type === 'project' && !pseen.has(id) && pseen.add(id));
  for (const it of Object.values(state.items)) if (it.type === 'project' && !pseen.has(it.id)) state.backlogs.project.push(it.id);
  for (const [bid, b] of Object.entries(state.blocks)) {
    const it = state.items[b.itemId];
    if (!it || (b.subId && !(it.subtasks || []).some(s => s.id === b.subId))) { delete state.blocks[bid]; continue; }
    if (seen.has(bid)) continue;
    if (b.subId) delete state.blocks[bid];   // a loose subtask simply returns to its project
    else state.backlogs[blockKind(bid)].push(bid);
  }
  // Every task and list that isn't on STACK or in FOCUS lives in its backlog, recurring ones included.
  for (const it of Object.values(state.items)) placeInBacklog(it.id);
}

/* ---------- model queries ---------- */
const TYPES = { task: 'TASK', list: 'LIST', event: 'EVENT', project: 'PROJECT' };
const KINDS = ['project', 'list', 'task'];
const BLOCK_KINDS = ['list', 'task'];
const BACKLOG_TITLE = { project: 'PROJECT BACKLOG', list: 'LIST BACKLOG', task: 'TASK BACKLOG' };
/* Which backlog a block belongs to: project subtasks -> project, otherwise the item's type. */
function blockKind(bid, s) {
  s = s || state;
  const b = s.blocks[bid]; if (!b) return null;
  if (b.subId) return 'project';
  const it = s.items[b.itemId]; if (!it) return null;
  return it.type === 'list' ? 'list' : 'task';
}
function inBacklog(bid) { return BLOCK_KINDS.some(k => state.backlogs[k].includes(bid)); }
function itemByName(name) {
  const n = name.trim().toLowerCase();
  return Object.values(state.items).find(i => i.name.trim().toLowerCase() === n) || null;
}
function findBlock(itemId, subId) {
  return Object.keys(state.blocks).find(b => state.blocks[b].itemId === itemId && (state.blocks[b].subId || null) === (subId || null)) || null;
}
function whereBlock(bid) {
  if (state.running && state.running.bid === bid) return 'running';
  if (state.stack.includes(bid)) return 'stack';
  if (inBacklog(bid)) return 'backlog';
  return null;
}
function detach(bid) {
  state.stack = state.stack.filter(b => b !== bid);
  for (const k of BLOCK_KINDS) state.backlogs[k] = state.backlogs[k].filter(b => b !== bid);
}
function removeBlock(bid) {
  detach(bid);
  if (state.running && state.running.bid === bid) state.running = null;
  delete state.blocks[bid];
}
function blockLabel(bid) {
  const b = state.blocks[bid], it = state.items[b.itemId];
  if (b.subId) { const s = it.subtasks.find(x => x.id === b.subId); return { proj: it.name, name: s ? s.name : '?' }; }
  return { proj: null, name: it.name };
}
function blockName(bid) { const l = blockLabel(bid); return l.proj ? `${l.proj}: ${l.name}` : l.name; }

function newItem(type, name) {
  const it = { id: uid(), type, name: name.trim(), created: Date.now(), size: 1 };
  if (type === 'task') Object.assign(it, { notes: '', subtasks: [], recurring: false, schedule: { freq: 'none' } });
  if (type === 'list') Object.assign(it, { subtasks: [], recurring: false, recSubtasks: false, schedule: { freq: 'none' } });
  if (type === 'project') Object.assign(it, { subtasks: [], recurring: false });
  if (type === 'event') Object.assign(it, { event: null });
  return it;
}
function deleteItem(id) {
  for (const bid of Object.keys(state.blocks)) if (state.blocks[bid].itemId === id) removeBlock(bid);
  delete state.items[id];
  state.backlogs.project = state.backlogs.project.filter(x => x !== id);
}
/* Puts a task or list with no block anywhere onto the top (lowest priority) of its backlog. */
function placeInBacklog(itemId) {
  const it = state.items[itemId];
  if (!it || (it.type !== 'task' && it.type !== 'list') || findBlock(itemId, null)) return false;
  const bid = uid();
  state.blocks[bid] = { bid, itemId, subId: null, elapsed: 0 };
  state.backlogs[it.type].push(bid);
  return true;
}
/* Changing what an item is:
   task -> list when it gets its first subtask (OPTIONS keeps it a list from then on);
   task or list -> project (OPTIONS → Project): it leaves STACK and its backlog and lives in PROJECT BACKLOG;
   project -> list (or task, with no subtasks) when Project is unchecked. */
function convertItem(id, toType) {
  const it = state.items[id]; if (!it || it.type === toType) return;
  const from = it.type;
  if (toType === 'project') {
    const bid = findBlock(id, null); if (bid) removeBlock(bid);
    it.type = 'project'; it.subtasks = it.subtasks || [];
    listProject(id);
    return;
  }
  if (from === 'project') {
    for (const bid of Object.keys(state.blocks)) if (state.blocks[bid].itemId === id && state.blocks[bid].subId) removeBlock(bid);
    state.backlogs.project = state.backlogs.project.filter(x => x !== id);
  }
  it.type = toType;
  Object.assign(it, { subtasks: it.subtasks || [], recurring: !!it.recurring, schedule: it.schedule || { freq: 'none' } });
  if (toType === 'list' && it.recSubtasks === undefined) it.recSubtasks = false;
  // A block sitting in the task backlog follows it to the list backlog (same spot), and back.
  const bid = findBlock(id, null);
  if (bid) for (const k of ['task', 'list']) {
    const i = state.backlogs[k].indexOf(bid);
    if (i >= 0 && k !== toType) { state.backlogs[k].splice(i, 1); state.backlogs[toType].splice(Math.min(i, state.backlogs[toType].length), 0, bid); }

}
/* A list with nothing left to do turns back into a task (and moves back to TASK BACKLOG if it's there).
   A recurring list with recurring subtasks keeps its checked-off subtasks for next time, so it stays a list. */
function listIsEmpty(it) {
  return it && it.type === 'list' && !(it.subtasks || []).some(s => !s.done) && !(it.recurring && it.recSubtasks && (it.subtasks || []).length);
}
function maybeRevertToTask(id) {
  const it = state.items[id];
  if (!listIsEmpty(it)) return false;
  it.subtasks = [];
  convertItem(id, 'task');
  return true;
}
/* ---------- size and capacity ----------
   Size (1-4) is how much a block weighs: its height in rows on STACK and its points when completed.
   Project subtasks have their own size; list subtasks don't. STACK holds at most MOMENTUM rows. */
function clampSize(n) { return Math.max(1, Math.min(4, Math.round(Number(n) || 1))); }
function blockSize(bid) {
  const b = state.blocks[bid]; if (!b) return 1;
  const it = state.items[b.itemId]; if (!it) return 1;
  if (b.subId) { const x = (it.subtasks || []).find(y => y.id === b.subId); return clampSize(x && x.size); }
  return clampSize(it.size);
}
function projectSize(it) { return (it.subtasks || []).filter(x => !x.done).reduce((n, x) => n + clampSize(x.size), 0); }
function stackLoad() { return state.stack.reduce((n, bid) => n + blockSize(bid), 0); }
/* CAPACITY: the rolling average of difficulty completed per day over the last CAP_DAYS days you used Paradigm,
   rounded down (8 until there's history). RESET in SETTINGS starts it over from a baseline. */
const CAP_DAYS = 7;
function capacity() {
  const h = (state.score.history || []).slice(-CAP_DAYS);
  if (!h.length) return Math.max(1, state.score.base || 8);
  return Math.max(1, Math.floor(h.reduce((n, d) => n + d.done, 0) / h.length));
}
function fits(rows) { return stackLoad() + rows <= capacity(); }
const NO_ROOM = 'STACK is at capacity (see SCHEDULE)';

/* TODAY adds the difficulty of what you complete; MOMENTUM rises to TODAY and never drops (except a RESET). */
function addPoints(n) {
  const sc = state.score;
  if (sc.date !== todayStr()) dayRollover();
  sc.today += n;
  if (sc.today > sc.momentum) sc.momentum = sc.today;
}
/* A new day: everything still on STACK carries over and turns red (MOMENTUM is untouched).
   Red blocks can only be completed, or go through SUPPORT. Returns how many carried over. */
function dayRollover() {
  const today = todayStr(), sc = state.score;
  if (sc.date >= today) return 0;
  let carried = 0;
  for (const bid of state.stack) { const b = state.blocks[bid]; if (!b) continue; if (!b.carried) carried++; b.carried = true; }
  // The day that just ended goes into the capacity average.
  sc.history = (sc.history || []).concat({ date: sc.date, done: sc.today || 0 }).slice(-60);
  sc.today = 0; sc.date = today;
  return carried || -1;   // -1: a new day with nothing newly carried (still worth saving)
}
function isCarried(bid) { const b = state.blocks[bid]; return !!(b && b.carried && state.stack.includes(bid)); }

function listProject(id) { if (!state.backlogs.project.includes(id)) state.backlogs.project.push(id); }

/* Adds an item (or project subtask) to STACK. where: 'top' (lowest priority, from a backlog)
   or 'bottom' (highest priority, new from the STACK input). Returns a message or null. */
function addToStack(itemId, subId, where) {
  let bid = findBlock(itemId, subId);
  const w = bid && whereBlock(bid);
  if (w === 'stack') return 'Already on STACK';
  const it = state.items[itemId];
  const size = subId ? clampSize(((it && it.subtasks) || []).find(x => x.id === subId)?.size) : clampSize(it && it.size);
  if (!fits(size)) return NO_ROOM;
  if (w === 'backlog') detach(bid);
  if (!bid) { bid = uid(); state.blocks[bid] = { bid, itemId, subId: subId || null, elapsed: 0 }; }
  delete state.blocks[bid].carried;
  if (where === 'bottom') state.stack.unshift(bid); else state.stack.push(bid);
  return null;
}
/* Deletes what a block stands for: the task or list, or just the subtask for a project subtask. */
function deleteBlockItem(bid) {
  const b = state.blocks[bid]; if (!b) return;
  if (b.subId) {
    const it = state.items[b.itemId];
    if (it) it.subtasks = it.subtasks.filter(s => s.id !== b.subId);
    removeBlock(bid);
  } else deleteItem(b.itemId);
}
/* ---------- scheduling an item to another day ----------
   It becomes an all-day event on the Paradigm calendar and leaves STACK / its backlog. Its subtasks and notes
   travel with the event (readable checklist + a hidden copy) and come back when that day's calendar is pulled in.
   A project subtask leaves its project and returns as its own task. */
/* Removes the item (or project subtask) and queues its all-day event. Returns the queue entry. */
function scheduleBlockToDay(bid, date) {
  const b = state.blocks[bid]; if (!b) return null;
  const it = state.items[b.itemId]; if (!it) return null;
  let entry;
  if (b.subId) {
    const sub = (it.subtasks || []).find(x => x.id === b.subId);
    entry = { id: uid(), kind: 'allday', date, name: sub ? sub.name : '?', rrule: null, payload: { type: 'task', subtasks: [], notes: '', size: clampSize(sub && sub.size) } };
    it.subtasks = (it.subtasks || []).filter(x => x.id !== b.subId);
    removeBlock(bid);
  } else {
    const open = (it.subtasks || []).filter(x => !x.done).map(x => x.name);
    entry = { id: uid(), kind: 'allday', date, name: it.name, rrule: null,
      payload: { type: open.length ? 'list' : 'task', subtasks: open, notes: it.notes || '', size: clampSize(it.size) } };
    deleteItem(it.id);
  }
  entry.at = Date.now();   // posted after the undo window (see processCalQueue)
  state.calQueue.push(entry);
  return entry;
}

/* Sends a block to the bottom (highest priority) of its backlog. Project subtasks return to their project. */
function sendToBacklog(bid) {
  if (state.blocks[bid].subId) { removeBlock(bid); return; }
  detach(bid);
  state.backlogs[blockKind(bid)].unshift(bid);
}

/* Repeating things now live in Google Calendar (they arrive with the daily import). */
function runDueCheck() { state.lastDueCheck = todayStr(); return []; }

/* ---------- completion ---------- */
/* Completes a block: it leaves STACK, nothing goes on the calendar, and TODAY gains its size. Returns { name, size }. */
function completeBlock(bid) {
  const b = state.blocks[bid]; if (!b) return null;
  const it = state.items[b.itemId];
  const res = { name: blockName(bid), size: blockSize(bid) };
  if (b.subId) it.subtasks = it.subtasks.filter(x => x.id !== b.subId);
  else delete state.items[it.id];
  removeBlock(bid);
  addPoints(res.size);
  save();
  return res;
}
/* SUPPORT's answer is always the same: split it. The original becomes a project (PROJECT BACKLOG) and the
   pieces ("Original: Piece", each with a size) take its place on STACK, as many as fit; the rest wait in the
   project. From a backlog, the pieces simply stay in the project. Returns how many went on STACK. */
function splitIntoProject(bid, pieces, notes) {
  const b = state.blocks[bid]; if (!b) return 0;
  let it = state.items[b.itemId]; if (!it) return 0;
  const pos = state.stack.indexOf(bid);
  const fresh = pieces.map(p => ({ id: uid(), name: p.name, done: false, size: clampSize(p.size) }));
  if (b.subId) {
    // A project subtask: its pieces replace it inside the same project.
    const i = it.subtasks.findIndex(x => x.id === b.subId);
    it.subtasks.splice(Math.max(0, i), i >= 0 ? 1 : 0, ...fresh);
  } else {
    const old = (it.subtasks || []).filter(x => !x.done).map(x => ({ id: x.id, name: x.name, done: false, size: 1 }));
    it.type = 'project'; it.subtasks = fresh.concat(old);
    if (notes) it.notes = (it.notes ? it.notes + '\n' : '') + notes;
    delete it.recurring; delete it.recSubtasks; delete it.schedule;
  }
  removeBlock(bid);
  listProject(it.id);
  let placed = 0;
  if (pos >= 0) {
    let at = pos;
    for (const p of fresh) {
      if (!fits(p.size)) break;
      const nb = uid(); state.blocks[nb] = { bid: nb, itemId: it.id, subId: p.id, elapsed: 0 };
      state.stack.splice(at++, 0, nb); placed++;
    }
  }
  return placed;
}

/* Paradigm: phone <-> glasses sync through a free Firebase Realtime Database.
   Both devices keep a full local copy. Every change is written as one small record:
     /paradigm/<key>/state.json = { rev, by, at, data: "<the shared state as JSON text>" }
   The higher rev wins. Each device listens for the other's writes (server-sent events). */
'use strict';

const SYNC_FIELDS = ['items', 'blocks', 'stack', 'backlogs', 'lastDueCheck', 'calQueue', 'dayCache', 'calImportDate', 'score'];
let syncCfg = null;            // { db, key }
let syncDevice = 'phone';
let syncRev = 0, syncLastSent = '', syncTimer = null, syncES = null, syncPoll = null;
let syncStatus = 'off';        // off | connecting | live | offline
let onSyncAdopt = null;        // callback after remote data is applied
let syncDeferred = null;       // remote record waiting for a drag to finish

function syncConfigured() { return !!(syncCfg && syncCfg.db && syncCfg.key); }
function syncUrl() { return `${syncCfg.db.replace(/\/+$/, '')}/paradigm/${encodeURIComponent(syncCfg.key)}/state.json`; }

function newSyncKey() { const a = new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a, b => b.toString(36).padStart(2, '0')).join('').slice(0, 32); }

/* Called by save(): push shortly after a change. */
function scheduleSync() {
  if (!syncConfigured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncPush, 600);
}
async function syncPush() {
  if (!syncConfigured()) return;
  const data = syncPayload();
  if (data === syncLastSent) return;
  const retry = () => { setSyncStatus('offline'); clearTimeout(syncTimer); syncTimer = setTimeout(syncPush, 5000); };
  // Always look at the server first. If we can't, wait and try again: never write blind.
  let cur;
  try { cur = await syncFetch(); } catch (e) { retry(); return; }
  if (cur && cur.rev > syncRev) {
    // The server has changes this device hasn't seen yet (the other device wrote since our last sync,
    // or this device just woke up with an old copy). Never write over them: take the server's version.
    if (cur.data === data) { syncRev = cur.rev; syncLastSent = data; saveSyncMeta(); return; }
    syncReceive(cur);
    if (typeof onSyncConflict === 'function') onSyncConflict();
    return;
  }
  const rec = { rev: Math.max(syncRev, cur ? cur.rev : 0) + 1, by: syncDevice, at: Date.now(), data };
  try {
    const r = await fetch(syncUrl(), { method: 'PUT', body: JSON.stringify(rec) });
    if (!r.ok) throw new Error('sync ' + r.status);
    syncRev = rec.rev; syncLastSent = data; saveSyncMeta();
    if (syncStatus !== 'live') setSyncStatus(syncES ? 'live' : 'connecting');
  } catch (e) { retry(); }
}

/* Applies a record from the other device if it's newer than what we have. */
function syncReceive(rec) {
  if (!rec || typeof rec !== 'object' || !rec.data) return;
  if (rec.rev <= syncRev) return;
  if (rec.by === syncDevice && rec.data === syncLastSent) { syncRev = rec.rev; saveSyncMeta(); return; }
  if (typeof dragCtx !== 'undefined' && dragCtx) { syncDeferred = rec; return; }
  let incoming;
  try { incoming = JSON.parse(rec.data); } catch (e) { return; }
  SYNC_FIELDS.forEach(k => { if (incoming[k] !== undefined) state[k] = incoming[k]; });
  if (!state.calQueue) state.calQueue = [];
  repair();
  syncRev = rec.rev; syncLastSent = syncPayload(); saveSyncMeta();
  save({ noSync: true, noBackup: false });
  if (onSyncAdopt) onSyncAdopt();
}
setInterval(() => { if (syncDeferred && !(typeof dragCtx !== 'undefined' && dragCtx)) { const r = syncDeferred; syncDeferred = null; syncReceive(r); } }, 500);

async function syncFetch() {
  const r = await fetch(syncUrl(), { cache: 'no-store' });
  if (!r.ok) throw new Error('sync ' + r.status);
  return r.json();
}

/* Connects: pulls the latest record, pushes ours if we're ahead, then listens live. */
async function syncStart() {
  syncStop();
  if (!syncConfigured()) { setSyncStatus('off'); return; }
  setSyncStatus('connecting');
  try {
    const rec = await syncFetch();
    if (rec && rec.rev > syncRev) syncReceive(rec);                     // newer on the server: take it
    else if (rec && rec.data === syncPayload()) { syncLastSent = rec.data; if (rec.rev > syncRev) { syncRev = rec.rev; saveSyncMeta(); } }  // already the same
    else { syncLastSent = ''; await syncPush(); }                       // ours has changes the server hasn't got yet
  } catch (e) { setSyncStatus('offline'); }
  try {
    syncES = new EventSource(syncUrl());
    syncES.addEventListener('put', ev => {
      setSyncStatus('live');
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.path === '/') syncReceive(msg.data);
      else syncFetch().then(syncReceive).catch(() => {});
    });
    syncES.addEventListener('patch', () => { syncFetch().then(syncReceive).catch(() => {}); });
    syncES.addEventListener('keep-alive', () => setSyncStatus('live'));
    syncES.onopen = () => setSyncStatus('live');
    syncES.onerror = () => setSyncStatus('offline');
  } catch (e) { /* polling below still works */ }
  // Safety net in case live updates drop silently.
  syncPoll = setInterval(() => { if (!document.hidden) syncFetch().then(syncReceive).catch(() => setSyncStatus('offline')); }, 20000);
}
function syncStop() {
  if (syncES) { syncES.close(); syncES = null; }
  clearInterval(syncPoll); syncPoll = null;
}

/* Paradigm for Meta Ray-Ban Display (2.0): a viewer for STACK.
   It shows STACK (sizes as rows, the active block marked, carry-overs in red) with MOMENTUM and TODAY.
   Enter on a block opens its subtasks; → swipes one off (completes it). Back closes. Nothing else:
   adding, completing blocks, scheduling and SUPPORT happen on the phone. */
'use strict';

const GLASSES_VERSION = '2.2.0';
const $ = (s, r) => (r || document).querySelector(s);
const LS_KEY = 'paradigm.glasses.v1';
let focusKey = null, overlayOpen = false, overlayRefresh = null;

/* ---------- storage + sync (replaces the phone's IndexedDB versions in store.js) ---------- */
async function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { saved = null; }
  const q = new URLSearchParams(location.search);
  const cfg = q.get('db') && q.get('k') ? { db: q.get('db'), key: q.get('k') } : (saved && saved.cfg) || null;
  // A different pairing link means a different phone: start clean.
  const samePair = saved && saved.cfg && cfg && saved.cfg.key === cfg.key;
  state = normalize(samePair && saved.state ? saved.state : freshState());
  syncRev = samePair ? (saved.rev || 0) : 0;
  syncCfg = cfg;
  repair();
}
function flush() {
  try {
    const keep = {}; SYNC_FIELDS.forEach(k => { keep[k] = state[k]; });
    localStorage.setItem(LS_KEY, JSON.stringify({ state: keep, rev: syncRev, cfg: syncCfg }));
  } catch (e) { /* storage full or unavailable: sync still holds the data */ }
}
function saveSyncMeta() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 200); }
function onSyncConflict() { toast('Updated from your phone. Redo your last change if it’s missing'); }
const SYNC_TEXT = { live: '● SYNCED', connecting: '○ CONNECTING', offline: '○ OFFLINE', off: '' };
function onSyncStatus(s) {
  const el = $('#status'); if (!el) return;
  el.textContent = SYNC_TEXT[s] || ''; el.className = s;
  if (screen === 'settings' && !overlayLayer) renderSettings();
}

/* ---------- helpers ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 3000);
}
function onSyncConflict() { toast('Updated from your phone'); }

/* ---------- STACK ---------- */
function render() {
  if (!state) return;
  $('#unpaired').classList.toggle('hidden', !!(syncCfg && syncCfg.key));
  $('#sc-m').textContent = state.score.momentum;
  $('#sc-t').textContent = state.score.date === todayStr() ? state.score.today : 0;
  const list = $('#list');
  list.innerHTML = '';
  state.stack.forEach((bid, i) => {
    const b = state.blocks[bid], it = b && state.items[b.itemId]; if (!it) return;
    const size = blockSize(bid), l = blockLabel(bid);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'block' + (i === 0 ? ' active' : '') + (isCarried(bid) ? ' carry' : '') + (size > 1 ? ' sized' : '');
    btn.dataset.key = bid;
    if (size > 1) btn.style.minBlockSize = `calc(${size} * 2.4em + ${size - 1} * 6px)`;
    const open = !b.subId ? (it.subtasks || []).filter(s => !s.done).length : 0;
    btn.innerHTML = `<span class="name">${l.proj ? `<span class="proj">${esc(l.proj)}:</span> ` : ''}${esc(l.name)}</span>${open ? `<span class="meta">${open} ▸</span>` : ''}`;
    btn.addEventListener('click', () => openSubtasks(bid));
    btn.addEventListener('focus', () => { focusKey = bid; });
    list.appendChild(btn);
  });
  $('#empty').classList.toggle('hidden', !!state.stack.length);
  if (!overlayOpen) {
    const el = (focusKey && list.querySelector(`[data-key="${CSS.escape(focusKey)}"]`)) || list.querySelector('.block');
    if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); }
  }
}

/* ---------- a block's subtasks: → completes one (it disappears) ---------- */
function openSubtasks(bid) {
  const b = state.blocks[bid]; if (!b) return;
  const id = b.itemId, cur = () => state.items[id];
  if (b.subId) { toast('A project piece has no subtasks'); return; }
  const ov = $('#overlay');
  ov.innerHTML = `<div class="okind">SUBTASKS</div><div class="olist"></div><div class="olabel"><span class="t"></span></div>`;
  $('.olabel .t', ov).textContent = (cur().name || '').toUpperCase();
  const list = $('.olist', ov);
  const paint = focusId => {
    const it = cur(); if (!it) { close(); return; }
    list.innerHTML = '';
    const open = (it.subtasks || []).filter(s => !s.done);
    if (!open.length) { list.innerHTML = '<p class="note">No subtasks. Add them on your phone.</p>'; return; }
    open.forEach(s => {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'block'; btn.dataset.id = s.id;
      btn.innerHTML = `<span class="name">${esc(s.name)}</span>`;
      btn.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight') return;
        e.preventDefault();
        const it2 = cur(); if (!it2) return;
        const i = open.indexOf(s), next = (open[i - 1] || open[i + 1] || {}).id;
        it2.subtasks = it2.subtasks.filter(x => x.id !== s.id);
        if (maybeRevertToTask(id)) toast('All done. Complete it on your phone');
        else toast(`Done: ${s.name}`);
        save(); paint(next);
      });
      list.appendChild(btn);
    });
    const bs = [...list.querySelectorAll('button')];
    (bs.find(x => x.dataset.id === focusId) || bs[0]).focus();
  };
  const close = () => { if (!overlayOpen) return; overlayOpen = false; overlayRefresh = null; ov.classList.add('hidden'); ov.innerHTML = ''; render(); };
  ov._close = close;
  ov.classList.remove('hidden');
  overlayOpen = true; history.pushState({ o: 1 }, '');
  overlayRefresh = () => paint(document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : null);
  paint(null);
}
window.addEventListener('popstate', () => { const ov = $('#overlay'); if (overlayOpen && ov._close) ov._close(); });

/* ---------- boot ---------- */
async function boot() {
  const t0 = Date.now();
  history.replaceState({ home: 1 }, '');
  await loadState();
  syncDevice = 'glasses';
  onSyncAdopt = () => { if (overlayOpen && overlayRefresh) overlayRefresh(); else render(); };
  render();
  syncStart();
  setInterval(() => { if (!overlayOpen) render(); }, 60000);   // keeps TODAY right across midnight
  document.addEventListener('visibilitychange', () => { if (!document.hidden && syncConfigured()) syncFetch().then(syncReceive).catch(() => {}); });
  const sp = $('#splash');
  if (sp) setTimeout(() => { sp.classList.add('gone'); setTimeout(() => sp.remove(), 500); }, Math.max(0, 1200 - (Date.now() - t0)));
}
boot();

</script>
