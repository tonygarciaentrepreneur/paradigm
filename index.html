:root {
  --bg: #000000;
  --g: #00ff41;
  --g2: #00c434;
  --dim: #0d6b24;
  --faint: #052e11;
  --hot: #d2ffdc;
  --glow: 0 0 6px rgba(0, 255, 65, .45);
  --font: "Share Tech Mono", "Roboto Mono", "Droid Sans Mono", monospace;
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--g); font-family: var(--font); overscroll-behavior: none; overflow: hidden; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; }
.hidden { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; }
#track { position: absolute; top: 0; left: 0; height: 100%; width: 500%; display: flex; transform: translateX(-60%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.panel { position: relative; width: 20%; height: 100%; display: flex; flex-direction: column; padding-top: var(--top); padding-bottom: var(--bot); }

.title { flex: none; padding: 14px 12px 18px; text-align: center; touch-action: pan-y; }
.title h1 { margin: 0; font-family: "OCR-A", var(--font); font-size: clamp(20px, 7vw, 30px); font-weight: 400; letter-spacing: .24em; padding-left: .24em; white-space: nowrap; text-shadow: 0 0 10px rgba(0, 255, 65, .55); }
#t-project h1, #t-list h1, #t-task h1 { font-size: clamp(16px, 5.4vw, 24px); letter-spacing: .14em; padding-left: .14em; }

.list { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 6px 14px; display: flex; flex-direction: column; gap: 5px; overscroll-behavior: contain; }
.list.stack, .list.rev { flex-direction: column-reverse; }
.list.stack > :last-child, .list.rev > :last-child { margin-top: auto; }

.empty { position: absolute; left: 0; right: 0; top: 46%; text-align: center; color: var(--dim); margin: 0; pointer-events: none; font-size: 15px; }

/* Blocks */
.block { flex: none; display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 12px 14px; border: 2px solid var(--g); background: var(--bg); color: var(--g); font-size: 17px; line-height: 1.25; text-shadow: var(--glow); touch-action: pan-y; position: relative; will-change: transform; }
.block .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.block .proj { color: var(--g2); }
.block .meta { flex: none; font-size: 13px; color: var(--g2); }
.block .mark { flex: none; font-size: 18px; }
.block.sel { background: var(--g); color: var(--bg); text-shadow: none; }
.block.sel .proj, .block.sel .meta { color: var(--bg); }
.block.done .name { text-decoration: line-through; color: var(--dim); text-shadow: none; }
.block.ph { border-style: dashed; border-color: var(--dim); background: transparent; }
.block.ph > * { visibility: hidden; }
.block.ghost { position: fixed; z-index: 50; pointer-events: none; box-shadow: 0 0 22px rgba(0, 255, 65, .55); }
.block.small { min-height: 46px; padding: 9px 12px; font-size: 16px; }

#place-zone { flex: none; padding: 0 14px; }
#place-zone:empty { display: none; }
#place-zone .block { box-shadow: 0 0 18px rgba(0, 255, 65, .45); transform: translateY(-2px); }
#place-zone .hint { margin: 8px 0 10px; font-size: 13px; color: var(--g2); text-align: center; }

.flash { animation: flash .9s ease-out 1; }
@keyframes flash { 0% { background: rgba(0, 255, 65, .35); } 100% { background: transparent; } }

#runbar { flex: none; margin: 10px 14px 0; padding: 10px 14px; background: var(--faint); border: 1px solid var(--g); text-align: left; display: flex; justify-content: space-between; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 14px rgba(0, 255, 65, .55); } }

/* Input + suggestions */
.inputbar { flex: none; padding: 10px 14px 0; }
#p-stack.searching #stack-list, #p-stack.searching #stack-empty, #p-stack.searching #runbar { visibility: hidden; }
input[type=text], input[type=number], textarea, select { width: 100%; background: var(--bg); color: var(--g); border: 2px solid var(--dim); padding: 13px 14px; font: inherit; font-size: 17px; caret-color: var(--g); outline: none; border-radius: 0; }
input::placeholder, textarea::placeholder { color: var(--dim); }
input:focus, textarea:focus, select:focus { border-color: var(--g); }
.stackfoot { flex: none; position: relative; }
#suggest { position: absolute; left: 14px; right: 14px; bottom: 100%; max-height: 60vh; overflow-y: auto; background: var(--bg); border: 2px solid var(--g); z-index: 20; }
.sug { display: flex; gap: 12px; align-items: baseline; padding: 13px 14px; border-bottom: 1px solid var(--faint); font-size: 17px; }
.sug:last-child { border-bottom: 0; }
.sug .tag { flex: none; width: 4.5em; font-size: 12px; color: var(--g2); }
.sug.create { color: var(--hot); }

/* Buttons */
.btn { background: var(--bg); border: 2px solid var(--g); color: var(--g); padding: 13px 16px; font-size: 16px; letter-spacing: .12em; text-shadow: var(--glow); cursor: pointer; }
.btn:active { background: var(--faint); }
.btn.primary { background: var(--g); color: var(--bg); text-shadow: none; }
.btn.primary:active { background: var(--g2); }
.btn.quiet { border-color: var(--dim); color: var(--g2); text-shadow: none; }
.btn.danger { border-style: dashed; }
.btn:disabled { opacity: .35; }
.btn.wide { width: 100%; }
.btnrow { display: flex; gap: 8px; }
.btnrow .btn { flex: 1; padding-left: 6px; padding-right: 6px; }
.panel-foot { flex: none; padding: 10px 14px 12px; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

/* Overlay screens */
#overlays > .screen { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: flex; flex-direction: column; padding-top: var(--top); padding-bottom: var(--bot); }
.bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px; min-height: 56px; }
.back { background: none; border: 0; font-size: 30px; line-height: 1; padding: 6px 12px; color: var(--g); cursor: pointer; }
.bar .label { flex: 1; font-size: 13px; color: var(--g2); letter-spacing: .2em; text-align: right; padding-right: 10px; }
.screen .body { flex: 1 1 auto; overflow-y: auto; padding: 0 16px 12px; }
.screen .foot { flex: none; padding: 10px 14px 12px; border-top: 1px solid var(--faint); display: flex; flex-direction: column; gap: 8px; }
.namein { font-size: 24px !important; border-color: transparent !important; border-bottom: 2px solid var(--dim) !important; padding: 8px 2px !important; text-align: center; letter-spacing: .06em; }
.namein:focus { border-bottom-color: var(--g) !important; }
.sect { margin-top: 18px; }
.sect h3 { margin: 0 0 8px; font-size: 13px; font-weight: 400; color: var(--g2); letter-spacing: .18em; }
textarea.notes { min-height: 40vh; resize: none; line-height: 1.45; }

.check { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 17px; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; }
.check .box { width: 22px; height: 22px; border: 2px solid var(--g); flex: none; position: relative; }
.check.on .box { background: var(--g); box-shadow: inset 0 0 0 3px var(--bg); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; background: var(--bg); border: 1px solid var(--dim); color: var(--g2); padding: 10px 6px; font-size: 13px; letter-spacing: .08em; cursor: pointer; }
.seg button.on { background: var(--g); color: var(--bg); border-color: var(--g); }
.inline { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 15px; }
.inline input, .inline select { width: auto; flex: 1; padding: 9px 10px; font-size: 16px; }

/* Editor subtask area */
.editor-list { display: flex; flex-direction: column; min-height: 0; }
.editor-list .list { padding: 6px 0; min-height: 120px; max-height: none; }
.subin { margin-top: 8px; }
.onstack { font-size: 12px; color: var(--g2); }

/* Chooser */
.chooser { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 20px; }
.chooser .q { text-align: center; font-size: 22px; margin-bottom: 18px; overflow-wrap: anywhere; text-shadow: var(--glow); }
.chooser .btn { padding: 20px; font-size: 20px; letter-spacing: .3em; }

/* Month calendar */
.months { flex: 1; overflow-y: auto; padding: 0 12px 20px; }
.month h2 { font-weight: 400; font-size: 17px; letter-spacing: .2em; margin: 22px 4px 10px; color: var(--g); }
.dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow span { text-align: center; font-size: 12px; color: var(--dim); padding-bottom: 4px; }
.days button { aspect-ratio: 1; background: var(--bg); border: 1px solid var(--faint); color: var(--g); font-size: 16px; cursor: pointer; }
.days button.past { color: var(--dim); }
.days button.today { border: 2px solid var(--g); }
.days button.picked { background: var(--g); color: var(--bg); }

/* Day view */
.dayhead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 8px; gap: 10px; }
.dayhead .d { font-size: 17px; letter-spacing: .08em; }
.allday-strip { flex: none; padding: 0 14px 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.allday-strip span { font-size: 12px; border: 1px solid var(--dim); color: var(--g2); padding: 3px 6px; }
.dayscroll { flex: 1; overflow-y: auto; position: relative; overscroll-behavior: contain; }
.grid { position: relative; margin-left: 58px; margin-right: 12px; touch-action: pan-y; }
.slot { height: 32px; border-top: 1px solid var(--faint); }
.slot.hr { border-top-color: #0a4019; }
.hlabel { position: absolute; left: -54px; width: 48px; text-align: right; font-size: 12px; color: var(--dim); transform: translateY(-50%); }
.ev { position: absolute; left: 2px; right: 2px; border: 1px solid var(--dim); background: rgba(0, 255, 65, .07); color: var(--dim); font-size: 12px; padding: 3px 6px; overflow: hidden; pointer-events: none; }
.selblk { position: absolute; left: 0; right: 0; background: rgba(0, 255, 65, .2); border: 2px solid var(--g); color: var(--g); padding: 4px 8px; font-size: 14px; z-index: 3; text-shadow: var(--glow); }
.handle { position: absolute; left: 0; right: 0; bottom: -18px; height: 36px; touch-action: none; display: flex; justify-content: center; align-items: center; }
.handle::after { content: ""; width: 54px; height: 8px; background: var(--g); box-shadow: 0 0 10px rgba(0, 255, 65, .7); }
.nowline { position: absolute; left: -6px; right: 0; height: 2px; background: var(--hot); z-index: 4; pointer-events: none; }
.grid.off { opacity: .25; pointer-events: none; }
.selinfo { font-size: 15px; text-align: center; color: var(--g2); min-height: 1.3em; }

/* START screen */
.start { touch-action: none; }
.stage { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 0; transition: flex .25s; }
.ringwrap { position: relative; width: min(78vw, 330px); aspect-ratio: 1; }
.ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring-track { fill: none; stroke: var(--faint); stroke-width: 12; }
.ring { fill: none; stroke: var(--g); stroke-width: 12; filter: drop-shadow(0 0 8px rgba(0, 255, 65, .8)); }
.ring.over { stroke: var(--hot); }
.pp { position: absolute; left: 50%; top: 50%; width: 34%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--g); background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pp svg { width: 40%; height: 40%; transform: none; fill: var(--g); }
.pp.paused { background: var(--g); }
.pp.paused svg { fill: var(--bg); }
.tname { font-size: 24px; text-align: center; padding: 0 20px; overflow-wrap: anywhere; text-shadow: var(--glow); }
.tclock { font-size: 40px; letter-spacing: .06em; text-shadow: 0 0 12px rgba(0, 255, 65, .6); }
.tclock.over { color: var(--hot); }
.thint { font-size: 14px; color: var(--g2); min-height: 1.3em; text-align: center; padding: 0 20px; }
.linebar { width: calc(100% - 40px); height: 14px; border: 1px solid var(--dim); position: relative; }
.linebar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--g); box-shadow: 0 0 10px rgba(0, 255, 65, .7); }
.linebar.over i { background: var(--hot); }
.drawer { flex: 0 0 auto; height: 0; overflow: hidden; display: flex; flex-direction: column; border-top: 1px solid var(--faint); transition: height .25s; }
.start.open .drawer { height: 58%; }
.start.open .stage { justify-content: flex-start; padding-top: 10px; gap: 12px; }
.drawer .grab { flex: none; height: 26px; display: flex; justify-content: center; align-items: center; }
.drawer .grab::after { content: ""; width: 44px; height: 4px; background: var(--dim); }
.drawer .list { touch-action: pan-y; }
.drawer .notesview { flex: 1; overflow-y: auto; padding: 4px 18px 16px; white-space: pre-wrap; font-size: 16px; line-height: 1.5; -webkit-user-select: text; user-select: text; touch-action: pan-y; }
.swipe-up-hint { font-size: 12px; color: var(--dim); padding-bottom: 10px; text-align: center; }

/* Summary */
.summary { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
.summary .big { font-size: 52px; text-shadow: 0 0 14px rgba(0, 255, 65, .6); }
.summary .nm { font-size: 22px; overflow-wrap: anywhere; }
.summary .sub { color: var(--g2); font-size: 15px; }
a.btn { text-decoration: none; display: inline-block; text-align: center; }

/* Settings */
.settings { flex: 1; overflow-y: auto; padding: 4px 16px 24px; }
.settings .sect { border-top: 1px solid var(--faint); padding-top: 14px; }
.settings p { font-size: 14px; color: var(--g2); line-height: 1.45; margin: 6px 0 10px; }
.settings .btn { margin-top: 8px; }
.status { font-size: 15px; color: var(--g); }

/* Toast + modal */
#toast { position: fixed; left: 14px; right: 14px; top: calc(var(--top) + 14px); z-index: 60; background: var(--bg); border: 2px solid var(--g); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 15px; box-shadow: 0 0 16px rgba(0, 255, 65, .35); }
#toast .act { flex: none; padding: 8px 12px; font-size: 14px; }
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .82); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal .box { width: 100%; max-width: 420px; border: 2px solid var(--g); background: var(--bg); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.modal .msg { font-size: 17px; line-height: 1.4; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* START: list mode row with linear bar */
.minirow { width: calc(100% - 40px); display: flex; align-items: center; gap: 14px; }
.minirow .linebar { flex: 1; width: auto; }
.pp.small { position: static; transform: none; width: 56px; flex: none; }
.start.open .ringwrap { width: min(42vw, 180px); }
.start.open .tclock { font-size: 30px; }
.start.open .tname { font-size: 19px; }
/* Toasts never block swipes: only their button takes touches. */
#toast { pointer-events: none; }
#toast .act { pointer-events: auto; }

/* Splash */
#splash { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
#splash img { width: min(64vw, 320px); height: auto; }
#splash.gone { opacity: 0; pointer-events: none; }

/* FOCUS panel */
.focus-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; touch-action: none; }
.focus-body .stage { padding-top: 10px; }
.focus-block { width: calc(100% - 40px); justify-content: center; text-align: center; font-size: 20px; min-height: 60px; }
.focus-block .name { flex: 0 1 auto; }
.subhint { background: none; border: 0; color: var(--g2); font-size: 15px; letter-spacing: .1em; padding: 8px 16px; display: flex; gap: 14px; align-items: center; cursor: pointer; }
.subhint .tri { font-size: 12px; }
.focus-body.open .drawer { height: 55%; }
.focus-body.open .stage { justify-content: flex-end; padding-bottom: 12px; gap: 12px; }
.focus-body.open .ringwrap { width: min(40vw, 170px); }
.focus-body.open .tclock { font-size: 30px; }
.focus-body.open .focus-block { font-size: 17px; min-height: 50px; }
.focus-body .drawer { border-top: 0; }
.drawer .alldone { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--g2); font-size: 15px; }
.selblk { padding: 1px 8px; font-size: 13px; line-height: 1.15; }
.handle { justify-content: flex-end; padding-right: 18px; }

/* FOCUS layer slides in from the right over the panels */
.focus-layer { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; padding-top: var(--top); padding-bottom: var(--bot); transform: translateX(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.focus-layer.show { transform: translateX(0); }
/* Project subtasks screen */
.projsubs .list { padding-top: 10px; }
.projsubs .title h1 { font-size: clamp(16px, 5.4vw, 24px); letter-spacing: .14em; padding-left: .14em; overflow: hidden; text-overflow: ellipsis; }
.projsubs .foot { border-top: 0; }

/* Hold-selected block: inverse colors, same as BACKLOG selection used to be */
.block.armed { background: var(--g); color: var(--bg); text-shadow: none; }
.block.armed .proj, .block.armed .meta, .block.armed .mark { color: var(--bg); }

/* Edit screen bottom nav */
.edit-title { position: relative; touch-action: none; }
.edit-hint { position: absolute; left: 0; right: 0; top: 2px; font-size: 10px; color: var(--dim); }
.editor .bar { justify-content: flex-end; }

/* Glasses pairing screen: QR stays dark-on-white so the glasses camera can read it */
.pair { text-align: center; }
.pair .qrbox { background: #fff; padding: 14px; width: min(78vw, 320px); margin: 10px auto 18px; }
.pair .qrbox svg { display: block; width: 100%; height: auto; }
.pair p { color: var(--g2); font-size: 15px; line-height: 1.45; margin: 0 0 12px; }
.pair b { color: var(--g); font-weight: 400; }
.pair .small { font-size: 13px; color: var(--dim); }

</style>

<script>

window.__errs=[];
function __showErr(msg){try{var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;background:#300;color:#fbb;font:13px monospace;padding:8px 10px;white-space:pre-wrap;max-height:40%;overflow:auto';document.body.appendChild(b);}b.textContent+= (b.textContent?'\n':'')+'Error: '+msg;}catch(e){}}
window.addEventListener('error',function(e){__showErr((e.message||'unknown')+(e.filename?' @'+e.filename.split('/').pop()+':'+e.lineno:''));});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;__showErr('promise: '+(r&&r.message||r));});
/* Paradigm: state, persistence and model rules */
'use strict';

const MIN = 60000, HALF = 30 * MIN, DAY = 24 * 60 * MIN;
let state = null;
let idb = null;

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
function dateStr(d) { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const todayStr = () => dateStr(Date.now());
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function floor30(ms) { const d = new Date(ms); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() < 30 ? 0 : 30); return d.getTime(); }
function ceilHalf(ms) { return Math.max(1, Math.ceil(ms / HALF)) * HALF; }
const Q15 = 15 * MIN;
function nextQuarter(ms) { const d = new Date(ms); if (d.getSeconds() || d.getMilliseconds() || d.getMinutes() % 15) { d.setSeconds(0, 0); d.setMinutes(Math.floor(d.getMinutes() / 15) * 15 + 15); } return d.getTime(); }
function ceilQuarter(ms) { return Math.max(1, Math.ceil(ms / Q15)) * Q15; }
function minToClock(min) { const h = Math.floor(min / 60) % 24, m = min % 60; const ap = h < 12 ? 'AM' : 'PM'; const h12 = h % 12 || 12; return `${h12}:${pad(m)} ${ap}`; }
function msToClock(ms) { const d = new Date(ms); return minToClock(d.getHours() * 60 + d.getMinutes()); }
function fmtDur(ms) { ms = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(ms / 3600), m = Math.floor(ms % 3600 / 60), s = ms % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }
function fmtShort(ms) { const m = Math.round(ms / MIN); return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? pad(m % 60) : ''}` : `${m}m`; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- persistence (IndexedDB) ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('paradigm', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbGet(k) {
  return new Promise((res, rej) => {
    const q = idb.transaction('kv').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
function idbSet(k, v) {
  return new Promise((res, rej) => {
    const t = idb.transaction('kv', 'readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

function freshState() {
  return {
    v: 4, items: {}, blocks: {}, stack: [], backlogs: { project: [], list: [], task: [] }, running: null,
    lastDueCheck: todayStr(),
    calQueue: [],   // completions made on the glasses, waiting for the phone to log them to Google Calendar
    settings: { clientId: '', connected: false, paradigmCalId: '', driveFileId: '', lastBackup: 0 },
    auth: { token: '', exp: 0 }
  };
}
function normalize(s) {
  const f = freshState();
  // v1 -> v2: one backlog becomes three; the placement queue goes to the top of STACK.
  if (!s.backlogs) {
    s.backlogs = { project: [], list: [], task: [] };
    (s.backlog || []).forEach(bid => { const k = blockKind(bid, s); if (k) s.backlogs[k].push(bid); });
  }
  if (Array.isArray(s.placing)) { s.stack = (s.stack || []).concat(s.placing); }
  delete s.backlog; delete s.placing;
  // v3: PROJECT BACKLOG holds projects (item ids), not subtask blocks.
  if ((s.v || 1) < 3) { s.backlogs.project = []; s.v = 3; }
  // v4: no FOCUS timer. Anything mid-session goes back to the bottom of STACK.
  if (s.running) { s.stack = [s.running.bid].concat((s.stack || []).filter(b => b !== s.running.bid)); s.running = null; }
  s.v = 4;
  for (const k of Object.keys(f)) if (s[k] === undefined) s[k] = f[k];
  s.settings = Object.assign(f.settings, s.settings || {});
  s.auth = Object.assign(f.auth, s.auth || {});
  return s;
}

let saveTimer = null;
function save(opts) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 200);
  if (!(opts && opts.noBackup) && typeof scheduleBackup === 'function') scheduleBackup();
  if (!(opts && opts.noSync) && typeof scheduleSync === 'function') scheduleSync();
}
function flush() { clearTimeout(saveTimer); if (idb && state) return idbSet('state', state).catch(e => console.error(e)); }

async function loadState() {
  idb = await idbOpen();
  const s = await idbGet('state');
  state = normalize(s || freshState());
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  repair();
}

/* Keep lists consistent: drop dead blocks, rescue orphans into the backlog. */
function repair() {
  const seen = new Set();
  const clean = arr => arr.filter(b => {
    const ok = state.blocks[b] && state.items[state.blocks[b].itemId] && !seen.has(b);
    if (ok) seen.add(b); return ok;
  });
  if (state.running && !(state.blocks[state.running.bid] && state.items[state.blocks[state.running.bid].itemId])) state.running = null;
  if (state.running) seen.add(state.running.bid);
  state.stack = clean(state.stack);
  for (const k of BLOCK_KINDS) state.backlogs[k] = clean(state.backlogs[k] || []);
  // PROJECT BACKLOG lists every project, by item id.
  const pseen = new Set();
  state.backlogs.project = (state.backlogs.project || []).filter(id => state.items[id] && state.items[id].type === 'project' && !pseen.has(id) && pseen.add(id));
  for (const it of Object.values(state.items)) if (it.type === 'project' && !pseen.has(it.id)) state.backlogs.project.push(it.id);
  for (const [bid, b] of Object.entries(state.blocks)) {
    const it = state.items[b.itemId];
    if (!it || (b.subId && !(it.subtasks || []).some(s => s.id === b.subId))) { delete state.blocks[bid]; continue; }
    if (seen.has(bid)) continue;
    if (b.subId) delete state.blocks[bid];   // a loose subtask simply returns to its project
    else state.backlogs[blockKind(bid)].push(bid);
  }
  // Every task and list that isn't on STACK or in FOCUS lives in its backlog, recurring ones included.
  for (const it of Object.values(state.items)) placeInBacklog(it.id);
}

/* ---------- model queries ---------- */
const TYPES = { task: 'TASK', list: 'LIST', event: 'EVENT', project: 'PROJECT' };
const KINDS = ['project', 'list', 'task'];
const BLOCK_KINDS = ['list', 'task'];
const BACKLOG_TITLE = { project: 'PROJECT BACKLOG', list: 'LIST BACKLOG', task: 'TASK BACKLOG' };
/* Which backlog a block belongs to: project subtasks -> project, otherwise the item's type. */
function blockKind(bid, s) {
  s = s || state;
  const b = s.blocks[bid]; if (!b) return null;
  if (b.subId) return 'project';
  const it = s.items[b.itemId]; if (!it) return null;
  return it.type === 'list' ? 'list' : 'task';
}
function inBacklog(bid) { return BLOCK_KINDS.some(k => state.backlogs[k].includes(bid)); }
function itemByName(name) {
  const n = name.trim().toLowerCase();
  return Object.values(state.items).find(i => i.name.trim().toLowerCase() === n) || null;
}
function findBlock(itemId, subId) {

}
function whereBlock(bid) {

  if (state.stack.includes(bid)) return 'stack';

  return null;
}
function detach(bid) {

}
function removeBlock(bid) {

}
function blockLabel(bid) {
  const b = state.blocks[bid], it = state.items[b.itemId];
  if (b.subId) { const s = it.subtasks.find(x => x.id === b.subId); return { proj: it.name, name: s ? s.name : '?' }; }
  return { proj: null, name: it.name };
}
function blockName(bid) { const l = blockLabel(bid); return l.proj ? `${l.proj} › ${l.name}` : l.name; }

function newItem(type, name) {
  const it = { id: uid(), type, name: name.trim(), created: Date.now() };
  if (type === 'task') Object.assign(it, { notes: '', recurring: false, schedule: { freq: 'none' } });
  if (type === 'list') Object.assign(it, { subtasks: [], recurring: false, recSubtasks: false, schedule: { freq: 'none' } });
  if (type === 'project') Object.assign(it, { subtasks: [], recurring: false });
  if (type === 'event') Object.assign(it, { event: null });

}
function deleteItem(id) {
  for (const bid of Object.keys(state.blocks)) if (state.blocks[bid].itemId === id) removeBlock(bid);

}
/* Puts a task or list with no block anywhere onto the top (lowest priority) of its backlog. */
function placeInBacklog(itemId) {

}
function listProject(id) { if (!state.backlogs.project.includes(id)) state.backlogs.project.push(id); }

/* Adds an item (or project subtask) to STACK. where: 'top' (lowest priority, from a backlog)
   or 'bottom' (highest priority, new from the STACK input). Returns a message or null. */
function addToStack(itemId, subId, where) {
  let bid = findBlock(itemId, subId);
  const w = bid && whereBlock(bid);
  if (w === 'stack') return 'Already on STACK';
  if (w === 'backlog') detach(bid);
  if (!bid) { bid = uid(); state.blocks[bid] = { bid, itemId, subId: subId || null, elapsed: 0 }; }
  if (where === 'bottom') state.stack.unshift(bid); else state.stack.push(bid);
  return null;
}
/* Deletes what a block stands for: the task or list, or just the subtask for a project subtask. */
function deleteBlockItem(bid) {
  const b = state.blocks[bid]; if (!b) return;
  if (b.subId) {
    const it = state.items[b.itemId];
    if (it) it.subtasks = it.subtasks.filter(s => s.id !== b.subId);
    removeBlock(bid);
  } else deleteItem(b.itemId);
}
/* Sends a block to the bottom (highest priority) of its backlog. Project subtasks return to their project. */
function sendToBacklog(bid) {
  if (state.blocks[bid].subId) { removeBlock(bid); return; }
  detach(bid);
  state.backlogs[blockKind(bid)].unshift(bid);
}

/* ---------- schedules ---------- */
function defaultSchedule(freq) {
  const d = new Date();
  return { freq, days: [d.getDay()], dom: d.getDate(), month: d.getMonth() };
}
function matchesSchedule(sch, d) {
  if (!sch || sch.freq === 'none') return false;
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  switch (sch.freq) {
    case 'daily': return true;
    case 'weekly': return (sch.days || []).includes(d.getDay());
    case 'monthly': return d.getDate() === Math.min(sch.dom || 1, dim);
    case 'annually': return d.getMonth() === sch.month && d.getDate() === Math.min(sch.dom || 1, dim);
  }
  return false;
}
/* Drops due recurring items onto the bottom of STACK. Returns ids that arrived. */
function runDueCheck() {
  const today = todayStr();
  if (state.lastDueCheck >= today) return [];
  const due = [];
  for (const it of Object.values(state.items)) {
    if (!it.recurring || !it.schedule || it.schedule.freq === 'none') continue;
    let d = addDays(state.lastDueCheck, 1), n = 0;
    while (d <= today && n++ < 400) { if (matchesSchedule(it.schedule, parseDate(d))) { due.push(it); break; } d = addDays(d, 1); }
  }
  state.lastDueCheck = today;
  due.sort((a, b) => b.created - a.created);
  const arrived = [];
  for (const it of due) {
    let bid = findBlock(it.id, null);
    const w = bid && whereBlock(bid);
    if (w === 'stack' || w === 'running') continue;
    if (w === 'backlog') detach(bid);
    if (!bid) { bid = uid(); state.blocks[bid] = { bid, itemId: it.id, subId: null, elapsed: 0 }; }
    state.stack.unshift(bid);
    arrived.push(bid);
  }
  if (due.length || arrived.length) save();
  return arrived;
}

/* ---------- completion ---------- */
/* Completes a block over the chosen time span; returns what to log on the Paradigm calendar. */
function completeBlock(bid, start, end) {
  const b = state.blocks[bid]; if (!b) return null;
  const it = state.items[b.itemId];
  const res = { name: blockName(bid), start, end };
  if (b.subId) {
    // Done subtasks leave the project, unless it's a recurring project (then it stays, ready to do again).
    if (!it.recurring) it.subtasks = it.subtasks.filter(x => x.id !== b.subId);
  } else if (it.type === 'task') {
    if (!it.recurring) delete state.items[it.id];
  } else if (it.type === 'list') {
    if (!it.recurring) delete state.items[it.id];
    else if (it.recSubtasks) it.subtasks.forEach(s => { s.done = false; });
    else it.subtasks = [];
  }
  removeBlock(bid);
  if (state.items[b.itemId]) placeInBacklog(b.itemId);   // recurring items go back to their backlog
  save();
  return res;
}

/* Paradigm: touch gestures.
   hold ~300ms = pick up and drag; quick horizontal flick = swipe; vertical flick = scroll (or swipe up/down where enabled). */
'use strict';

const HOLD_MS = 300, SLOP = 10, SWIPE_DIST = 80;

function gesture(el, o) {
  let st = null;
  const hasH = () => !!(o.onSwipeLeft || o.onSwipeRight);
  const hasV = () => !!(o.onSwipeUp || o.onSwipeDown);
  const mover = () => o.moveEl === false ? null : (o.moveEl || el);

  el.addEventListener('touchstart', e => {
    if (e.touches.length > 1) { cancel(); return; }
    if (o.ignore && o.ignore(e.target)) { st = null; return; }
    const en = !o.enabled || o.enabled();
    const t = e.touches[0];
    st = { x: t.clientX, y: t.clientY, t: Date.now(), mode: null, dx: 0, dy: 0, tapOnly: !en };
    if (o.onHoldStart && en) {
      st.timer = setTimeout(() => {
        if (st && !st.mode) {
          st.mode = 'hold';
          if (navigator.vibrate) navigator.vibrate(12);
          o.onHoldStart(st.x, st.y);
        }
      }, HOLD_MS);
    }
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!st) return;
    const t = e.touches[0];
    const dx = t.clientX - st.x, dy = t.clientY - st.y;
    st.dx = dx; st.dy = dy; st.cx = t.clientX; st.cy = t.clientY;
    if (st.mode === 'hold') { if (e.cancelable) e.preventDefault(); o.onHoldMove && o.onHoldMove(t.clientX, t.clientY); return; }
    if (!st.mode) {
      if (Math.abs(dx) < SLOP && Math.abs(dy) < SLOP) return;
      clearTimeout(st.timer);
      if (st.tapOnly) st.mode = 'scroll';
      else if (Math.abs(dx) > Math.abs(dy) && hasH()) st.mode = 'h';
      else if (Math.abs(dy) >= Math.abs(dx) && hasV()) st.mode = 'v';
      else st.mode = 'scroll';
    }
    if (st.mode === 'h') {
      if (e.cancelable) e.preventDefault();
      // Directions that do nothing don't move the block.
      let x = dx;
      if (x < 0 && o.allowLeft && !o.allowLeft()) x = 0;
      if (x > 0 && o.allowRight && !o.allowRight()) x = 0;
      const m = mover(); if (m) { m.style.transition = 'none'; m.style.transform = `translateX(${x}px)`; }
    } else if (st.mode === 'v') {
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });

  function snapBack() {
    const m = mover(); if (!m) return;
    m.style.transition = 'transform .18s ease-out'; m.style.transform = '';
  }
  function fly(dir, cb) {
    const m = mover();
    if (!m || o.noFly) { if (m) { m.style.transition = ''; m.style.transform = ''; } cb(); return; }
    m.style.transition = 'transform .15s ease-in';
    m.style.transform = `translateX(${dir * window.innerWidth}px)`;
    setTimeout(() => { cb(); requestAnimationFrame(() => { if (m.isConnected) { m.style.transition = 'none'; m.style.transform = ''; } }); }, 150);
  }
  function cancel() {
    if (!st) return;
    clearTimeout(st.timer);
    if (st.mode === 'hold') o.onHoldEnd && o.onHoldEnd(true);
    if (st.mode === 'h') snapBack();
    st = null;
  }

  el.addEventListener('touchend', e => {
    if (!st) return;
    clearTimeout(st.timer);
    const s = st; st = null;
    if (s.mode === 'hold') { o.onHoldEnd && o.onHoldEnd(false); return; }
    if (s.mode === 'h') {
      const fast = Math.abs(s.dx) > 40 && Date.now() - s.t < 260;
      if (Math.abs(s.dx) > SWIPE_DIST || fast) {
        if (s.dx > 0 && o.onSwipeRight && !(o.allowRight && !o.allowRight())) return fly(1, o.onSwipeRight);
        if (s.dx < 0 && o.onSwipeLeft && !(o.allowLeft && !o.allowLeft())) return fly(-1, o.onSwipeLeft);
      }
      snapBack(); return;
    }
    if (s.mode === 'v') {
      if (s.dy < -60 && o.onSwipeUp) o.onSwipeUp();
      else if (s.dy > 60 && o.onSwipeDown) o.onSwipeDown();
      return;
    }
    if (!s.mode && Date.now() - s.t < 450 && o.onTap) { o.onTap(e); }
  });
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());

  // Mouse fallback for desktop testing: click = tap.
  if (o.onTap) el.addEventListener('click', e => { if (!('ontouchstart' in window)) o.onTap(e); });
}

/* ---------- drag-to-sort ----------
   listEl: container of .block children. reverse: true when the list is column-reverse (index 0 at the bottom).
   srcEl: the element being dragged (already in listEl), or a detached element when placing a new block. */
let dragCtx = null;
function beginDrag({ listEl, srcEl, x, y, reverse, external }) {
  const r = srcEl.getBoundingClientRect();
  const ghost = srcEl.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.classList.remove('ph');
  ghost.style.width = r.width + 'px';
  ghost.style.left = r.left + 'px';
  const offY = y - r.top;
  ghost.style.top = (y - offY) + 'px';
  document.getElementById('ghost-layer').appendChild(ghost);

  let ph = srcEl;
  if (external) { ph = document.createElement('div'); ph.className = 'block ph'; ph.innerHTML = srcEl.innerHTML; listEl.appendChild(ph); }
  ph.classList.add('ph');

  let scrollTimer = null, lastY = y;
  function place(cy) {
    const sibs = [...listEl.children].filter(c => c !== ph && c.classList.contains('block'));
    let idx = 0;
    for (const s of sibs) {
      const b = s.getBoundingClientRect(), mid = b.top + b.height / 2;
      if (reverse ? mid > cy : mid < cy) idx++;
    }
    const ref = sibs[idx] || null;
    if (ref) { if (ph.nextSibling !== ref) listEl.insertBefore(ph, ref); }
    else if (listEl.lastElementChild !== ph) listEl.appendChild(ph);
  }
  function autoscroll() {
    const lr = listEl.getBoundingClientRect();
    let v = 0;
    if (lastY < lr.top + 50) v = -12; else if (lastY > lr.bottom - 50) v = 12;
    if (v) { listEl.scrollTop += v; place(lastY); }
  }
  scrollTimer = setInterval(autoscroll, 30);
  place(y);

  dragCtx = {
    move(cx, cy) { lastY = cy; ghost.style.top = (cy - offY) + 'px'; place(cy); },
    end() {
      clearInterval(scrollTimer);
      ghost.remove();
      const idx = [...listEl.children].filter(c => c.classList.contains('block')).indexOf(ph);
      if (external) ph.remove(); else ph.classList.remove('ph');
      dragCtx = null;
      return idx;
    }
  };
  return dragCtx;
}

/* ---------- hold-to-select ----------
   Hold a block and let go: it turns inverse (selected). Swipe it right to edit, left to delete.
   Touching anywhere else clears the selection. Hold and drag still reorders. */
let armed = null;
function arm(el) { disarm(); armed = el; el.classList.add('armed'); }
function disarm() { if (armed) { armed.classList.remove('armed'); armed = null; } }
function isArmed(el) { return armed === el && el.isConnected; }
document.addEventListener('touchstart', e => {
  if (armed && !(armed.isConnected && armed.contains(e.target))) disarm();
}, { capture: true, passive: true });

/* Wires a rendered list: each child .block with data-key gets swipe/hold/tap per opts.
   opts: { reverse, onReorder(newKeys), swipeRight(key), swipeLeft(key), tap(key), enabled(),
           armable(key) -> bool, openEdit(key), armDelete(key) } */
function wireList(listEl, opts) {
  [...listEl.children].forEach(el => {
    if (!el.classList.contains('block')) return;
    const key = el.dataset.key;
    const canArm = !!(opts.openEdit && opts.armable && opts.armable(key));
    let drag = null, hold = null;
    gesture(el, {
      enabled: opts.enabled,
      onSwipeRight: (opts.swipeRight || canArm) ? () => {
        if (isArmed(el)) { disarm(); opts.openEdit(key); return; }
        if (opts.swipeRight) opts.swipeRight(key);
      } : null,
      allowLeft: () => !!opts.swipeLeft || (isArmed(el) && !!opts.armDelete),
      allowRight: () => !!opts.swipeRight || (isArmed(el) && !!opts.openEdit),
      onSwipeLeft: (opts.swipeLeft || (canArm && opts.armDelete)) ? () => {
        if (isArmed(el)) { disarm(); if (opts.armDelete) opts.armDelete(key); return; }
        if (opts.swipeLeft) opts.swipeLeft(key);
      } : null,
      onTap: () => {
        if (isArmed(el)) { disarm(); return; }
        if (opts.tap) opts.tap(key);
      },
      onHoldStart: (opts.onReorder || canArm) ? (x, y) => { hold = { x, y }; } : null,
      onHoldMove: (x, y) => {
        if (!drag && hold && opts.onReorder && (Math.abs(y - hold.y) > 8 || Math.abs(x - hold.x) > 8)) {
          if (isArmed(el)) disarm();
          drag = beginDrag({ listEl, srcEl: el, x: hold.x, y: hold.y, reverse: opts.reverse });
        }
        if (drag) drag.move(x, y);
      },
      onHoldEnd: cancelled => {
        const was = hold; hold = null;
        if (drag) {
          drag.end(); drag = null;
          const keys = [...listEl.children].filter(c => c.classList.contains('block')).map(c => c.dataset.key);
          opts.onReorder(keys);
          return;
        }
        if (!cancelled && was && canArm) arm(el);
      }
    });
  });
}

/* Paradigm: Google Calendar + Drive (free tier, browser token flow). */
'use strict';

const SCOPES = 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/drive.appdata';
const CAL = 'https://www.googleapis.com/calendar/v3';
const BACKUP_NAME = 'paradigm-backup.json';
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

let tokenClient = null, tokenClientFor = '', tokenWaiters = [], tokenPending = false, backupDirty = false, backupTimer = null;

const gisReady = () => !!(window.google && google.accounts && google.accounts.oauth2);
function tokenValid() { return !!state.auth.token && Date.now() < state.auth.exp - MIN; }

function ensureTokenClient() {
  const id = (state.settings.clientId || '').trim();
  if (!id || !gisReady()) return null;
  if (tokenClient && tokenClientFor === id) return tokenClient;
  tokenClientFor = id;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: id, scope: SCOPES,
    callback: resp => {
      if (resp && resp.access_token) {
        state.auth.token = resp.access_token;
        state.auth.exp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
        state.settings.connected = true;
        save({ noBackup: true });
        settleTokens(resp.access_token);
        if (backupDirty) driveBackup();
      } else settleTokens(null);
    },
    error_callback: () => settleTokens(null)
  });
  return tokenClient;
}
function settleTokens(tok) { tokenPending = false; const w = tokenWaiters; tokenWaiters = []; w.forEach(f => f(tok)); if (typeof renderSettings === 'function') renderSettings(); }

/* Call FIRST inside a tap/swipe handler (before any await) so the sign-in popup is allowed. */
function getToken(interactive, forceConsent) {
  if (tokenValid() && !forceConsent) return Promise.resolve(state.auth.token);
  if (!interactive) return Promise.resolve(null);
  const tc = ensureTokenClient();
  if (!tc) return Promise.resolve(null);
  return new Promise(res => {
    tokenWaiters.push(res);
    if (tokenPending) return;
    tokenPending = true;
    try { tc.requestAccessToken({ prompt: forceConsent || !state.settings.connected ? 'consent' : '' }); }
    catch (e) { settleTokens(null); }
  });
}

async function gfetch(tok, method, url, body, headers) {
  const h = Object.assign({ Authorization: 'Bearer ' + tok }, headers || {});
  let payload = body;
  if (body !== undefined && body !== null && typeof body !== 'string') { payload = JSON.stringify(body); h['Content-Type'] = 'application/json'; }
  const r = await fetch(url, { method, headers: h, body: payload });
  if (r.status === 401) { state.auth.token = ''; state.auth.exp = 0; throw Object.assign(new Error('auth'), { status: 401 }); }
  if (!r.ok) throw Object.assign(new Error('http ' + r.status), { status: r.status });
  if (r.status === 204) return null;
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

/* ---------- Calendar ---------- */
async function paradigmCalId(tok) {
  if (state.settings.paradigmCalId) return state.settings.paradigmCalId;
  const list = await gfetch(tok, 'GET', `${CAL}/users/me/calendarList?maxResults=250`);
  let cal = (list.items || []).find(c => c.summary === 'Paradigm');
  if (!cal) cal = await gfetch(tok, 'POST', `${CAL}/calendars`, { summary: 'Paradigm', timeZone: TZ });
  state.settings.paradigmCalId = cal.id; save({ noBackup: true });
  return cal.id;
}
function eventTimes(ev) {
  if (ev.allDay) return { start: { date: ev.date }, end: { date: addDays(ev.date, 1) } };
  const base = parseDate(ev.date).getTime();
  return {
    start: { dateTime: new Date(base + ev.startMin * MIN).toISOString(), timeZone: TZ },
    end: { dateTime: new Date(base + ev.endMin * MIN).toISOString(), timeZone: TZ }
  };
}
async function calInsertEvent(tok, name, ev) {
  const r = await gfetch(tok, 'POST', `${CAL}/calendars/primary/events`, Object.assign({ summary: name }, eventTimes(ev)));
  return r.id;
}
async function calUpdateEvent(tok, id, name, ev) {
  await gfetch(tok, 'PATCH', `${CAL}/calendars/primary/events/${encodeURIComponent(id)}`, Object.assign({ summary: name }, eventTimes(ev)));
}
async function calDeleteEvent(tok, id) {
  try { await gfetch(tok, 'DELETE', `${CAL}/calendars/primary/events/${encodeURIComponent(id)}`); }
  catch (e) { if (e.status !== 404 && e.status !== 410) throw e; }
}
async function calLogCompletion(tok, res) {
  const body = {
    summary: res.name,
    description: 'Completed in Paradigm',
    start: { dateTime: new Date(res.start).toISOString(), timeZone: TZ },
    end: { dateTime: new Date(res.end).toISOString(), timeZone: TZ }
  };
  let id = await paradigmCalId(tok);
  try { await gfetch(tok, 'POST', `${CAL}/calendars/${encodeURIComponent(id)}/events`, body); }
  catch (e) {
    if (e.status !== 404) throw e;
    state.settings.paradigmCalId = '';
    id = await paradigmCalId(tok);
    await gfetch(tok, 'POST', `${CAL}/calendars/${encodeURIComponent(id)}/events`, body);
  }
}
/* Existing events for a day, for the dimmed background in day views. Never prompts. */
async function calDayEvents(date) {
  const tok = await getToken(false);
  if (!tok) return null;
  const t0 = parseDate(date).getTime();
  const q = `timeMin=${encodeURIComponent(new Date(t0).toISOString())}&timeMax=${encodeURIComponent(new Date(t0 + DAY).toISOString())}&singleEvents=true&orderBy=startTime&maxResults=100`;
  const cals = ['primary'];
  if (state.settings.paradigmCalId) cals.push(state.settings.paradigmCalId);
  const out = [];
  for (const c of cals) {
    try {
      const r = await gfetch(tok, 'GET', `${CAL}/calendars/${encodeURIComponent(c)}/events?${q}`);
      (r.items || []).forEach(e => out.push(e));
    } catch (e) { /* show what we can */ }
  }
  return out;
}

/* One-tap fallback when Google access has lapsed. */
function calLink(name, ev, details) {
  const f = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  let dates;
  if (ev.allDay) dates = `${ev.date.replace(/-/g, '')}/${addDays(ev.date, 1).replace(/-/g, '')}`;
  else if (ev.startMs) dates = `${f(ev.startMs)}/${f(ev.endMs)}`;
  else { const b = parseDate(ev.date).getTime(); dates = `${f(b + ev.startMin * MIN)}/${f(b + ev.endMin * MIN)}`; }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(name)}&dates=${dates}${details ? '&details=' + encodeURIComponent(details) : ''}`;
}

/* ---------- Drive backup (hidden app folder) ---------- */
function exportable() {
  const s = clone(state);
  delete s.auth;
  s.settings = { clientId: state.settings.clientId };
  s.exportedAt = Date.now();
  return s;
}
function scheduleBackup() {
  if (!state.settings.connected) return;
  backupDirty = true;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(driveBackup, 4000);
}
async function driveFileId(tok) {
  if (state.settings.driveFileId) return state.settings.driveFileId;
  const q = encodeURIComponent(`name='${BACKUP_NAME}'`);
