      <button class="btn" data-t="list">LIST</button>
      <button class="btn" data-t="event">EVENT</button>
      <button class="btn" data-t="project">PROJECT</button>
    </div>`);
  $('.q', el).textContent = name;
  backBtn(el);
  el.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => chooseType(b.dataset.t, name)));
  openScreen(el);
}
function chooseType(t, name) {
  if (t === 'task') {
    const it = newItem('task', name);
    state.items[it.id] = it;
    addToStack(it.id, null, 'bottom');
    save(); clearMainInput();
    closeAll(() => goPanel('stack'));
  } else if (t === 'event') {
    openMonth({ title: name, onPick: date => openDay({ mode: 'event', date, name, sel: null, onSave: ev => {
      const tp = getToken(true);
      const it = newItem('event', name);
      it.event = ev;
      state.items[it.id] = it;
      save(); clearMainInput();
      closeAll(() => { goPanel('stack'); toast('Event saved'); setTimeout(() => sync()); });
      const sync = () => tp.then(async tok => {
        if (!tok) return calFallbackToast('Google is not connected.', it.name, ev);
        try { it.event.gcalId = await calInsertEvent(tok, it.name, it.event); save(); toast('Added to Google Calendar'); }
        catch (e) { calFallbackToast('Could not reach Google Calendar.', it.name, ev); }
      });
    } }) });
  } else {
    openEditor(newItem(t, name), true);
  }
}

/* ---------- editors ---------- */
function eventWhen(ev) {
  if (!ev) return 'No time set';
  const d = parseDate(ev.date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  return ev.allDay ? `${d}, all day` : `${d}, ${minToClock(ev.startMin)} to ${minToClock(ev.endMin)}`;
}

/* The activity's own screen (formerly EDIT). Laid out like STACK: subtasks pile up from the bottom,
   the entry box sits above the name at the bottom.
   Swipe left on the name = save and go back; swipe right = save and add to STACK. Android back discards. */
/* from: 'backlog' when opened from a backlog (swiping right on the name then adds it to the top of STACK). */
function openEditor(item, isNew, slide, from) {
  const orig = clone(item);
  const d = clone(item);
  if (d.type === 'task' && !Array.isArray(d.subtasks)) d.subtasks = [];
  if (d.type !== 'event') d.size = clampSize(d.size);
  const hasSubs = d.type !== 'event';   // tasks, lists and projects all hold subtasks
  // Like STACK: the list piles up from the bottom, the entry box sits above the name at the bottom.
  // OPTIONS is at the top right (where REFRESH is on SCHEDULE).
  // Difficulty and Project sit at the top; the name is only at the bottom (tap it to rename).
  const el = screenEl('editor activity' + (slide ? ' slidein' : ''), `
    <div class="optcontent dettop"></div>
    <div class="actmain"></div>
    ${hasSubs ? '<div class="inputbar actinput"><input class="subin" type="text" placeholder="Add a subtask" enterkeyhint="done" autocomplete="off"></div>' : ''}
    <header class="title act-title"><h1></h1></header>`);
  const title = $('.act-title h1', el), optcontent = $('.optcontent', el), main = $('.actmain', el);
  const optpanel = optcontent;   // kept for validName()
  const setTitle = () => { title.textContent = (d.name || 'UNTITLED').toUpperCase(); };
  setTitle();
  // Tap the name to rename it.
  title.addEventListener('click', () => {
    if ($('.renamein', el)) return;
    const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'renamein'; inp.value = d.name; inp.setAttribute('aria-label', 'Name');
    title.replaceWith(inp); inp.focus(); inp.select();
    const done = () => { d.name = inp.value.trim() || d.name; inp.replaceWith(title); setTitle(); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
    inp.addEventListener('blur', done);
  });
  gesture($('.act-title', el), { moveEl: false, onSwipeRight: () => leave(true), onSwipeLeft: () => leave(false) });

  let subsList = null;
  function render() {
    optcontent.innerHTML = '';
    if (d.type === 'task' || d.type === 'list' || d.type === 'project') {
      // Project: a switch. A project lives in PROJECT BACKLOG; its subtasks (each with a difficulty) go to STACK one by one.
      optcontent.appendChild(switchRow('Project', d.type === 'project', on => {
        if (!on) d.type = d.subtasks.length ? 'list' : 'task';
        else { d.type = 'project'; d.subtasks.forEach(x => { x.size = clampSize(x.size); }); }
        render();
      }));
    }
    if (d.type === 'task' || d.type === 'list') {   // Difficulty (below Project): rows on STACK and points when completed
      optcontent.appendChild(difficultyRow(d.size, n => { d.size = n; }));
    }
    main.innerHTML = '';
    if (hasSubs) {
      if (d.type === 'task') {   // a task has notes; its first subtask makes it a list and the subtasks replace the notes
        main.innerHTML = '<textarea class="notes actnotes" placeholder="Notes"></textarea><div class="list rev hidden"></div><p class="empty hidden"></p>';
        const ta = $('textarea', main); ta.value = d.notes || ''; ta.addEventListener('input', () => { d.notes = ta.value; });
      } else main.innerHTML = '<div class="list rev"></div><p class="empty hidden">No subtasks. Add one below.</p>';
      subsList = $('.list', main);
      renderSubs();
    }
    if (d.type === 'event') {
      main.innerHTML = `<div class="sect"><h3>When</h3><p class="status"></p><button class="btn wide ct">CHANGE TIME</button>${isNew ? '' : '<button class="btn danger wide dl" style="margin-top:10px">DELETE EVENT</button>'}</div>`;
      $('.status', main).textContent = eventWhen(d.event);
      $('.ct', main).addEventListener('click', changeTime);
      const dl = $('.dl', main); if (dl) dl.addEventListener('click', del);
    }
  }
  const si = $('.subin', el);
  if (si) si.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = si.value.trim(); if (!v) return;
    d.subtasks.push({ id: uid(), name: v, done: false });
    if (d.type === 'project') d.subtasks[d.subtasks.length - 1].size = 1;
    si.value = '';
    if (d.type === 'task') {   // its first subtask makes a task a list
      d.type = 'list'; if (d.recSubtasks === undefined) d.recSubtasks = false;
      render(); toast('Now a list');
    } else renderSubs();
  });

  /* Subtasks: swipe right completes (it leaves the list), swipe left deletes, hold and drag reorders. */
  function renderSubs() {
    if (!subsList) return;
    subsList.innerHTML = '';
    const open = d.subtasks.filter(s => !s.done);
    open.forEach(s => {
      const b = document.createElement('div');
      b.className = 'block'; b.dataset.key = s.id;
      let extra = '';
      if (d.type === 'project') {
        const bid = findBlock(d.id, s.id); if (bid && whereBlock(bid) === 'stack') extra = '<span class="meta">STACK</span>';
        extra += sizeIcon(clampSize(s.size));   // project subtasks have sizes: tap to change
      }
      b.innerHTML = `<span class="name">${esc(s.name)}</span>${extra}`;
      subsList.appendChild(b);
    });
    $('.empty', main).classList.toggle('hidden', !!open.length || d.type === 'task');
    wireList(subsList, {
      reverse: true,
      onReorder: keys => { const done = d.subtasks.filter(s => s.done); d.subtasks = keys.map(k => d.subtasks.find(s => s.id === k)).concat(done); renderSubs(); },
      swipeRight: k => completeSub(k),
      swipeLeft: k => { d.subtasks = d.subtasks.filter(s => s.id !== k); afterSubChange(); },
      tap: d.type === 'project' ? k => { const x = d.subtasks.find(y => y.id === k); if (x) { x.size = clampSize(x.size) % 4 + 1; renderSubs(); } } : null
    });
  }
  function completeSub(k) {
    const s = d.subtasks.find(x => x.id === k); if (!s) return;
    if (d.type === 'list' && d.recurring && d.recSubtasks) s.done = true;            // comes back when the list resets
    else if (d.type === 'project' && d.recurring) { toast(`${s.name} done. It stays in this recurring project`); renderSubs(); return; }
    else d.subtasks = d.subtasks.filter(x => x.id !== k);
    afterSubChange();
  }
  /* The last subtask gone: a list turns back into a task (it's saved that way when you leave). */
  function afterSubChange() {
    if (listIsEmpty(d)) { d.subtasks = []; d.type = 'task'; render(); toast('Back to a task'); }
    else renderSubs();
  }

  function validName() {
    const n = (d.name || '').trim();
    if (!n) { toast('Give it a name first (tap the name at the bottom)'); return false; }
    const other = itemByName(n);
    if (other && other.id !== d.id) { toast('Another item already has that name'); return false; }
    d.name = n; return true;
  }
  function commit() {
    if (orig.type !== d.type && state.items[d.id]) {   // Project checkbox changed: move it between STACK/backlog and PROJECT BACKLOG
      const target = d.type; d.type = orig.type; state.items[d.id] = d; convertItem(d.id, target);
    }
    if (d.type === 'project') {
      const keep = new Set(d.subtasks.map(s => s.id));
      for (const bid of Object.keys(state.blocks)) { const b = state.blocks[bid]; if (b.itemId === d.id && b.subId && !keep.has(b.subId)) removeBlock(bid); }
    }
    state.items[d.id] = d;
    if (d.type === 'project') listProject(d.id);
    save();
  }
  /* toStack: swipe right on the name (save and add to STACK). Otherwise swipe left (save and go back). */
  function leave(toStack) {
    if (!validName()) return;
    if (d.type === 'event') return saveEvent();
    commit(); clearMainInput();
    let msg = 'Saved';
    if (d.type === 'project' && orig.type !== 'project') msg = 'Now a project: it’s in PROJECT BACKLOG';
    else if (toStack && d.type === 'project') msg = 'Projects live in PROJECT BACKLOG. Add their subtasks to STACK from there';
    else if (toStack) msg = addToStack(d.id, null, from === 'backlog' ? 'top' : 'bottom') || (from === 'backlog' ? 'Added to top of STACK' : 'Added to STACK');
    else if (placeInBacklog(d.id)) msg = `Saved to ${BACKLOG_TITLE[d.type]}`;
    else if (isNew && d.type === 'project') msg = 'Saved to PROJECT BACKLOG';
    save();
    if (isNew || toStack) closeAll(() => { goPanel('stack'); toast(msg); });
    else closeTop(() => { renderAll(); toast(msg); });
  }
  function del() {
    confirmBox(`Delete “${orig.name}”?`, 'DELETE', () => {
      const gid = orig.type === 'event' && orig.event && orig.event.gcalId;
      const tp = gid ? getToken(true) : null;
      deleteItem(d.id); save(); clearMainInput();
      closeAll(() => { goPanel('stack'); toast('Deleted'); if (tp) setTimeout(() => sync()); });
      const sync = () => tp.then(async tok => {
        if (!tok) return toast('Google is not connected. Delete the event in Google Calendar too.');
        try { await calDeleteEvent(tok, gid); toast('Deleted from Google Calendar'); }
        catch (e) { toast('Could not reach Google Calendar. Delete the event there too.'); }
      });
    });
  }
  function changeTime() {
    openMonth({ title: d.name, picked: d.event && d.event.date, onPick: date => {
      const sel = d.event && d.event.date === date ? { allDay: d.event.allDay, startMin: d.event.startMin, endMin: d.event.endMin } : null;
      openDay({ mode: 'event', date, name: d.name, sel, onSave: ev => {
        d.event = Object.assign({}, ev, { gcalId: d.event && d.event.gcalId || '' });
        closeN(2, render);
      } });
    } });
  }
  function saveEvent() {
    if (!d.event) { toast('Pick a time first'); return; }
    const changed = JSON.stringify([orig.name, orig.event]) !== JSON.stringify([d.name, d.event]) || !d.event.gcalId;
    const tp = changed ? getToken(true) : null;
    commit(); clearMainInput();
    closeAll(() => { goPanel('stack'); toast('Saved'); if (tp) setTimeout(() => sync()); });
    const it = state.items[d.id];
    const sync = () => tp.then(async tok => {
      if (!tok) {
        if (it.event.gcalId) return toast('Google is not connected. Update the event in Google Calendar too.');
        return calFallbackToast('Google is not connected.', it.name, it.event);
      }
      try {
        if (it.event.gcalId) await calUpdateEvent(tok, it.event.gcalId, it.name, it.event);
        else { it.event.gcalId = await calInsertEvent(tok, it.name, it.event); save(); }
        toast('Google Calendar updated');
      } catch (e) {
        if (it.event.gcalId) toast('Could not reach Google Calendar. Update the event there too.');
        else calFallbackToast('Could not reach Google Calendar.', it.name, it.event);
      }
    });
  }

  render();
  openScreen(el);
}

/* ---------- project subtasks (swipe right on a project in PROJECT BACKLOG) ---------- */
function openProjectSubs(id) {

  $('.edit', el).addEventListener('click', () => openEditor(state.items[id], false));
  function render() {

          const bid = findBlock(id, sid); if (bid) removeBlock(bid);

      swipeRight: sid => {

    });
  }
  el._refresh = render;
  render();

/* ---------- recurring + schedule controls ---------- */
function checkBtn(label, on, fn) {
  const b = document.createElement('button');
  b.className = 'check' + (on ? ' on' : '');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = `<span class="box"></span><span>${esc(label)}</span>`;
  b.addEventListener('click', fn);
  return b;
}
function recurringUI(d, host) {
  host.innerHTML = '';
  const again = () => recurringUI(d, host);
  if (d.type === 'task') {
    host.append(checkBtn('Recurring', d.recurring, () => { d.recurring = !d.recurring; again(); }));
    if (d.recurring) host.append(scheduleUI(d));
  } else if (d.type === 'list') {
    host.append(checkBtn('Recurring list', d.recurring, () => { d.recurring = !d.recurring; if (!d.recurring) d.recSubtasks = false; again(); }));
    if (d.recurring) {
      host.append(checkBtn('Recurring subtasks', d.recSubtasks, () => { d.recSubtasks = !d.recSubtasks; again(); }));
      host.append(scheduleUI(d));
    }
  }
}
function scheduleUI(d) {
  const w = document.createElement('div'); w.className = 'sect';
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function render() {
    const s = d.schedule = Object.assign(defaultSchedule('none'), d.schedule || {});
    w.innerHTML = `<h3>Repeats</h3><div class="seg f">${['none', 'daily', 'weekly', 'monthly', 'annually'].map(f => `<button data-f="${f}" class="${s.freq === f ? 'on' : ''}">${f.toUpperCase()}</button>`).join('')}</div><div class="extra"></div>`;
    w.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { s.freq = b.dataset.f; render(); }));
    const x = $('.extra', w);
    if (s.freq === 'weekly') {
      x.innerHTML = `<div class="seg" style="margin-top:10px">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((l, i) => `<button data-d="${i}" aria-label="${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][i]}" class="${s.days.includes(i) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
      x.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.d;
        s.days = s.days.includes(i) ? s.days.filter(v => v !== i) : s.days.concat(i);
        if (!s.days.length) s.days = [i];
        render();
      }));
    } else if (s.freq === 'monthly') {
      x.innerHTML = `<label class="inline">Day of month <input type="number" min="1" max="31" inputmode="numeric" value="${s.dom}"></label>`;
      $('input', x).addEventListener('change', e => { s.dom = Math.min(31, Math.max(1, parseInt(e.target.value, 10) || 1)); e.target.value = s.dom; });
    } else if (s.freq === 'annually') {
      x.innerHTML = `<div class="inline"><select>${MONTHS.map((m, i) => `<option value="${i}" ${i === s.month ? 'selected' : ''}>${m}</option>`).join('')}</select><input type="number" min="1" max="31" inputmode="numeric" value="${s.dom}"></div>`;
      $('select', x).addEventListener('change', e => { s.month = +e.target.value; });
      $('input', x).addEventListener('change', e => { s.dom = Math.min(31, Math.max(1, parseInt(e.target.value, 10) || 1)); e.target.value = s.dom; });
    }
  }
  render();
  return w;
}

/* ---------- month calendar ---------- */
function openMonth({ title, picked, onPick }) {
  const el = screenEl('monthscreen', `<div class="bar"><button class="back" aria-label="Back">‹</button><span class="label"></span></div><div class="months"></div>`);
  $('.label', el).textContent = title;
  backBtn(el);
  const box = $('.months', el), now = new Date(), today = todayStr();
  let html = '';
  for (let i = -1; i <= 24; i++) {
    const m = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    let cells = '';
    for (let k = 0; k < m.getDay(); k++) cells += '<span></span>';
    for (let dd = 1; dd <= days; dd++) {
      const ds = dateStr(new Date(m.getFullYear(), m.getMonth(), dd));
      const cls = [ds < today ? 'past' : '', ds === today ? 'today' : '', ds === picked ? 'picked' : ''].join(' ');
      cells += `<button class="${cls}" data-date="${ds}">${dd}</button>`;
    }
    html += `<div class="month" ${i === 0 ? 'data-cur' : ''}><h2>${m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }).toUpperCase()}</h2><div class="dow">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div>`;
  }
  box.innerHTML = html;
  box.addEventListener('click', e => { const b = e.target.closest('[data-date]'); if (b) onPick(b.dataset.date); });
  openScreen(el);
  requestAnimationFrame(() => { const c = $('[data-cur]', box); if (c) box.scrollTop = c.getBoundingClientRect().top - box.getBoundingClientRect().top - 8; });
}

/* ---------- day timeline (shared by the day views and the SCHEDULE screen) ---------- */
const SLOT_H = 32;   // pixels per 30 minutes
function dayGridHTML() {
  let g = '';
  for (let i = 0; i < 48; i++) g += `<div class="slot ${i % 2 === 0 ? 'hr' : ''}"></div>`;
  for (let h = 0; h < 24; h++) g += `<span class="hlabel" style="top:${h * 2 * SLOT_H}px">${minToClock(h * 60).replace(':00', '')}</span>`;
  return g;
}
/* Google events -> { title, startMin, endMin, allDay } for one day. */
function normalizeEvents(date, evs) {
  const t0 = parseDate(date).getTime(), out = [];
  (evs || []).forEach(e => {
    if (!e.start) return;
    if (e.start.date) { out.push({ title: e.summary || '(busy)', allDay: true, startMin: 0, endMin: 0 }); return; }
    if (!e.start.dateTime) return;
    const a = Math.max(0, (new Date(e.start.dateTime) - t0) / MIN), b = Math.min(1440, (new Date(e.end.dateTime) - t0) / MIN);
    if (b > a) out.push({ title: e.summary || '(busy)', allDay: false, startMin: Math.round(a), endMin: Math.round(b) });
  });
  out.sort((x, y) => x.startMin - y.startMin);
  return out;
}
function paintEvents(grid, strip, list, cls, before) {
  grid.querySelectorAll('.ev').forEach(e => e.remove());
  if (strip) strip.innerHTML = '';
  list.forEach(e => {
    if (e.allDay) { if (strip) { const s = document.createElement('span'); s.textContent = e.title; strip.appendChild(s); } return; }
    const d = document.createElement('div'); d.className = 'ev' + (cls ? ' ' + cls : '');
    d.style.top = (e.startMin / 30 * SLOT_H) + 'px'; d.style.height = Math.max(16, (e.endMin - e.startMin) / 30 * SLOT_H) + 'px';
    d.innerHTML = `<b>${esc(minToClock(e.startMin))}</b> ${esc(e.title)}`;
    grid.insertBefore(d, before || null);
  });
}
function paintNowLine(grid, date) {
  grid.querySelectorAll('.nowline').forEach(e => e.remove());
  if (date !== todayStr()) return;
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  const nl = document.createElement('div'); nl.className = 'nowline'; nl.style.top = (m / 30 * SLOT_H) + 'px'; grid.appendChild(nl);
}
function durText(mins) { return mins >= 60 ? `${Math.floor(mins / 60)}h${mins % 60 ? ' ' + (mins % 60) + 'm' : ''}` : `${mins} min`; }

/* ---------- day view ----------
   mode 'event': pick a time for a new or edited event (30-minute steps, All day, SAVE).
   mode 'schedule': drop an activity onto today (STACK is for today; 15-minute steps). Drag the block to move it,
   drag its bottom bar to resize, hold and drag on empty time to draw a new span.
   Swipe right on SCHEDULE at the bottom to add it to the calendar; swipe left to cancel. */
function openDay({ mode, date, name, sel, onSave }) {
  const isSched = mode === 'schedule';
  const step = isSched ? 15 : 30, slots = 1440 / step, slotH = SLOT_H * step / 30;
  const el = screenEl('dayscreen' + (isSched ? ' schedpick' : ''), `
    ${isSched ? '' : '<div class="bar"><button class="back" aria-label="Back">‹</button><span class="label"></span></div>'}
    <div class="dayhead"><span class="d"></span>${isSched ? '' : '<button class="check allday" style="width:auto"><span class="box"></span><span>All day</span></button>'}</div>
    <div class="allday-strip"></div>
    <div class="dayscroll"><div class="grid" style="margin-top:12px;margin-bottom:24px"></div></div>
    ${isSched ? '<div class="schedfoot"><button class="btn wide addcal">ADD TO CALENDAR</button></div><header class="title sched-title"><h1>SCHEDULE</h1></header>'
              : '<div class="foot"><div class="selinfo"></div><button class="btn primary wide go">SAVE</button></div>'}`);
  if (!isSched) { $('.label', el).textContent = name; backBtn(el); }
  const grid = $('.grid', el), scroller = $('.dayscroll', el), info = $('.selinfo', el), go = $('.go', el), strip = $('.allday-strip', el);
  grid.innerHTML = dayGridHTML();
  const blk = document.createElement('div'); blk.className = 'selblk hidden'; grid.appendChild(blk);

  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  const slotAt = y => Math.max(0, Math.min(slots - 1, Math.floor((y - grid.getBoundingClientRect().top) / slotH)));
  function edgeScroll(y) { const r = scroller.getBoundingClientRect(); if (y < r.top + 40) scroller.scrollTop -= 10; else if (y > r.bottom - 40) scroller.scrollTop += 10; }

  let anchor = 0;
  gesture(grid, {
    moveEl: false,
    enabled: () => !(sel && sel.allDay),
    ignore: t => !!t.closest('.handle, .selblk'),
    onHoldStart: (x, y) => { anchor = slotAt(y); sel = { allDay: false, startMin: anchor * step, endMin: anchor * step + (isSched ? 30 : step) }; draw(); },
    onHoldMove: (x, y) => { edgeScroll(y); const s = slotAt(y), lo = Math.min(anchor, s), hi = Math.max(anchor, s); sel.startMin = lo * step; sel.endMin = (hi + 1) * step; draw(); },
    onHoldEnd: () => {},
    onTap: e => {
      const t = e.changedTouches ? e.changedTouches[0] : e, s = slotAt(t.clientY);
      const len = sel && !sel.allDay && isSched ? sel.endMin - sel.startMin : step;   // tapping moves the block, keeping its length
      sel = { allDay: false, startMin: Math.min(s * step, 1440 - len), endMin: Math.min(s * step, 1440 - len) + len }; draw();
    }
  });

  if (isSched) {
    if (!sel) { const st = date === todayStr() ? Math.min(1410, Math.ceil(nowMin / 15) * 15) : 9 * 60; sel = { allDay: false, startMin: st, endMin: st + 30 }; }
    // Drag the block itself to move it.
    let grab = null;
    blk.addEventListener('touchstart', e => {
      if (e.target.closest('.handle')) return;
      const r = grid.getBoundingClientRect();
      grab = (e.touches[0].clientY - r.top) - sel.startMin / 30 * SLOT_H;
    }, { passive: true });
    blk.addEventListener('touchmove', e => {
      if (grab === null || e.target.closest('.handle')) return;
      if (e.cancelable) e.preventDefault();
      const y = e.touches[0].clientY; edgeScroll(y);
      const r = grid.getBoundingClientRect(), len = sel.endMin - sel.startMin;
      const st = Math.max(0, Math.min(1440 - len, Math.round((y - r.top - grab) / slotH) * step));
      sel.startMin = st; sel.endMin = st + len; draw();
    }, { passive: false });
    blk.addEventListener('touchend', () => { grab = null; });
    $('.addcal', el).addEventListener('click', () => onSave({ date, allDay: false, startMin: sel.startMin, endMin: sel.endMin }));
    gesture($('.sched-title', el), {
      moveEl: false,
      onSwipeRight: () => onSave({ date, allDay: false, startMin: sel.startMin, endMin: sel.endMin }),
      onSwipeLeft: () => closeTop()
    });
  } else {
    $('.allday', el).addEventListener('click', () => {
      if (sel && sel.allDay) sel = null; else sel = { allDay: true, startMin: 0, endMin: 0 };
      draw();
    });
    go.addEventListener('click', () => {
      if (!sel) return;
      onSave({ date, allDay: !!sel.allDay, startMin: sel.startMin, endMin: sel.endMin });
    });
  }
  // Bottom bar resizes (both modes allow it once a block exists).
  const h = document.createElement('div'); h.className = 'handle'; h.setAttribute('aria-label', 'Drag to change the end time'); blk.appendChild(h);
  h.addEventListener('touchmove', e => {
    if (e.cancelable) e.preventDefault();
    const y = e.touches[0].clientY; edgeScroll(y);
    const r = grid.getBoundingClientRect();
    sel.endMin = Math.max(sel.startMin + step, Math.min(1440, Math.round((y - r.top) / slotH) * step));
    draw();
  }, { passive: false });

  function draw() {
    const ad = $('.allday', el);
    if (ad) ad.classList.toggle('on', !!(sel && sel.allDay));
    grid.classList.toggle('off', !!(sel && sel.allDay));
    if (!sel || sel.allDay) {
      blk.classList.add('hidden');
      if (info) info.textContent = sel && sel.allDay ? 'All day' : 'Hold and drag to pick a time';
      if (go) go.disabled = !sel; return;
    }
    blk.classList.remove('hidden');
    blk.style.top = (sel.startMin / 30 * SLOT_H) + 'px';
    blk.style.height = ((sel.endMin - sel.startMin) / 30 * SLOT_H) + 'px';
    const range = `${minToClock(sel.startMin)} to ${minToClock(sel.endMin % 1440)}`;
    const label = isSched ? name : range;   // scheduling: the block shows the task, like a block on STACK
    if (blk.firstChild && blk.firstChild.nodeType === 3) blk.firstChild.textContent = label; else blk.insertBefore(document.createTextNode(label), blk.firstChild);
    if (info) info.textContent = range;
    if (go) go.disabled = false;
  }
  function setDate(dt) {
    date = dt;
    $('.d', el).textContent = parseDate(date).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    paintNowLine(grid, date);
    paintEvents(grid, strip, [], 'dim', blk);
    calDayEvents(date).then(evs => { if (evs && el.isConnected && date === dt) paintEvents(grid, strip, normalizeEvents(date, evs), 'dim', blk); });
  }

  setDate(date);
  draw();
  openScreen(el);
  requestAnimationFrame(() => {
    const focusMin = sel && !sel.allDay ? sel.startMin : (date === todayStr() ? nowMin : 8 * 60);
    scroller.scrollTop = Math.max(0, focusMin / 30 * SLOT_H - 3 * SLOT_H);
  });
}

/* ---------- scheduling an activity (FOCUS, swipe right): it stays where it is ---------- */
function openSchedulePicker(name) {
  openDay({ mode: 'schedule', date: todayStr(), name, onSave: sel => {
    const tp = getToken(true);
    const t0 = parseDate(sel.date).getTime();
    const ev = { name, start: t0 + sel.startMin * MIN, end: t0 + sel.endMin * MIN };
    const when = `${parseDate(sel.date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}, ${minToClock(sel.startMin)}`;
    closeTop(() => {
      toast(`Scheduling ${name}…`);
      tp.then(async tok => {
        const link = () => calFallbackToast('Google is not connected.', name, { startMs: ev.start, endMs: ev.end }, 'Scheduled in Paradigm');
        if (!tok) return link();
        try { await calAddParadigm(tok, ev, 'Scheduled in Paradigm'); toast(`Scheduled ${name} for ${when}`); if (panel === 'schedule') refreshSchedule(false); }
        catch (e) { link(); }
      });
    });
  } });
}

/* ---------- scheduling an item to another day (FOCUS → swipe right) ----------
   Months scroll left to right. Today and earlier can't be picked. ADD TO CALENDAR confirms;
   swipe right on SCHEDULE (or Android back) returns to STACK. */
function openDayPicker(bid, withBacklog) {
  const name = blockName(bid);
  const el = screenEl('dayscreen daypick', `
    ${withBacklog ? '<div class="schedtop"><button class="btn wide tobacklog">BACKLOG</button></div>' : ''}
    <div class="acttop"><span class="label kind"></span></div>
    <div class="mpager"></div>
    <div class="schedfoot"><button class="btn wide addcal" disabled>ADD TO CALENDAR</button></div>
    <header class="title sched-title"><h1>SCHEDULE</h1></header>`);
  $('.kind', el).textContent = name;
  const pager = $('.mpager', el), add = $('.addcal', el);
  const first = addDays(todayStr(), 1), now = new Date();
  let picked = null, html = '';
  for (let i = 0; i <= 12; i++) {
    const m = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    let cells = '';
    for (let k = 0; k < m.getDay(); k++) cells += '<span></span>';
    for (let dd = 1; dd <= days; dd++) {
      const ds = dateStr(new Date(m.getFullYear(), m.getMonth(), dd));
      cells += `<button class="${ds < first ? 'past' : ''}" data-date="${ds}" ${ds < first ? 'disabled' : ''}>${dd}</button>`;
    }
    html += `<div class="mpage"><h2>${m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }).toUpperCase()}</h2><div class="dow">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div>`;
  }
  pager.innerHTML = html;
  pager.addEventListener('click', e => {
    const b = e.target.closest('[data-date]'); if (!b || b.disabled) return;
    pager.querySelectorAll('.picked').forEach(x => x.classList.remove('picked'));
    b.classList.add('picked'); picked = b.dataset.date; add.disabled = false;
  });
  add.addEventListener('click', () => {
    if (!picked) return;
    const tp = getToken(true);   // first, so the tap may sign in
    closeTop(() => scheduleToDay(bid, picked, tp));
  });
  gesture($('.sched-title', el), { moveEl: false, onSwipeRight: () => closeTop(), onSwipeLeft: () => closeTop() });   // back to STACK
  const tb = $('.tobacklog', el);
  if (tb) tb.addEventListener('click', () => {   // BACKLOG: back to its backlog (MOMENTUM unchanged)
    closeTop(() => {
      const b = state.blocks[bid]; if (!b) return;
      const msg = b.subId ? `Returned to ${state.items[b.itemId].name}` : `Sent to ${BACKLOG_TITLE[blockKind(bid)]}`;
      withUndo(msg, () => sendToBacklog(bid));
    });
  });
  openScreen(el);
  // Start on next month when today is the last day of this one.
  if (first.slice(0, 7) !== todayStr().slice(0, 7)) requestAnimationFrame(() => { pager.scrollLeft = pager.clientWidth; });
}

/* ---------- size picker: drag (or tap) across four segments ---------- */
function sizePicker(value, onChange) {
  const el = document.createElement('div'); el.className = 'sizepick';
  el.setAttribute('role', 'slider'); el.setAttribute('aria-label', 'Size'); el.setAttribute('aria-valuemin', '1'); el.setAttribute('aria-valuemax', '4');
  el.innerHTML = [1, 2, 3, 4].map(n => `<i data-n="${n}"></i>`).join('');
  const set = n => {
    value = clampSize(n);
    el.querySelectorAll('i').forEach(i => i.classList.toggle('on', +i.dataset.n <= value));
    el.setAttribute('aria-valuenow', value);
    onChange(value);
  };
  const at = x => { const r = el.getBoundingClientRect(); return Math.ceil(Math.max(0.01, Math.min(0.999, (x - r.left) / r.width)) * 4); };
  el.addEventListener('touchstart', e => { e.stopPropagation(); set(at(e.touches[0].clientX)); }, { passive: true });
  el.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); e.stopPropagation(); set(at(e.touches[0].clientX)); }, { passive: false });
  el.addEventListener('click', e => { if (!('ontouchstart' in window)) set(at(e.clientX)); });
  set(value);
  return el;
}

/* "Difficulty:" with its four blocks on one line. */
function difficultyRow(value, onChange) {
  const r = document.createElement('div'); r.className = 'diffrow';
  const l = document.createElement('span'); l.className = 'difflabel'; l.textContent = 'Difficulty:';
  r.append(l, sizePicker(value, onChange));
  return r;
}
/* A labelled on/off switch, flipped by swiping it: right = on, left = off (taps do nothing). */
function switchRow(label, on, onChange) {
  const r = document.createElement('div'); r.className = 'switchrow';
  r.innerHTML = `<span class="difflabel">${esc(label)}</span><div class="switch" role="switch" aria-checked="${on}" aria-label="${esc(label)} (swipe right for on, left for off)"><i></i></div>`;
  const b = $('.switch', r);
  const set = v => { if (v === on) return; on = v; b.setAttribute('aria-checked', on); onChange(on); };
  gesture(b, { moveEl: false, onSwipeRight: () => set(true), onSwipeLeft: () => set(false) });
  return r;
}

/* ---------- adding something new ----------
   Name → size (drag across the four segments under the block) → swipe the block:
   right = TODAY (bottom of STACK, if it fits) · left = TO-DO, then left = SAVE (backlog) · right = SCHEDULE (pick a day). */
function openComposer(name) {
  let size = 1;
  const el = screenEl('composer', `
    <div class="compmain"><div class="block compblk"><span class="name"></span></div><div class="comppick"></div></div>
    <div class="compsides"><span class="l">← BACKLOG</span><span class="r"></span></div>
    <header class="title"><h1>NEW</h1></header>`);
  const blk = $('.compblk', el), sides = $('.compsides', el);
  $('.name', blk).textContent = name;
  const paint = () => {
    blk.style.minHeight = (size * 54 + (size - 1) * 5) + 'px';
    $('.r', sides).textContent = fits(size) ? 'STACK →' : 'NO ROOM ON STACK';
    $('.r', sides).classList.toggle('blocked', !fits(size));
  };
  $('.comppick', el).appendChild(difficultyRow(size, n => { size = n; paint(); }));
  const create = () => { const it = newItem('task', name); it.size = size; state.items[it.id] = it; return it; };
  gesture(blk, {
    allowRight: () => fits(size),
    onSwipeRight: () => {   // STACK: the bottom, as the new active block
      if (!fits(size)) { toast(NO_ROOM); return; }
      const it = create(); addToStack(it.id, null, 'bottom'); save(); clearMainInput();
      closeAll(() => { goPanel('stack'); toast(`${name} is on STACK`); });
    },
    onSwipeLeft: () => {    // BACKLOG
      const it = create(); placeInBacklog(it.id); save(); clearMainInput();
      closeAll(() => { goPanel('stack'); toast(`Saved to ${BACKLOG_TITLE.task}`); });
    }
  });
  paint();
  openScreen(el);
}

/* Paradigm: RECOVERY. Lists earlier versions of the Drive backup (paradigm-backup.json) so one can be
   restored straight into Paradigm, or downloaded and IMPORTed later.
   It only reads from Drive, except one change Google requires before downloading an older version:
   marking it "Keep Forever", which also stops Google auto-deleting that version. */
'use strict';

let recFileId = '', recRevs = [], recInspected = null, recBusy = false;

function recFmtSize(b) { b = Number(b || 0); return b >= 1024 ? (b / 1024).toFixed(1) + ' KB' : b + ' B'; }
function recFmtWhen(iso) { try { return new Date(iso).toLocaleString(); } catch (e) { return iso; } }
function recErr(e) {
  if (e && e.status === 401) return 'Google sign-in expired. Tap LOAD VERSIONS again.';
  if (e && e.status === 403) return 'Google refused this. Make sure you signed in with the same Google account Paradigm backs up to.';
  return (e && e.message) || 'Something went wrong.';
}

function renderRecovery() {
  const body = $('#recovery-body'); if (!body) return;
  body.innerHTML = `
    <div class="sect"><h3>Drive backup versions</h3>
      <p>Google keeps earlier versions of your Paradigm backup. Load them to see what each one holds, then restore the one from before things went wrong.</p>
      <p class="status rec-status"></p>
      <button class="btn wide" id="rec-load">${recRevs.length ? 'RELOAD VERSIONS' : 'LOAD VERSIONS'}</button>
    </div>
    <div class="list rec-list"></div>
    <div class="sect rec-inspect hidden"><h3 class="rec-title"></h3><pre class="rec-summary"></pre>
      <div class="btnrow"><button class="btn primary" id="rec-restore">RESTORE THIS VERSION</button><button class="btn" id="rec-download">DOWNLOAD</button></div>
      <p>Restoring replaces everything on this phone (and your glasses, once synced). Download first if you want a copy of what's here now: SETTINGS → File backup → EXPORT.</p>
    </div>`;
  $('#rec-load').addEventListener('click', recLoad);
  $('#rec-restore').addEventListener('click', recRestore);
  $('#rec-download').addEventListener('click', recDownload);
  if (!state.settings.clientId) recStatus('Connect Google in SETTINGS first.');
  recPaintList();
  recPaintInspect();
}
function recStatus(msg) { const s = $('#recovery-body .rec-status'); if (s) s.textContent = msg || ''; }

async function recLoad() {
  const tp = getToken(true);   // first, so the tap may sign in
  if (recBusy) return;
  recBusy = true; recStatus('Signing in…');
  try {
    const tok = await tp;
    if (!tok) { recStatus(state.settings.clientId ? 'Could not sign in to Google.' : 'Connect Google in SETTINGS first.'); return; }
    recStatus('Finding your backup…');
    state.settings.driveFileId = '';
    recFileId = await driveFileId(tok);
    if (!recFileId) { recStatus('No backup found in your Drive.'); return; }
    recStatus('Listing versions…');
    const r = await gfetch(tok, 'GET', `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(recFileId)}/revisions?pageSize=200&fields=revisions(id,modifiedTime,size,keepForever)`);
    recRevs = (r.revisions || []).sort((a, b) => new Date(b.modifiedTime) - new Date(a.modifiedTime));
    recStatus(recRevs.length ? `${recRevs.length} version${recRevs.length > 1 ? 's' : ''}, newest at the top. The top one is the current backup.` : 'The backup has no saved versions.');
    recPaintList();
  } catch (e) { recStatus(recErr(e)); }
  finally { recBusy = false; }
}

function recPaintList() {
  const list = $('#recovery-body .rec-list'); if (!list) return;
  list.innerHTML = '';
  recRevs.forEach((rev, i) => {
    const row = document.createElement('div');
    row.className = 'block recrow' + (recInspected && recInspected.rev.id === rev.id ? ' sel' : '');
    row.innerHTML = `<span class="name">${esc(recFmtWhen(rev.modifiedTime))}</span><span class="meta">${i === 0 ? 'CURRENT · ' : ''}${rev.keepForever ? 'KEPT · ' : ''}${recFmtSize(rev.size)}</span>`;
    const b = document.createElement('button'); b.className = 'btn small'; b.textContent = 'INSPECT';
    b.addEventListener('click', () => recInspect(rev, b));
    row.appendChild(b);
    list.appendChild(row);
  });
}

async function recInspect(rev, btn) {
  const tp = getToken(true);
  btn.disabled = true; btn.textContent = '…';
  try {
    const tok = await tp; if (!tok) throw Object.assign(new Error('auth'), { status: 401 });
    const base = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(recFileId)}/revisions/${encodeURIComponent(rev.id)}`;
    // Google only lets you download an older version once it's marked Keep Forever.
    if (!rev.keepForever) { await gfetch(tok, 'PATCH', base, { keepForever: true }); rev.keepForever = true; }
    const r = await fetch(base + '?alt=media', { headers: { Authorization: 'Bearer ' + tok } });
    if (!r.ok) throw Object.assign(new Error('http ' + r.status), { status: r.status });
    const text = await r.text();
    const data = JSON.parse(text);
    if (!data.items) throw new Error('This version is not a Paradigm backup.');
    recInspected = { rev, text, data };
    recPaintList(); recPaintInspect();
    const box = $('#recovery-body .rec-inspect'); if (box) box.scrollIntoView({ block: 'start', behavior: 'smooth' });
  } catch (e) { toast(`Could not read this version. ${recErr(e)}`); }
  finally { btn.disabled = false; btn.textContent = 'INSPECT'; }
}

function recSummary(data) {
  const items = data.items || {}, blocks = data.blocks || {}, stack = data.stack || [], bl = data.backlogs || {};
  const names = [];
  for (const bid of stack.slice(0, 8)) {
    const b = blocks[bid], it = b && items[b.itemId]; if (!it) continue;
    if (b.subId) { const sub = (it.subtasks || []).find(x => x.id === b.subId); names.push(`${it.name} › ${sub ? sub.name : '?'}`); }
    else names.push(it.name);
  }
  return [
    'Saved: ' + (data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'unknown'),
    'Items: ' + Object.keys(items).length,
    'On STACK: ' + stack.length,
    `Backlogs: ${(bl.task || []).length} tasks, ${(bl.list || []).length} lists, ${(bl.project || []).length} projects`,
    'Waiting for the calendar: ' + (data.calQueue || []).length,
    '',
    'Bottom of STACK (highest priority first):',
    ...(names.length ? names.map(n => '  • ' + n) : ['  (empty)'])
  ].join('\n');
}
function recPaintInspect() {
  const box = $('#recovery-body .rec-inspect'); if (!box) return;
  box.classList.toggle('hidden', !recInspected);
  if (!recInspected) return;
  $('.rec-title', box).textContent = 'Version from ' + recFmtWhen(recInspected.rev.modifiedTime);
  $('.rec-summary', box).textContent = recSummary(recInspected.data);
}
function recRestore() {
  if (!recInspected) return;
  confirmBox(`Replace everything in Paradigm with the version from ${recFmtWhen(recInspected.rev.modifiedTime)}?`, 'RESTORE', () => {
    applyImport(clone(recInspected.data));
    toast('Restored. Your glasses update on their next sync');
    goPanel('stack');
  });
}
function recDownload() {
  if (!recInspected) return;
  const d = new Date(recInspected.rev.modifiedTime);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([recInspected.text], { type: 'application/json' }));
  a.download = `paradigm-version-${dateStr(d)}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* Paradigm: main panels and boot */
'use strict';

const VERSION = '3.0.2';
const PANELS = ['recovery', 'settings', 'project', 'list', 'task', 'schedule', 'stack', 'focus', 'support'];
let panel = 'stack';

function goPanel(name, instant) {
  if (panel === 'focus' && name !== 'focus') pauseTimer();   // leaving FOCUS pauses the timer (time is kept)
  if (name !== 'stack') disarm();   // leaving STACK ends a highlight
  panel = name;
  const tr = $('#track');
  if (instant) tr.style.transition = 'none';
  tr.style.transform = `translateX(${-PANELS.indexOf(name) * 100 / PANELS.length}%)`;
  if (instant) requestAnimationFrame(() => { tr.style.transition = ''; });
  hideSuggest();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (name === 'schedule') refreshSchedule(false);
  if (name === 'settings') renderSettings();
  if (name === 'recovery') renderRecovery();
}

/* ---------- blocks ---------- */
const ROW = 54, GAP = 5;
const rowsPx = n => n * ROW + (n - 1) * GAP;
function sizeIcon(n) { return `<span class="sz" aria-label="Difficulty ${n}">${[1, 2, 3, 4].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; }
/* On STACK a block is as tall as its size (dashed lines mark the rows); in a backlog it's one row with a size icon. */
function blockEl(bid, where) {
  const b = state.blocks[bid], it = state.items[b.itemId], l = blockLabel(bid);
  const size = blockSize(bid), onStack = where === 'stack';
  const el = document.createElement('div');
  el.className = 'block' + (onStack && size > 1 ? ' sized' : '') + (onStack && isCarried(bid) ? ' carry' : '');
  el.dataset.key = bid;
  if (onStack && size > 1) {
    el.style.minHeight = rowsPx(size) + 'px';
    for (let r = 1; r < size; r++) { const line = document.createElement('span'); line.className = 'rowline'; line.style.top = (r * (ROW + GAP) - GAP / 2 - 2) + 'px'; el.appendChild(line); }
  }
  let meta = '';
  if ((it.type === 'list' || it.type === 'task') && !b.subId && (it.subtasks || []).length) meta += `<span class="meta">${it.subtasks.filter(s => s.done).length}/${it.subtasks.length}</span>`;
  if (it.cal && it.cal.date === todayStr() && it.cal.startMin != null && !b.subId) meta = `<span class="meta">${minToClock(it.cal.startMin)}</span>` + meta;
  if (!onStack) meta += sizeIcon(size);
  const warn = onStack && isCaution(bid) ? '<span class="warn" aria-label="Repeat detected">⚠</span>' : '';
  if (warn) el.classList.add('caution');
  el.insertAdjacentHTML('beforeend', `${warn}<span class="name">${l.proj ? `<span class="proj">${esc(l.proj)}:</span> ` : ''}${esc(l.name)}</span>${warn}${meta}`);
  return el;
}

/* ---------- gestures (3.0) ----------
   Screens, left to right: RECOVERY · SETTINGS · PROJECT · LIST · TASK · SCHEDULE · STACK · FOCUS · SUPPORT.
   Active block (bottom of STACK):  → complete (+difficulty) · ← bump to tomorrow
                                    highlighted: → delete · ← pick a day (or BACKLOG)
   Other STACK blocks: hold and drag to reorder (no swipes). Highlighted: the title reads FOCUS.
   A block with ⚠ (repeat detected): → opens REPEAT DETECTED, active or not.
   STACK title:  → SCHEDULE (highlighted: place it at a time today) · ← FOCUS (highlighted: that block; else the active one)
   MOMENTUM bar: → HISTORY · ← GRAPH. */
function blockEditable(bid) { return !!state.blocks[bid]; }
function editBlock(bid) { openFocus(bid); }
function scheduleBlock(bid) { if (state.blocks[bid]) openDayPicker(bid, true); }
function deleteBlock(bid) { if (state.blocks[bid]) withUndo(`Deleted ${blockName(bid)}`, () => deleteBlockItem(bid)); }
const isActive = bid => state.stack[0] === bid;
const openSubs = bid => { const b = state.blocks[bid], it = b && state.items[b.itemId]; return !!(it && !b.subId && (it.subtasks || []).some(s => !s.done)); };
function completeActive(bid) {
  if (openSubs(bid)) { openFocus(bid); toast('Finish its subtasks first'); return; }
  const name = blockName(bid), size = blockSize(bid);
  withUndo(`Completed ${name} · +${size}`, () => completeBlock(bid));
}
function bumpTomorrow(bid) {
  const tp = getToken(true);   // first, so the swipe may sign in
  scheduleToDay(bid, addDays(todayStr(), 1), tp);
}
const PANEL_TITLE = { project: 'PROJECT BACKLOG', list: 'LIST BACKLOG', task: 'TASK BACKLOG', stack: 'STACK' };
/* FOCUS (highlight): the screen name reads FOCUS. Tap the block again to leave. */
function onArmChange(el) {
  for (const k of Object.keys(PANEL_TITLE)) { $(`#t-${k} h1`).textContent = PANEL_TITLE[k]; $(`#p-${k}`).classList.remove('focusmode'); }
  const p = el && el.closest('.panel');
  if (p && PANEL_TITLE[p.id.slice(2)]) { $(`#t-${p.id.slice(2)} h1`).textContent = 'FOCUS'; p.classList.add('focusmode'); }
}
function armedKey(panelKey) { return armed && armed.isConnected && armed.closest(`#p-${panelKey}`) ? armed.dataset.key : null; }
function renderAll() {
  if (!state) return;
  renderStack(); renderBacklogs(); renderSettings(); onArmChange(null);
  if (panel === 'focus') renderFocus(); if (panel === 'support') renderSupport();
}

/* ---------- STACK ---------- */
/* The top of STACK: MOMENTUM = today's score (difficulty completed today; back to 0 each day). */
function renderScores() {
  $('#sc-m').textContent = state.score.date === todayStr() ? state.score.today : 0;
}
function renderStack() {
  renderScores();
  const list = $('#stack-list');
  list.innerHTML = '';
  state.stack.forEach((bid, i) => { const e = blockEl(bid, 'stack'); if (i === 0) e.classList.add('active'); list.appendChild(e); });
  wireList(list, {
    reverse: true,
    onReorder: keys => { state.stack = keys; save(); renderStack(); },
    armable: blockEditable,
    // Highlighted swipes are for the active block only: → delete · ← pick a day / BACKLOG.
    openEdit: bid => { if (isActive(bid)) deleteBlock(bid); else toast('Swipe the title: → SCHEDULE · ← FOCUS'); },
    armDelete: bid => { if (isActive(bid)) openDayPicker(bid, true); else toast('Swipe the title: → SCHEDULE · ← FOCUS'); },
    swipeRight: bid => {
      if (isCaution(bid)) { openRepeat(bid); return; }   // ⚠: REPEAT DETECTED (any block)
      if (isActive(bid)) completeActive(bid);
    },
    swipeLeft: bid => { if (isActive(bid)) bumpTomorrow(bid); },
    // Only the active block (or a ⚠ block, to the right) moves sideways.
    moves: (bid, dir) => isActive(bid) || (dir > 0 && isCaution(bid))
  });
  // Non-active blocks only reorder: no sideways swipes unless they carry ⚠.
  [...list.children].forEach(el => { if (!isActive(el.dataset.key) && !isCaution(el.dataset.key)) el.dataset.still = '1'; });
  $('#stack-empty').classList.toggle('hidden', !!state.stack.length);
  const area = $('#stack-area'); requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
}

/* ---------- BACKLOGS (bottom-aligned; bottom = highest priority) ---------- */
function projectEl(id) {
  const it = state.items[id], n = it.subtasks.length, d = it.subtasks.filter(s => s.done).length;
  const el = document.createElement('div');
  el.className = 'block'; el.dataset.key = id;
  el.innerHTML = `<span class="name">${esc(it.name)}</span>${n ? `<span class="meta">${d}/${n}</span>` : ''}${sizeIcon(Math.min(4, Math.max(1, projectSize(it))))}<span class="mark" aria-hidden="true">›</span>`;
  return el;
}
/* Backlog items: → add to the top of STACK · ← delete (UNDO).
   Highlighted (the title reads FOCUS): swipe right on FOCUS to schedule it for a day · left for its memory screen. */
function renderBacklogs() {
  const pl = $('#bl-project');
  pl.innerHTML = '';
  state.backlogs.project.forEach(id => pl.appendChild(projectEl(id)));
  wireList(pl, {
    reverse: true,
    onReorder: keys => { state.backlogs.project = keys; save(); },
    armable: () => true,
    swipeRight: id => openProjectSubs(id),                                              // → : its subtasks, to send to STACK
    swipeLeft: id => withUndo(`Deleted ${state.items[id].name}`, () => deleteItem(id))  // ← : delete
  });

  for (const k of BLOCK_KINDS) {
    const list = $('#bl-' + k);

    wireList(list, {
      reverse: true,
      onReorder: keys => { state.backlogs[k] = keys; save(); },
      armable: blockEditable,
      swipeRight: bid => {                                        // → : to the top of STACK
        const b = state.blocks[bid]; if (!b) return;
        const msg = addToStack(b.itemId, b.subId, 'top');
        if (msg) { toast(msg); return; }
        save(); renderAll(); toast('Added to top of STACK');

    });

  }
}

}

/* ---------- glasses: sync hooks, calendar queue, pairing ---------- */
function saveSyncMeta() { state.settings.syncRev = syncRev; save({ noSync: true, noBackup: true }); }
function onSyncStatus() { renderSettings(); }
function onSyncConflict() { toast('Updated from your glasses. Redo your last change if it’s missing'); }
let calQueueToasted = 0;
const postedEvents = {};       // queue entry id -> Google event id (so UNDO can remove it)
const undoneEntries = new Set();
/* Posts queued calendar items: days scheduled here or on the glasses (all-day events), and older timed ones. */
async function processCalQueue(interactive, quiet) {
  const n = (state.calQueue || []).length;
  if (!n) return;
  const tok = await getToken(interactive);
  if (!tok) {
    renderSettings();
    if (!interactive && !quiet && state.settings.clientId && n > calQueueToasted) {
      calQueueToasted = n;
      toast(`${n} scheduled item${n > 1 ? 's' : ''} need${n > 1 ? '' : 's'} Google Calendar`, { label: 'ADD', fn: () => processCalQueue(true) });
    }
    return;
  }
  let done = 0, wait = 0;
  const HOLD = 8000;   // a scheduled day waits out both devices' undo windows before it reaches Google
  for (const c of state.calQueue.slice()) {
    if (c.kind === 'allday' && c.at && Date.now() - c.at < HOLD) { wait = Math.max(wait, HOLD - (Date.now() - c.at)); continue; }
    try {
      if (c.kind === 'allday') {
        const id = await calAddParadigmAllDay(tok, c);
        postedEvents[c.id] = id;
        if (undoneEntries.has(c.id)) { await calDeleteParadigmEvent(tok, id).catch(() => {}); }
      } else await calAddParadigm(tok, c, c.kind === 'schedule' ? 'Scheduled in Paradigm' : 'Completed in Paradigm');
      state.calQueue = state.calQueue.filter(x => x.id !== c.id); done++;
    } catch (e) { break; }
  }
  if (wait) setTimeout(() => processCalQueue(false, true), wait + 300);
  calQueueToasted = state.calQueue.length;
  if (done) save();
  renderSettings();
  if (done && !quiet) toast(`Added ${done} scheduled item${done > 1 ? 's' : ''} to your Paradigm calendar`);
}
/* FOCUS → right, then a day: the item becomes an all-day event that day and leaves Paradigm until then. */
function scheduleToDay(bid, date, tp) {
  const snap = JSON.stringify(state);
  const entry = scheduleBlockToDay(bid, date); if (!entry) return;
  save(); renderAll();
  const day = parseDate(date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  toast(`Scheduled ${entry.name} for ${day}${entry.rrule ? ', repeating' : ''}`, { label: 'UNDO', fn: () => {
    const auth = state.auth, settings = state.settings;
    state = JSON.parse(snap); state.auth = auth; state.settings = settings;
    save(); renderAll();
    undoneEntries.add(entry.id);
    const ev = postedEvents[entry.id];
    if (ev) getToken(false).then(tok => tok && calDeleteParadigmEvent(tok, ev).catch(() => {}));
  } });
  tp.then(tok => {
    if (tok) processCalQueue(false, true);
    else setTimeout(() => toast('Scheduled. It goes on your calendar once Google is connected'), 5200);
  });
}
function glassesUrl() {

/* ---------- today's calendar onto STACK, once a day ----------
   The first time Paradigm opens on the phone each day, today's timed events go to the bottom of STACK
   in time order (first event at the very bottom). Skips all-day events, events you declined, and the
   Paradigm calendar's own events (those are activities already in Paradigm). A repeating event reuses
   its block instead of piling up copies. If Google needs a tap to sign in again, a bar on STACK asks. */
/* The import button takes the place of "Search or add" until today's calendar is in. */
function showCalBar(show) {
  const b = $('#calbar'), i = $('#main-input'); if (!b) return;
  b.classList.toggle('hidden', !show); i.classList.toggle('hidden', !!show);
}
let calImporting = false;
/* A new day: carry-overs turn red and cost MOMENTUM (store.js dayRollover). Runs before today's import. */
function rollover() {
  const n = dayRollover();
  if (n > 0) { save(); renderAll(); const pen = (state.score.history.slice(-1)[0] || {}).penalty || 0; toast(`${n} block${n > 1 ? 's' : ''} carried over${pen ? ` · −${pen} from yesterday’s MOMENTUM` : ''}`); }
  else if (n < 0) { save(); renderAll(); }
  else renderScores();
}
async function importTodayCalendar(interactive) {
  rollover();
  const today = todayStr();
  if (state.calImportDate === today || !state.settings.clientId) { showCalBar(false); return; }
  const tp = getToken(interactive);   // first, so a tap on the bar may sign in
  if (calImporting) return;
  calImporting = true;
  try {
    const tok = await tp;
    if (!tok) { showCalBar(true); return; }
    const evs = await calDayEvents(today);
    if (!evs) { showCalBar(true); if (interactive) toast('Could not reach Google Calendar'); return; }
    if (state.calImportDate === today) return;   // the other device got there first
    const t0 = parseDate(today).getTime();
    const declined = e => (e.attendees || []).some(a => a.self && a.responseStatus === 'declined');
    const isPara = e => e._cal === state.settings.paradigmCalId;
    const seen = new Set(), fresh = e => !seen.has(e.id) && seen.add(e.id);
    const ok = e => e.status !== 'cancelled' && e.start && !declined(e);
    // Timed events from your calendars (not Paradigm's own timed ones), with their description as notes.
    const timed = evs.filter(e => ok(e) && !isPara(e) && e.start.dateTime)
      .map(e => ({ id: e.id, title: (e.summary || '(busy)').trim(), notes: descriptionText(e.description),
        startMin: Math.max(0, Math.round((new Date(e.start.dateTime) - t0) / MIN)), endMin: Math.min(1440, Math.round((new Date(e.end.dateTime) - t0) / MIN)) }))
      .filter(fresh).sort((a, b) => a.startMin - b.startMin);
    // Days you scheduled from Paradigm: all-day events on the Paradigm calendar, brought back with their subtasks.
    const allday = evs.filter(e => ok(e) && isPara(e) && e.start.date)
      .map(e => ({ id: e.id, title: (e.summary || 'Untitled').trim(), payload: readPayload(e), notes: descriptionText(e.description) }))
      .filter(fresh);
    // All-day events you made in your main calendar come in too (holidays and birthdays live on other calendars).
    const mainAllDay = evs.filter(e => ok(e) && !isPara(e) && e.start.date)
      .map(e => ({ id: e.id, title: (e.summary || 'Untitled').trim(), notes: descriptionText(e.description), size: 1 }))
      .filter(fresh);
    // Size from length, rounding up: 30 min = 1, 1 hr = 2, 2 hr = 3, longer = 4.
    const sizeFor = mins => mins <= 30 ? 1 : mins <= 60 ? 2 : mins <= 120 ? 3 : 4;
    timed.forEach(ev => { ev.size = sizeFor(ev.endMin - ev.startMin); });
    allday.forEach(ev => { ev.size = clampSize(ev.payload && ev.payload.size); });
    const make = (ev, cal) => {
      const p = ev.payload;
      const wantList = !!(p && (p.subtasks || []).length);
      let it = itemByName(ev.title), name = ev.title;
      if (it && it.type !== 'task' && it.type !== 'list') { name = `${ev.title} (calendar)`; it = itemByName(name); }
      if (!it) {
        it = newItem(wantList ? 'list' : 'task', name);
        if (wantList) it.subtasks = p.subtasks.map(n => ({ id: uid(), name: n, done: false }));
        it.notes = p ? (p.notes || '') : (ev.notes || '');
        it.size = ev.size;
        state.items[it.id] = it;
      } else if (!it.notes && (p ? p.notes : ev.notes)) it.notes = p ? p.notes : ev.notes;
      it.cal = cal;
      let bid = findBlock(it.id, null);
      if (bid) detach(bid); else { bid = uid(); state.blocks[bid] = { bid, itemId: it.id, subId: null, elapsed: 0 }; }
      return bid;
    };
    // Priority: timed events (earliest first), then the all-day ones. What fits goes to the bottom of STACK;
    // nothing overflows the capacity line, so the rest waits at the top of its backlog.
    const queue = timed.map(ev => [ev, { id: ev.id, date: today, startMin: ev.startMin, endMin: ev.endMin }])
      .concat(allday.concat(mainAllDay).map(ev => [ev, { id: ev.id, date: today }]));
    let room = capacity() - stackLoad(), added = 0, waiting = 0;
    const onStack = [];
    for (const [ev, cal] of queue) {
      const bid = make(ev, cal);
      if (ev.size <= room) { room -= ev.size; onStack.push(bid); added++; }
      else { detach(bid); state.backlogs[blockKind(bid)].push(bid); waiting++; }
    }
    // Earliest at the very bottom: insert in reverse priority order.
    for (const bid of onStack.slice().reverse()) { delete state.blocks[bid].carried; state.stack.unshift(bid); countRepeat(bid); }
    state.calImportDate = today;
    save(); renderAll(); showCalBar(false);
    if (added || waiting || interactive) toast(added || waiting ? `Added ${added} event${added === 1 ? '' : 's'} from today’s calendar to STACK${waiting ? ` · ${waiting} didn’t fit (in backlogs)` : ''}` : 'Nothing on today’s calendar');
  } finally { calImporting = false; }
}

/* ---------- SCHEDULE: a live copy of today's calendar ---------- */
function calendarAppUrl(date) {
  const d = parseDate(date);
  const web = `https://calendar.google.com/calendar/r/day/${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  // On Android, open the Google Calendar app directly (falling back to the website if it isn't installed).
  if (/Android/i.test(navigator.userAgent)) return `intent://calendar.google.com/calendar/r/day/${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}#Intent;scheme=https;package=com.google.android.calendar;S.browser_fallback_url=${encodeURIComponent(web)};end`;
  return web;
}
let schedPainted = false;
async function refreshSchedule(interactive) {
  const tp = getToken(interactive);   // first, so a tap on REFRESH may sign in
  const date = todayStr(), grid = $('#sched-grid'), note = $('#sched-note');
  if (!schedPainted) { grid.innerHTML = dayGridHTML(); schedPainted = true; requestAnimationFrame(() => { const n = new Date(); $('#sched-scroll').scrollTop = Math.max(0, (n.getHours() * 60 + n.getMinutes()) / 30 * SLOT_H - 3 * SLOT_H); }); }
  $('#sched-date').textContent = parseDate(date).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  $('#b-calendar').href = calendarAppUrl(date);
  paintNowLine(grid, date);
  const cache = state.dayCache && state.dayCache.date === date ? state.dayCache : null;
  if (cache) paintEvents(grid, $('#sched-allday'), cache.events, 'live');
  const tok = await tp;
  if (!tok) {
    note.textContent = state.settings.clientId
      ? (cache ? `As of ${msToClock(cache.at)}. Tap REFRESH to update.` : 'Tap REFRESH to load today from Google Calendar.')
      : 'Connect Google in SETTINGS (the next screen over) to see your day here.';
    return;
  }
  note.textContent = 'Loading…';
  const evs = await calDayEvents(date);
  if (!evs) { note.textContent = 'Could not reach Google Calendar.'; return; }
  const list = normalizeEvents(date, evs);
  paintEvents(grid, $('#sched-allday'), list, 'live');
  note.textContent = list.length ? '' : 'Nothing on your calendar today.';
  // Share it with the glasses (only when it changed, so sync stays quiet).
  if (!cache || JSON.stringify(cache.events) !== JSON.stringify(list)) { state.dayCache = { date, at: Date.now(), events: list }; save({ noBackup: true }); }
}

/* ---------- FOCUS: a block's memory (notes, subtasks, difficulty) + a timer for the active block ---------- */
let focusBid = null, timerStart = 0, timerTick = null;
function openFocus(bid) { if (!state.blocks[bid]) return; focusBid = bid; renderFocus(); goPanel('focus'); }
function focusItem() { const b = state.blocks[focusBid]; return b ? { b, it: state.items[b.itemId] } : null; }
function timeOf(it) { return (it.timeSpent || 0) + (timerStart ? Date.now() - timerStart : 0); }
function pauseTimer() {
  if (!timerStart) return;
  const f = focusItem(); if (f) f.it.timeSpent = (f.it.timeSpent || 0) + (Date.now() - timerStart);
  timerStart = 0; clearInterval(timerTick); save();
  if (panel === 'focus') renderFocus();
}
function renderFocus() {
  const body = $('#focus-body'), f = focusItem();
  if (!f) { body.innerHTML = '<p class="empty">Nothing in FOCUS.</p>'; $('#t-focus h1').textContent = 'FOCUS'; return; }
  const { b, it } = f, active = isActive(focusBid);
  $('#t-focus h1').textContent = blockName(focusBid).toUpperCase();
  body.innerHTML = `${active ? '<button class="btn wide timerbtn"></button>' : ''}<div class="dettop"></div>
    <div class="actmain"></div>${b.subId ? '' : '<div class="inputbar actinput"><input class="subin" type="text" placeholder="Add a subtask" enterkeyhint="done" autocomplete="off"></div>'}`;
  const tb = $('.timerbtn', body);
  if (tb) {
    const paint = () => { const t = timeOf(it); tb.textContent = timerStart ? `❚❚ ${fmtDur(t)}` : (t ? `▶ RESUME TIMER · ${fmtDur(t)}` : '▶ START TIMER'); tb.classList.toggle('running', !!timerStart); };
    tb.addEventListener('click', () => { if (timerStart) pauseTimer(); else { timerStart = Date.now(); clearInterval(timerTick); timerTick = setInterval(paint, 1000); } paint(); });
    if (timerStart) { clearInterval(timerTick); timerTick = setInterval(paint, 1000); }   // keep ticking after a redraw
    paint();
  }
  const target = b.subId ? (it.subtasks || []).find(x => x.id === b.subId) : it;
  $('.dettop', body).appendChild(difficultyRow(clampSize(target && target.size), n => { if (target) { target.size = n; save(); renderStack(); } }));
  const main = $('.actmain', body);
  if (b.subId) { main.innerHTML = `<p class="note">Part of ${esc(it.name)}.</p>`; return; }
  const open = (it.subtasks || []).filter(x => !x.done);
  if (!open.length) {   // a task's notes, until subtasks replace them
    main.innerHTML = '<textarea class="notes actnotes" placeholder="Notes"></textarea>';
    const ta = $('textarea', main); ta.value = it.notes || ''; ta.addEventListener('input', () => { it.notes = ta.value; save(); });
  } else {
    main.innerHTML = '<div class="list rev"></div>';
    const list = $('.list', main);
    open.forEach(x => { const e = document.createElement('div'); e.className = 'block'; e.dataset.key = x.id; e.innerHTML = `<span class="name">${esc(x.name)}</span>`; list.appendChild(e); });
    wireList(list, {
      reverse: true,
      onReorder: keys => { const done = it.subtasks.filter(x => x.done); it.subtasks = keys.map(k => it.subtasks.find(x => x.id === k)).concat(done); save(); renderFocus(); },
      swipeRight: k => { it.subtasks = it.subtasks.filter(x => x.id !== k); if (maybeRevertToTask(it.id)) toast('All subtasks done'); save(); renderStack(); renderFocus(); },
      swipeLeft: k => { it.subtasks = it.subtasks.filter(x => x.id !== k); maybeRevertToTask(it.id); save(); renderStack(); renderFocus(); }
    });
  }
  const si = $('.subin', body);
  if (si) si.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const v = si.value.trim(); if (!v) return;
    it.subtasks = it.subtasks || []; it.subtasks.push({ id: uid(), name: v, done: false });
    if (it.type === 'task') it.type = 'list';
    save(); renderStack(); renderFocus(); const n = $('#focus-body .subin'); if (n) n.focus();
  });
}

/* ---------- SUPPORT: two prompts, then DIVIDE & CONQUER ---------- */
let supportBid = null;
function openSupport(bid) { if (!state.blocks[bid]) return; supportBid = bid; focusBid = bid; renderSupport(); goPanel('support'); }
function renderSupport() {
  const body = $('#support-body');
  if (!supportBid || !state.blocks[supportBid]) { body.innerHTML = '<p class="empty">Nothing to support.</p>'; return; }
  if (body.dataset.for === supportBid && $('.sp1', body)) return;   // keep what's being typed
  body.dataset.for = supportBid;
  body.innerHTML = `<p class="supname"></p>
    <label class="q">What is preventing you from completing this task?<textarea class="notes sp1" rows="3"></textarea></label>
    <label class="q">What will help you complete this task?<textarea class="notes sp2" rows="3"></textarea></label>`;
  $('.supname', body).textContent = blockName(supportBid);
}
/* The answer to "what will help" becomes the bottom subtask; "what's preventing" goes into the notes. +1 MOMENTUM. */
function divideAndConquer() {
  const bid = supportBid, b = state.blocks[bid]; if (!b) return;
  const body = $('#support-body');
  const p1 = (($('.sp1', body) || {}).value || '').trim(), p2 = (($('.sp2', body) || {}).value || '').trim();
  if (!p2) { toast('Answer “What will help you complete this task?” first'); return; }
  const it = state.items[b.itemId];
  if (b.subId) {   // a project piece: the help becomes a new piece just before it
    const i = it.subtasks.findIndex(x => x.id === b.subId);
    it.subtasks.splice(Math.max(0, i), 0, { id: uid(), name: p2, done: false, size: 1 });
  } else {
    it.subtasks = it.subtasks || [];
    it.subtasks.unshift({ id: uid(), name: p2, done: false });   // the bottom-most subtask
    if (it.type === 'task') it.type = 'list';
  }
  if (p1) it.notes = (it.notes ? it.notes + '\n' : '') + `Preventing: ${p1}`;
  addPoints(1);
  delete body.dataset.for;
  save(); renderAll();
  toast('Divided · +1 MOMENTUM');
  openFocus(bid);
}

/* ---------- REPEAT DETECTED → REQUIRES SUPPORT / REQUIRES SYSTEM ---------- */
function openRepeat(bid) {
  const el = screenEl('repeatscreen', `
    <div class="repmain"><p class="reptxt"></p>
      <button class="btn wide rsup">REQUIRES SUPPORT</button>
      <button class="btn wide rsys">REQUIRES SYSTEM</button></div>
    <header class="title"><h1>REPEAT DETECTED</h1></header>`);
  const t = repeatTarget(bid);
  $('.reptxt', el).textContent = `${blockName(bid)} has been on STACK ${(t && t.repeats) || REPEAT_AT} times.`;
  $('.rsup', el).addEventListener('click', () => { clearRepeats(bid); save(); closeTop(() => { renderAll(); openSupport(bid); }); });
  $('.rsys', el).addEventListener('click', () => closeTop(() => openBuildSystem(bid)));
  gesture($('.title', el), { moveEl: false, onSwipeLeft: () => closeTop(), onSwipeRight: () => closeTop() });
  openScreen(el);
}
/* BUILD SYSTEM: make it a recurring all-day event on the Paradigm calendar (it comes back each day it's due). */
function openBuildSystem(bid) {
  const d = { recurring: true, schedule: defaultSchedule('weekly') };
  const el = screenEl('buildsys', `
    <div class="repmain"><p class="reptxt"></p><div class="sysrule"></div>
      <button class="btn wide primary rbuild">BUILD SYSTEM</button></div>
    <header class="title"><h1>BUILD SYSTEM</h1></header>`);
  $('.reptxt', el).textContent = `Make ${blockName(bid)} a recurring event. It leaves Paradigm and comes back each day it's due.`;
  $('.sysrule', el).appendChild(scheduleUI(d));
  $('.rbuild', el).addEventListener('click', () => {
    if (d.schedule.freq === 'none') { toast('Pick how often it repeats'); return; }
    const tp = getToken(true);
    clearRepeats(bid);
    const rule = rruleFor(d.schedule);
    closeTop(() => {
      const snap = JSON.stringify(state);
      const entry = scheduleBlockToDay(bid, addDays(todayStr(), 1), rule); if (!entry) return;
      save(); renderAll(); goPanel('stack');
      toast(`${entry.name} is now a recurring event`, { label: 'UNDO', fn: () => {
        const auth = state.auth, settings = state.settings; state = JSON.parse(snap); state.auth = auth; state.settings = settings; save(); renderAll(); undoneEntries.add(entry.id);
      } });
      tp.then(tok => { if (tok) processCalQueue(false, true); });
    });
  });
  gesture($('.title', el), { moveEl: false, onSwipeLeft: () => closeTop(), onSwipeRight: () => closeTop() });
  openScreen(el);
}

/* ---------- placing a block at a time today (highlighted + STACK title →) ---------- */
function openPlacement(bid) {
  const name = blockName(bid);
  openDay({ mode: 'schedule', date: todayStr(), name, onSave: sel => {
    const tp = getToken(true);
    const t0 = parseDate(todayStr()).getTime(), b = state.blocks[bid]; if (!b) return;
    b.at = t0 + sel.startMin * MIN; delete b.atDone;
    state.calQueue.push({ id: uid(), kind: 'schedule', name, start: b.at, end: t0 + sel.endMin * MIN });
    save();
    closeTop(() => { renderAll(); goPanel('stack'); toast(`${name} at ${minToClock(sel.startMin)}: it moves to the bottom then`); });
    tp.then(tok => { if (tok) processCalQueue(false, true); });
  } });
}

/* ---------- HISTORY (MOMENTUM by day) and GRAPH ---------- */
function dayScores() {
  const m = new Map((state.score.history || []).map(h => [h.date, h.done]));
  if (state.score.date === todayStr()) m.set(todayStr(), state.score.today);
  return m;
}
function openHistory() {
  const scores = dayScores(), now = new Date();
  const el = screenEl('historyscreen slideinleft', `<div class="mpager histpager"></div><header class="title" id="t-history"><h1>HISTORY</h1></header>`);
  let html = '';
  for (let i = -11; i <= 0; i++) {
    const m = new Date(now.getFullYear(), now.getMonth() + i, 1), days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    let cells = '';
    for (let k = 0; k < m.getDay(); k++) cells += '<span></span>';
    for (let dd = 1; dd <= days; dd++) {
      const ds = dateStr(new Date(m.getFullYear(), m.getMonth(), dd)), v = scores.get(ds);
      cells += `<div class="hday${ds === todayStr() ? ' today' : ''}${v != null ? ' has' : ''}"><i>${dd}</i><b>${v != null ? v : ''}</b></div>`;
    }
    html += `<div class="mpage"><h2>${m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }).toUpperCase()}</h2><div class="dow">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<span>${x}</span>`).join('')}</div><div class="days hdays">${cells}</div></div>`;
  }
  $('.histpager', el).innerHTML = html;
  gesture($('#t-history', el), { moveEl: false, onSwipeLeft: () => closeTop() });   // back to STACK
  openScreen(el);
  requestAnimationFrame(() => { const p = $('.histpager', el); p.scrollLeft = p.scrollWidth; });
}
function openGraph() {
  const scores = dayScores();
  const days = [...scores.keys()].sort().slice(-30), vals = days.map(d => scores.get(d));
  const W = 340, H = 220, pad = 28, max = Math.max(4, ...vals);
  const x = i => pad + (days.length < 2 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (days.length - 1));
  const y = v => H - pad - v * (H - 2 * pad) / max;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const svg = days.length ? `<svg viewBox="0 0 ${W} ${H}" class="graph" role="img" aria-label="MOMENTUM by day">
      <line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" class="axis"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H - pad}" class="axis"/>
      <text x="${pad - 6}" y="${pad + 4}" class="lbl" text-anchor="end">${max}</text><text x="${pad - 6}" y="${H - pad + 4}" class="lbl" text-anchor="end">0</text>
      <polyline points="${pts}" class="line"/>${vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" class="dot"/>`).join('')}
      <text x="${pad}" y="${H - 8}" class="lbl">${days[0].slice(5)}</text><text x="${W - pad}" y="${H - 8}" class="lbl" text-anchor="end">${days[days.length - 1].slice(5)}</text></svg>`
    : '<p class="empty">No days yet.</p>';
  const el = screenEl('graphscreen slidein', `<div class="graphwrap">${svg}</div><header class="title" id="t-graph"><h1>GRAPH</h1></header>`);
  gesture($('#t-graph', el), { moveEl: false, onSwipeRight: () => closeTop() });   // back to STACK
  openScreen(el);
}

/* ---------- boot ---------- */
/* Bottom labels. Left of STACK (RECOVERY … SCHEDULE): swipe right goes one further out, swipe left snaps straight
   back to STACK. Right of STACK (FOCUS, SUPPORT): step through one screen at a time. */
function navTitle(id, right, left) {
  gesture($(id), { moveEl: false, onSwipeRight: right ? () => right() : null, onSwipeLeft: left ? () => left() : null });
}
const go = name => () => goPanel(name);
/* A highlighted backlog block + its title swiped left: that block's FOCUS screen. */
function focusTitle(panelKey) {
  const k = armedKey(panelKey); if (!k) return false;
  disarm();
  if (panelKey === 'project') openEditor(state.items[k], false, true); else openFocus(k);
  return true;
}
async function boot() {
  const t0 = Date.now();
  history.replaceState({ d: 0 }, '');
  try { await loadState(); }
  catch (e) { state = freshState(); toast('Storage is unavailable. Changes will not be kept.'); }

  // RECOVERY · SETTINGS · PROJECT · LIST · TASK · SCHEDULE · STACK · FOCUS · SUPPORT
  navTitle('#t-recovery', null, go('stack'));
  navTitle('#t-settings', go('recovery'), go('stack'));
  // Backlogs: highlighted → FOCUS title right = schedule, left = memory; otherwise the usual screen moves.
  navTitle('#t-project', () => { if (!focusSchedule('project')) goPanel('settings'); }, () => { if (!focusTitle('project')) goPanel('stack'); });
  navTitle('#t-list', () => { if (!focusSchedule('list')) goPanel('project'); }, () => { if (!focusTitle('list')) goPanel('stack'); });
  navTitle('#t-task', () => { if (!focusSchedule('task')) goPanel('list'); }, () => { if (!focusTitle('task')) goPanel('stack'); });
  navTitle('#t-schedule', go('task'), go('stack'));
  // STACK: → SCHEDULE (highlighted: place it at a time today) · ← FOCUS (highlighted: that block; else the active one)
  navTitle('#t-stack', () => { const k = armedKey('stack'); if (k) { disarm(); openPlacement(k); } else goPanel('schedule'); },
                       () => { const k = armedKey('stack'); disarm(); if (k) openFocus(k); else if (state.stack.length) openFocus(state.stack[0]); else toast('STACK is empty'); });
  navTitle('#t-focus', go('stack'), () => { if (focusBid && state.blocks[focusBid]) openSupport(focusBid); });
  navTitle('#t-support', () => { if (focusBid && state.blocks[focusBid]) openFocus(focusBid); else goPanel('stack'); }, null);
  // MOMENTUM bar: → HISTORY · ← GRAPH
  gesture($('#scores'), { moveEl: false, onSwipeRight: openHistory, onSwipeLeft: openGraph });
  $('#b-dnc').addEventListener('click', divideAndConquer);
  $('#b-refresh').addEventListener('click', () => refreshSchedule(true));
  $('#calbar').addEventListener('click', () => importTodayCalendar(true));
  setInterval(() => { if (panel === 'schedule' && !document.hidden) refreshSchedule(false); }, 5 * 60000);

  const inp = $('#main-input'), sug = $('#suggest'), ps = $('#p-stack');
  inp.addEventListener('focus', () => { ps.classList.add('searching'); showSuggest(); });
  inp.addEventListener('input', showSuggest);
  inp.addEventListener('blur', () => setTimeout(() => { hideSuggest(); ps.classList.remove('searching'); }, 180));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitInput(); } });
  sug.addEventListener('mousedown', e => e.preventDefault());
  sug.addEventListener('click', e => {
    const r = e.target.closest('.sug'); if (!r) return;
    if (r.dataset.new) { const v = inp.value.trim(); inp.blur(); hideSuggest(); openComposer(v); }
    else { const it = state.items[r.dataset.id]; inp.value = ''; inp.blur(); hideSuggest(); if (it) openEditor(it, false); }
  });

  const arrived = runDueCheck();
  renderAll();
  flashArrivals(arrived);
  goPanel('stack', true);

  // Glasses sync
  syncDevice = 'phone';
  syncRev = state.settings.syncRev || 0;
  syncCfg = state.settings.syncDb && state.settings.syncKey ? { db: state.settings.syncDb, key: state.settings.syncKey } : null;
  onSyncAdopt = () => { renderAll(); screens.forEach(sc => sc._refresh && sc._refresh()); processCalQueue(false); };
  syncStart();
  processCalQueue(false);

  setInterval(() => {
    checkDue(); if (state.calImportDate !== todayStr()) importTodayCalendar(false);
    const moved = dueTimed(); if (moved.length) { save(); renderAll(); toast(`It’s time: ${blockName(moved[0])}`); }
  }, 15000);
  importTodayCalendar(false);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) flush();
    else { checkDue(); importTodayCalendar(false); if (syncConfigured()) syncFetch().then(syncReceive).catch(() => {}); }
  });
  window.addEventListener('pagehide', flush);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    // Check for a new version on every open; reload once when it takes over.
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true; flush(); setTimeout(() => location.reload(), 150);
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }

  const sp = $('#splash');
  setTimeout(() => { sp.classList.add('gone'); setTimeout(() => sp.remove(), 500); }, Math.max(0, 1200 - (Date.now() - t0)));
}
