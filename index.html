<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Paradigm</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app">
  <div id="track">
    <section class="panel" id="p-backlog">
      <header class="title" id="t-backlog"><h1>BACKLOG</h1></header>
      <div class="list" id="backlog-list"></div>
      <p class="empty" id="backlog-empty">Nothing in the backlog.</p>
      <footer class="panel-foot"><button class="btn primary wide hidden" id="btn-add">ADD</button></footer>
    </section>

    <section class="panel" id="p-stack">
      <button id="runbar" class="hidden"></button>
      <header class="title" id="t-stack"><h1>STACK</h1></header>
      <div id="place-zone"></div>
      <div class="list stack" id="stack-list"></div>
      <p class="empty" id="stack-empty">Type below to add something.</p>
      <div id="suggest" class="hidden"></div>
      <footer class="inputbar">
        <input id="main-input" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="go" placeholder="Search or add">
      </footer>
    </section>

    <section class="panel" id="p-settings">
      <header class="title" id="t-settings"><h1>SETTINGS</h1></header>
      <div class="settings" id="settings-body"></div>
    </section>
  </div>
  <div id="overlays"></div>
  <div id="toast" class="hidden"></div>
  <div id="ghost-layer"></div>
</div>
<script src="js/store.js"></script>
<script src="js/gestures.js"></script>
<script src="js/google.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
