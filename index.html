<body>
<div id="app">
  <div id="track">
    <section class="panel" id="p-backlog">
      <header class="title" id="t-backlog"><h1>BACKLOG</h1></header>
      <div class="list" id="backlog-list"></div>
      <p class="empty" id="backlog-empty">Nothing in the backlog.</p>
      <footer class="panel-foot"><button class="btn primary wide hidden" id="btn-add">ADD</button></footer>
    </section>

    <section class="panel" id="p-stack">
      <button id="runbar" class="hidden"></button>
      <header class="title" id="t-stack"><h1>STACK</h1></header>
      <div id="place-zone"></div>
      <div class="list stack" id="stack-list"></div>
      <p class="empty" id="stack-empty">Type below to add something.</p>
      <div id="suggest" class="hidden"></div>
      <footer class="inputbar">
        <input id="main-input" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="go" placeholder="Search or add">
      </footer>
    </section>

    <section class="panel" id="p-settings">
      <header class="title" id="t-settings"><h1>SETTINGS</h1></header>
      <div class="settings" id="settings-body"></div>
    </section>
  </div>
  <div id="overlays"></div>
  <div id="toast" class="hidden"></div>
  <div id="ghost-layer"></div>
</div>
<script>

window.__errs=[];
function __showErr(msg){try{var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;background:#300;color:#fbb;font:13px monospace;padding:8px 10px;white-space:pre-wrap;max-height:40%;overflow:auto';document.body.appendChild(b);}b.textContent+= (b.textContent?'\n':'')+'Error: '+msg;}catch(e){}}
window.addEventListener('error',function(e){__showErr((e.message||'unknown')+(e.filename?' @'+e.filename.split('/').pop()+':'+e.lineno:''));});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;__showErr('promise: '+(r&&r.message||r));});
/* Paradigm: state, persistence and model rules */
'use strict';

const MIN = 60000, HALF = 30 * MIN, DAY = 24 * 60 * MIN;
let state = null;
let idb = null;

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
function dateStr(d) { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const todayStr = () => dateStr(Date.now());
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function floor30(ms) { const d = new Date(ms); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() < 30 ? 0 : 30); return d.getTime(); }
function ceilHalf(ms) { return Math.max(1, Math.ceil(ms / HALF)) * HALF; }
function minToClock(min) { const h = Math.floor(min / 60) % 24, m = min % 60; const ap = h < 12 ? 'AM' : 'PM'; const h12 = h % 12 || 12; return `${h12}:${pad(m)} ${ap}`; }
function msToClock(ms) { const d = new Date(ms); return minToClock(d.getHours() * 60 + d.getMinutes()); }
function fmtDur(ms) { ms = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(ms / 3600), m = Math.floor(ms % 3600 / 60), s = ms % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }
function fmtShort(ms) { const m = Math.round(ms / MIN); return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? pad(m % 60) : ''}` : `${m}m`; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- persistence (IndexedDB) ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('paradigm', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbGet(k) {
  return new Promise((res, rej) => {
    const q = idb.transaction('kv').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
function idbSet(k, v) {
  return new Promise((res, rej) => {
    const t = idb.transaction('kv', 'readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

function freshState() {
  return {
    v: 1, items: {}, blocks: {}, stack: [], backlog: [], placing: [], running: null,
    lastDueCheck: todayStr(),
    settings: { clientId: '', connected: false, paradigmCalId: '', driveFileId: '', lastBackup: 0 },
    auth: { token: '', exp: 0 }
  };
}
function normalize(s) {
  const f = freshState();
  for (const k of Object.keys(f)) if (s[k] === undefined) s[k] = f[k];
  s.settings = Object.assign(f.settings, s.settings || {});
  s.auth = Object.assign(f.auth, s.auth || {});
  return s;
}

let saveTimer = null;
function save(opts) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 200);
  if (!(opts && opts.noBackup) && typeof scheduleBackup === 'function') scheduleBackup();
}
function flush() { clearTimeout(saveTimer); if (idb && state) return idbSet('state', state).catch(e => console.error(e)); }

async function loadState() {
  idb = await idbOpen();
  const s = await idbGet('state');
  state = normalize(s || freshState());
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  repair();
}

/* Keep lists consistent: drop dead blocks, rescue orphans into the backlog. */
function repair() {
  const seen = new Set();
  const clean = arr => arr.filter(b => {
    const ok = state.blocks[b] && state.items[state.blocks[b].itemId] && !seen.has(b);
    if (ok) seen.add(b); return ok;
  });
  if (state.running && !(state.blocks[state.running.bid] && state.items[state.blocks[state.running.bid].itemId])) state.running = null;
  if (state.running) seen.add(state.running.bid);
  state.stack = clean(state.stack); state.backlog = clean(state.backlog); state.placing = clean(state.placing);
  for (const [bid, b] of Object.entries(state.blocks)) {
    const it = state.items[b.itemId];
    if (!it || (b.subId && !(it.subtasks || []).some(s => s.id === b.subId))) { delete state.blocks[bid]; continue; }
    if (!seen.has(bid)) state.backlog.push(bid);
  }
}

/* ---------- model queries ---------- */
const TYPES = { task: 'TASK', list: 'LIST', event: 'EVENT', project: 'PROJECT' };
function itemByName(name) {
  const n = name.trim().toLowerCase();
  return Object.values(state.items).find(i => i.name.trim().toLowerCase() === n) || null;
}
function findBlock(itemId, subId) {
  return Object.keys(state.blocks).find(b => state.blocks[b].itemId === itemId && (state.blocks[b].subId || null) === (subId || null)) || null;
}
function whereBlock(bid) {
  if (state.running && state.running.bid === bid) return 'running';
  if (state.stack.includes(bid)) return 'stack';
  if (state.backlog.includes(bid)) return 'backlog';
  if (state.placing.includes(bid)) return 'placing';
  return null;
}
function detach(bid) {
  state.stack = state.stack.filter(b => b !== bid);
  state.backlog = state.backlog.filter(b => b !== bid);
  state.placing = state.placing.filter(b => b !== bid);
}
function removeBlock(bid) {
  detach(bid);
  if (state.running && state.running.bid === bid) state.running = null;
  delete state.blocks[bid];
}
function blockLabel(bid) {
  const b = state.blocks[bid], it = state.items[b.itemId];
  if (b.subId) { const s = it.subtasks.find(x => x.id === b.subId); return { proj: it.name, name: s ? s.name : '?' }; }
  return { proj: null, name: it.name };
}
function blockName(bid) { const l = blockLabel(bid); return l.proj ? `${l.proj} › ${l.name}` : l.name; }

function newItem(type, name) {
  const it = { id: uid(), type, name: name.trim(), created: Date.now() };
  if (type === 'task') Object.assign(it, { notes: '', recurring: false, schedule: { freq: 'none' } });
  if (type === 'list') Object.assign(it, { subtasks: [], recurring: false, recSubtasks: false, schedule: { freq: 'none' } });
  if (type === 'project') Object.assign(it, { subtasks: [] });
  if (type === 'event') Object.assign(it, { event: null });
  return it;
}
function deleteItem(id) {
  for (const bid of Object.keys(state.blocks)) if (state.blocks[bid].itemId === id) removeBlock(bid);
  delete state.items[id];
}

/* Queue an item (or project subtask) for the placement step. Returns a message or null. */
function queueForStack(itemId, subId) {
  let bid = findBlock(itemId, subId);
  const w = bid && whereBlock(bid);
  if (w === 'stack') return 'Already on STACK';
  if (w === 'running') return 'Already running';
  if (w === 'placing') return null;
  if (w === 'backlog') detach(bid);
  if (!bid) { bid = uid(); state.blocks[bid] = { bid, itemId, subId: subId || null, elapsed: 0 }; }
  state.placing.push(bid);
  return null;
}

/* ---------- schedules ---------- */
function defaultSchedule(freq) {
  const d = new Date();
  return { freq, days: [d.getDay()], dom: d.getDate(), month: d.getMonth() };
}
function matchesSchedule(sch, d) {
  if (!sch || sch.freq === 'none') return false;
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  switch (sch.freq) {
    case 'daily': return true;
    case 'weekly': return (sch.days || []).includes(d.getDay());
    case 'monthly': return d.getDate() === Math.min(sch.dom || 1, dim);
    case 'annually': return d.getMonth() === sch.month && d.getDate() === Math.min(sch.dom || 1, dim);
  }
  return false;
}
/* Drops due recurring items onto the bottom of STACK. Returns ids that arrived. */
function runDueCheck() {
  const today = todayStr();
  if (state.lastDueCheck >= today) return [];
  const due = [];
  for (const it of Object.values(state.items)) {
    if (!it.recurring || !it.schedule || it.schedule.freq === 'none') continue;
    let d = addDays(state.lastDueCheck, 1), n = 0;
    while (d <= today && n++ < 400) { if (matchesSchedule(it.schedule, parseDate(d))) { due.push(it); break; } d = addDays(d, 1); }
  }
  state.lastDueCheck = today;
  due.sort((a, b) => b.created - a.created);
  const arrived = [];
  for (const it of due) {
    let bid = findBlock(it.id, null);
    const w = bid && whereBlock(bid);
    if (w === 'stack' || w === 'running' || w === 'placing') continue;
    if (w === 'backlog') detach(bid);
    if (!bid) { bid = uid(); state.blocks[bid] = { bid, itemId: it.id, subId: null, elapsed: 0 }; }
    state.stack.unshift(bid);
    arrived.push(bid);
  }
  if (due.length || arrived.length) save();
  return arrived;
}

/* ---------- timer ---------- */
function startBlock(bid, plannedEnd) {
  const now = Date.now();
  detach(bid);
  state.running = { bid, sessionStart: now, segStart: now, accum: 0, prior: state.blocks[bid].elapsed || 0, budget: Math.max(MIN, plannedEnd - now), vibrated: false };
  save();
}
function sessionWorked(r) { return r.accum + (r.segStart ? Date.now() - r.segStart : 0); }
function isPaused() { return state.running && !state.running.segStart; }
function pauseRunning() { const r = state.running; if (!r || !r.segStart) return; r.accum += Date.now() - r.segStart; r.segStart = null; save(); }
function resumeRunning() { const r = state.running; if (!r || r.segStart) return; r.segStart = Date.now(); save(); }

function saveRunning() {
  const r = state.running; if (!r) return;
  pauseRunning();
  state.blocks[r.bid].elapsed = r.prior + r.accum;
  state.backlog.unshift(r.bid);
  state.running = null;
  save();
}
/* Completes the running block; returns the summary used for the calendar entry. */
function completeRunning() {
  const r = state.running; if (!r) return null;
  pauseRunning();
  const total = r.prior + r.accum;
  const start = floor30(r.sessionStart);
  const end = start + ceilHalf(total);
  const b = state.blocks[r.bid], it = state.items[b.itemId];
  const res = { name: blockName(r.bid), total, start, end };
  if (b.subId) {
    const s = it.subtasks.find(x => x.id === b.subId); if (s) s.done = true;
  } else if (it.type === 'task') {
    if (!it.recurring) delete state.items[it.id];
  } else if (it.type === 'list') {
    if (!it.recurring) delete state.items[it.id];
    else if (it.recSubtasks) it.subtasks.forEach(s => { s.done = false; });
    else it.subtasks = [];
  }
  delete state.blocks[r.bid];
  state.running = null;
  save();
  return res;
}

/* Paradigm: touch gestures.
   hold ~300ms = pick up and drag; quick horizontal flick = swipe; vertical flick = scroll (or swipe up/down where enabled). */
'use strict';

const HOLD_MS = 300, SLOP = 10, SWIPE_DIST = 80;

function gesture(el, o) {
  let st = null;
  const hasH = () => !!(o.onSwipeLeft || o.onSwipeRight);
  const hasV = () => !!(o.onSwipeUp || o.onSwipeDown);
  const mover = () => o.moveEl === false ? null : (o.moveEl || el);

  el.addEventListener('touchstart', e => {
    if (e.touches.length > 1) { cancel(); return; }
    if (o.ignore && o.ignore(e.target)) { st = null; return; }
    const en = !o.enabled || o.enabled();
    const t = e.touches[0];
    st = { x: t.clientX, y: t.clientY, t: Date.now(), mode: null, dx: 0, dy: 0, tapOnly: !en };
    if (o.onHoldStart && en) {
      st.timer = setTimeout(() => {
        if (st && !st.mode) {
          st.mode = 'hold';
          if (navigator.vibrate) navigator.vibrate(12);
          o.onHoldStart(st.x, st.y);
        }
      }, HOLD_MS);
    }
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!st) return;
    const t = e.touches[0];
    const dx = t.clientX - st.x, dy = t.clientY - st.y;
    st.dx = dx; st.dy = dy; st.cx = t.clientX; st.cy = t.clientY;
    if (st.mode === 'hold') { if (e.cancelable) e.preventDefault(); o.onHoldMove && o.onHoldMove(t.clientX, t.clientY); return; }
    if (!st.mode) {
      if (Math.abs(dx) < SLOP && Math.abs(dy) < SLOP) return;
      clearTimeout(st.timer);
      if (st.tapOnly) st.mode = 'scroll';
      else if (Math.abs(dx) > Math.abs(dy) && hasH()) st.mode = 'h';
      else if (Math.abs(dy) >= Math.abs(dx) && hasV()) st.mode = 'v';
      else st.mode = 'scroll';
    }
    if (st.mode === 'h') {
      if (e.cancelable) e.preventDefault();
      const m = mover(); if (m) { m.style.transition = 'none'; m.style.transform = `translateX(${dx}px)`; }
    } else if (st.mode === 'v') {
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });

  function snapBack() {
    const m = mover(); if (!m) return;
    m.style.transition = 'transform .18s ease-out'; m.style.transform = '';
  }
  function fly(dir, cb) {
    const m = mover();
    if (!m || o.noFly) { if (m) { m.style.transition = ''; m.style.transform = ''; } cb(); return; }
    m.style.transition = 'transform .15s ease-in';
    m.style.transform = `translateX(${dir * window.innerWidth}px)`;
    setTimeout(() => { cb(); requestAnimationFrame(() => { if (m.isConnected) { m.style.transition = 'none'; m.style.transform = ''; } }); }, 150);
  }
  function cancel() {
    if (!st) return;
    clearTimeout(st.timer);
    if (st.mode === 'hold') o.onHoldEnd && o.onHoldEnd(true);
    if (st.mode === 'h') snapBack();
    st = null;
  }

  el.addEventListener('touchend', e => {
    if (!st) return;
    clearTimeout(st.timer);
    const s = st; st = null;
    if (s.mode === 'hold') { o.onHoldEnd && o.onHoldEnd(false); return; }
    if (s.mode === 'h') {
      const fast = Math.abs(s.dx) > 40 && Date.now() - s.t < 260;
      if (Math.abs(s.dx) > SWIPE_DIST || fast) {
        if (s.dx > 0 && o.onSwipeRight) return fly(1, o.onSwipeRight);
        if (s.dx < 0 && o.onSwipeLeft) return fly(-1, o.onSwipeLeft);
      }
      snapBack(); return;
    }
    if (s.mode === 'v') {
      if (s.dy < -60 && o.onSwipeUp) o.onSwipeUp();
      else if (s.dy > 60 && o.onSwipeDown) o.onSwipeDown();
      return;
    }
    if (!s.mode && Date.now() - s.t < 450 && o.onTap) { o.onTap(e); }
  });
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());

  // Mouse fallback for desktop testing: click = tap.
  if (o.onTap) el.addEventListener('click', e => { if (!('ontouchstart' in window)) o.onTap(e); });
}

/* ---------- drag-to-sort ----------
   listEl: container of .block children. reverse: true when the list is column-reverse (index 0 at the bottom).
   srcEl: the element being dragged (already in listEl), or a detached element when placing a new block. */
let dragCtx = null;
function beginDrag({ listEl, srcEl, x, y, reverse, external }) {
  const r = srcEl.getBoundingClientRect();
  const ghost = srcEl.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.classList.remove('ph');
  ghost.style.width = r.width + 'px';
  ghost.style.left = r.left + 'px';
  const offY = y - r.top;
  ghost.style.top = (y - offY) + 'px';
  document.getElementById('ghost-layer').appendChild(ghost);

  let ph = srcEl;
  if (external) { ph = document.createElement('div'); ph.className = 'block ph'; ph.innerHTML = srcEl.innerHTML; listEl.appendChild(ph); }
  ph.classList.add('ph');

  let scrollTimer = null, lastY = y;
  function place(cy) {
    const sibs = [...listEl.children].filter(c => c !== ph && c.classList.contains('block'));
    let idx = 0;
    for (const s of sibs) {
      const b = s.getBoundingClientRect(), mid = b.top + b.height / 2;
      if (reverse ? mid > cy : mid < cy) idx++;
    }
    const ref = sibs[idx] || null;
    if (ref) { if (ph.nextSibling !== ref) listEl.insertBefore(ph, ref); }
    else if (listEl.lastElementChild !== ph) listEl.appendChild(ph);
  }
  function autoscroll() {
    const lr = listEl.getBoundingClientRect();
    let v = 0;
    if (lastY < lr.top + 50) v = -12; else if (lastY > lr.bottom - 50) v = 12;
    if (v) { listEl.scrollTop += v; place(lastY); }
  }
  scrollTimer = setInterval(autoscroll, 30);
  place(y);

  dragCtx = {
    move(cx, cy) { lastY = cy; ghost.style.top = (cy - offY) + 'px'; place(cy); },
    end() {
      clearInterval(scrollTimer);
      ghost.remove();
      const idx = [...listEl.children].filter(c => c.classList.contains('block')).indexOf(ph);
      if (external) ph.remove(); else ph.classList.remove('ph');
      dragCtx = null;
      return idx;
    }
  };
  return dragCtx;
}

/* Wires a rendered list: each child .block with data-key gets swipe/hold/tap per opts.
   opts: { reverse, keys:[...] in data order, onReorder(newKeys), swipeRight(key), swipeLeft(key), tap(key), enabled() } */
function wireList(listEl, opts) {
  [...listEl.children].forEach(el => {
    if (!el.classList.contains('block')) return;
    const key = el.dataset.key;
    let drag = null;
    gesture(el, {
      enabled: opts.enabled,
      onSwipeRight: opts.swipeRight ? () => opts.swipeRight(key) : null,
      onSwipeLeft: opts.swipeLeft ? () => opts.swipeLeft(key) : null,
      onTap: opts.tap ? () => opts.tap(key) : null,
      onHoldStart: opts.onReorder ? (x, y) => { drag = beginDrag({ listEl, srcEl: el, x, y, reverse: opts.reverse }); } : null,
      onHoldMove: (x, y) => drag && drag.move(x, y),
      onHoldEnd: () => {
        if (!drag) return;
        drag.end(); drag = null;
        const keys = [...listEl.children].filter(c => c.classList.contains('block')).map(c => c.dataset.key);
        opts.onReorder(keys);
      }
    });
  });
}

/* Paradigm: Google Calendar + Drive (free tier, browser token flow). */
'use strict';

const SCOPES = 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/drive.appdata';
const CAL = 'https://www.googleapis.com/calendar/v3';
const BACKUP_NAME = 'paradigm-backup.json';
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

let tokenClient = null, tokenClientFor = '', tokenWaiters = [], tokenPending = false, backupDirty = false, backupTimer = null;

const gisReady = () => !!(window.google && google.accounts && google.accounts.oauth2);
function tokenValid() { return !!state.auth.token && Date.now() < state.auth.exp - MIN; }

function ensureTokenClient() {
  const id = (state.settings.clientId || '').trim();
  if (!id || !gisReady()) return null;
  if (tokenClient && tokenClientFor === id) return tokenClient;
  tokenClientFor = id;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: id, scope: SCOPES,
    callback: resp => {
      if (resp && resp.access_token) {
        state.auth.token = resp.access_token;
        state.auth.exp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
        state.settings.connected = true;
        save({ noBackup: true });
        settleTokens(resp.access_token);
        if (backupDirty) driveBackup();
      } else settleTokens(null);
    },
    error_callback: () => settleTokens(null)
  });
  return tokenClient;
}
function settleTokens(tok) { tokenPending = false; const w = tokenWaiters; tokenWaiters = []; w.forEach(f => f(tok)); if (typeof renderSettings === 'function') renderSettings(); }

/* Call FIRST inside a tap/swipe handler (before any await) so the sign-in popup is allowed. */
function getToken(interactive, forceConsent) {
  if (tokenValid() && !forceConsent) return Promise.resolve(state.auth.token);
  if (!interactive) return Promise.resolve(null);
  const tc = ensureTokenClient();
  if (!tc) return Promise.resolve(null);
  return new Promise(res => {
    tokenWaiters.push(res);
    if (tokenPending) return;
    tokenPending = true;
    try { tc.requestAccessToken({ prompt: forceConsent || !state.settings.connected ? 'consent' : '' }); }
    catch (e) { settleTokens(null); }
  });
}

async function gfetch(tok, method, url, body, headers) {
  const h = Object.assign({ Authorization: 'Bearer ' + tok }, headers || {});
  let payload = body;
  if (body !== undefined && body !== null && typeof body !== 'string') { payload = JSON.stringify(body); h['Content-Type'] = 'application/json'; }
  const r = await fetch(url, { method, headers: h, body: payload });
  if (r.status === 401) { state.auth.token = ''; state.auth.exp = 0; throw Object.assign(new Error('auth'), { status: 401 }); }
  if (!r.ok) throw Object.assign(new Error('http ' + r.status), { status: r.status });
  if (r.status === 204) return null;
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

/* ---------- Calendar ---------- */
async function paradigmCalId(tok) {
  if (state.settings.paradigmCalId) return state.settings.paradigmCalId;
  const list = await gfetch(tok, 'GET', `${CAL}/users/me/calendarList?maxResults=250`);
  let cal = (list.items || []).find(c => c.summary === 'Paradigm');
  if (!cal) cal = await gfetch(tok, 'POST', `${CAL}/calendars`, { summary: 'Paradigm', timeZone: TZ });
  state.settings.paradigmCalId = cal.id; save({ noBackup: true });
  return cal.id;
}
function eventTimes(ev) {
  if (ev.allDay) return { start: { date: ev.date }, end: { date: addDays(ev.date, 1) } };
  const base = parseDate(ev.date).getTime();
  return {
    start: { dateTime: new Date(base + ev.startMin * MIN).toISOString(), timeZone: TZ },
    end: { dateTime: new Date(base + ev.endMin * MIN).toISOString(), timeZone: TZ }
  };
}
async function calInsertEvent(tok, name, ev) {
  const r = await gfetch(tok, 'POST', `${CAL}/calendars/primary/events`, Object.assign({ summary: name }, eventTimes(ev)));
  return r.id;
}
async function calUpdateEvent(tok, id, name, ev) {
  await gfetch(tok, 'PATCH', `${CAL}/calendars/primary/events/${encodeURIComponent(id)}`, Object.assign({ summary: name }, eventTimes(ev)));
}
async function calDeleteEvent(tok, id) {
  try { await gfetch(tok, 'DELETE', `${CAL}/calendars/primary/events/${encodeURIComponent(id)}`); }
  catch (e) { if (e.status !== 404 && e.status !== 410) throw e; }
}
async function calLogCompletion(tok, res) {
  const body = {
    summary: res.name,
    description: `Worked ${fmtDur(res.total)} in Paradigm`,
    start: { dateTime: new Date(res.start).toISOString(), timeZone: TZ },
    end: { dateTime: new Date(res.end).toISOString(), timeZone: TZ }
  };
  let id = await paradigmCalId(tok);
  try { await gfetch(tok, 'POST', `${CAL}/calendars/${encodeURIComponent(id)}/events`, body); }
  catch (e) {
    if (e.status !== 404) throw e;
    state.settings.paradigmCalId = '';
    id = await paradigmCalId(tok);
    await gfetch(tok, 'POST', `${CAL}/calendars/${encodeURIComponent(id)}/events`, body);
  }
}
/* Existing events for a day, for the dimmed background in day views. Never prompts. */
async function calDayEvents(date) {
  const tok = await getToken(false);
  if (!tok) return null;
  const t0 = parseDate(date).getTime();
  const q = `timeMin=${encodeURIComponent(new Date(t0).toISOString())}&timeMax=${encodeURIComponent(new Date(t0 + DAY).toISOString())}&singleEvents=true&orderBy=startTime&maxResults=100`;
  const cals = ['primary'];
  if (state.settings.paradigmCalId) cals.push(state.settings.paradigmCalId);
  const out = [];
  for (const c of cals) {
    try {
      const r = await gfetch(tok, 'GET', `${CAL}/calendars/${encodeURIComponent(c)}/events?${q}`);
      (r.items || []).forEach(e => out.push(e));
    } catch (e) { /* show what we can */ }
  }
  return out;
}

/* One-tap fallback when Google access has lapsed. */
function calLink(name, ev, details) {
  const f = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  let dates;
  if (ev.allDay) dates = `${ev.date.replace(/-/g, '')}/${addDays(ev.date, 1).replace(/-/g, '')}`;
  else if (ev.startMs) dates = `${f(ev.startMs)}/${f(ev.endMs)}`;
  else { const b = parseDate(ev.date).getTime(); dates = `${f(b + ev.startMin * MIN)}/${f(b + ev.endMin * MIN)}`; }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(name)}&dates=${dates}${details ? '&details=' + encodeURIComponent(details) : ''}`;
}

/* ---------- Drive backup (hidden app folder) ---------- */
function exportable() {
  const s = clone(state);
  delete s.auth;
  s.settings = { clientId: state.settings.clientId };
  s.exportedAt = Date.now();
  return s;
}
function scheduleBackup() {
  if (!state.settings.connected) return;
  backupDirty = true;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(driveBackup, 4000);
}
async function driveFileId(tok) {
  if (state.settings.driveFileId) return state.settings.driveFileId;
  const q = encodeURIComponent(`name='${BACKUP_NAME}'`);
  const r = await gfetch(tok, 'GET', `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`);
  const id = r.files && r.files[0] ? r.files[0].id : '';
  state.settings.driveFileId = id;
  return id;
}
async function driveBackup(interactiveTokPromise) {
  const tok = interactiveTokPromise ? await interactiveTokPromise : await getToken(false);
  if (!tok) { backupDirty = true; return false; }
  try {
    const data = JSON.stringify(exportable());
    let id = await driveFileId(tok);
    if (id) {
      try { await gfetch(tok, 'PATCH', `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, data, { 'Content-Type': 'application/json' }); }
      catch (e) { if (e.status === 404) id = ''; else throw e; }
    }
    if (!id) {
      const b = 'paradigm' + uid();
      const meta = JSON.stringify({ name: BACKUP_NAME, parents: ['appDataFolder'] });
      const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${b}--`;
      const r = await gfetch(tok, 'POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', body, { 'Content-Type': `multipart/related; boundary=${b}` });
      state.settings.driveFileId = r.id;
    }
    backupDirty = false;
    state.settings.lastBackup = Date.now();
    save({ noBackup: true });
    if (typeof renderSettings === 'function') renderSettings();
    return true;
  } catch (e) { console.warn('backup failed', e); backupDirty = true; return false; }
}
async function driveRestore(tokPromise) {
  const tok = await tokPromise;
  if (!tok) throw new Error('Not connected to Google');
  state.settings.driveFileId = '';
  const id = await driveFileId(tok);
  if (!id) throw new Error('No backup found in Drive');
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: 'Bearer ' + tok } });
  if (!r.ok) throw new Error('Download failed');
  return r.json();
}

/* Paradigm: overlay screens */
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const screens = [];
let afterPop = null;

/* ---------- screen stack (Android back closes the top screen) ---------- */
function screenEl(cls, html) { const el = document.createElement('div'); el.className = 'screen ' + cls; el.innerHTML = html; return el; }
function openScreen(el) { $('#overlays').appendChild(el); screens.push(el); history.pushState({ d: screens.length }, ''); hideSuggest(); hideToast(); }
function closeN(n, then) {
  n = Math.min(n, screens.length);
  if (!n) { if (then) then(); return; }
  afterPop = then || null;
  history.go(-n);
}
const closeTop = then => closeN(1, then);
const closeAll = then => closeN(screens.length, then);
window.addEventListener('popstate', e => {
  const d = (e.state && e.state.d) || 0;
  while (screens.length > d) { const el = screens.pop(); el.remove(); if (el._onClose) el._onClose(); }
  const f = afterPop; afterPop = null;
  renderAll();
  if (f) f();
});
function backBtn(el) { el.querySelector('.back').addEventListener('click', () => closeTop()); }

/* ---------- toast, undo, confirm ---------- */
let toastTimer = null;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) {
    const a = document.createElement(action.href ? 'a' : 'button');
    a.className = 'btn act'; a.textContent = action.label;
    if (action.href) { a.href = action.href; a.target = '_blank'; a.rel = 'noopener'; }
    a.addEventListener('click', () => { hideToast(); if (action.fn) action.fn(); });
    t.appendChild(a);
  }
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action && action.href ? 12000 : 5000);
}
function hideToast() { $('#toast').classList.add('hidden'); }
function withUndo(msg, mutate) {
  const snap = JSON.stringify(state);
  mutate(); save(); renderAll();
  toast(msg, { label: 'UNDO', fn: () => {
    const auth = state.auth, settings = state.settings;
    state = JSON.parse(snap); state.auth = auth; state.settings = settings;
    save(); renderAll();
  } });
}
function confirmBox(msg, okLabel, onOk) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box"><div class="msg">${esc(msg)}</div><div class="btnrow"><button class="btn quiet c">CANCEL</button><button class="btn primary o">${esc(okLabel)}</button></div></div>`;
  $('.c', m).onclick = () => m.remove();
  $('.o', m).onclick = () => { m.remove(); onOk(); };
  document.body.appendChild(m);
}
function calFallbackToast(msg, name, ev, details) {
  toast(msg, { label: 'ADD TO CALENDAR', href: calLink(name, ev, details) });
}

/* ---------- chooser ---------- */
function openChooser(name) {
  const el = screenEl('chooser-screen', `
    <div class="bar"><button class="back" aria-label="Back">‹</button></div>
    <div class="chooser">
      <div class="q"></div>
      <button class="btn" data-t="task">TASK</button>
      <button class="btn" data-t="list">LIST</button>
      <button class="btn" data-t="event">EVENT</button>
      <button class="btn" data-t="project">PROJECT</button>
    </div>`);
  $('.q', el).textContent = name;
  backBtn(el);
  el.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => chooseType(b.dataset.t, name)));
  openScreen(el);
}
function chooseType(t, name) {
  if (t === 'task') {
    const it = newItem('task', name);
    state.items[it.id] = it;
    queueForStack(it.id, null);
    save(); clearMainInput();
    closeAll(() => goPanel('stack'));
  } else if (t === 'event') {
    openMonth({ title: name, onPick: date => openDay({ mode: 'event', date, name, sel: null, onSave: ev => {
      const tp = getToken(true);
      const it = newItem('event', name);
      it.event = ev;
      state.items[it.id] = it;
      save(); clearMainInput();
      closeAll(() => { goPanel('stack'); toast('Event saved'); setTimeout(() => sync()); });
      const sync = () => tp.then(async tok => {
        if (!tok) return calFallbackToast('Google is not connected.', it.name, ev);
        try { it.event.gcalId = await calInsertEvent(tok, it.name, it.event); save(); toast('Added to Google Calendar'); }
        catch (e) { calFallbackToast('Could not reach Google Calendar.', it.name, ev); }
      });
    } }) });
  } else {
    openEditor(newItem(t, name), true);
  }
}

/* ---------- editors ---------- */
function eventWhen(ev) {
  if (!ev) return 'No time set';
  const d = parseDate(ev.date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  return ev.allDay ? `${d}, all day` : `${d}, ${minToClock(ev.startMin)} to ${minToClock(ev.endMin)}`;
}

function openEditor(item, isNew) {
  const orig = clone(item);
  const d = clone(item);
  let selMode = false, selected = [];
  const el = screenEl('editor', `
    <div class="bar"><button class="back" aria-label="Back">‹</button><span class="label">${TYPES[d.type]}</span></div>
    <div class="body"><input class="namein" type="text" autocomplete="off"><div class="content"></div></div>
    <div class="foot"></div>`);
  backBtn(el);
  const nameIn = $('.namein', el);
  nameIn.value = d.name;
  nameIn.addEventListener('input', () => { d.name = nameIn.value; });
  const content = $('.content', el), foot = $('.foot', el);
  let subsList = null;

  function render() {
    content.innerHTML = '';
    if (d.type === 'task') {
      const s = document.createElement('div'); s.className = 'sect';
      s.innerHTML = '<h3>Notes</h3><textarea class="notes" placeholder="Anything to remember"></textarea>';
      const ta = $('textarea', s); ta.value = d.notes || ''; ta.addEventListener('input', () => { d.notes = ta.value; });
      content.appendChild(s);
      const r = document.createElement('div'); r.className = 'sect'; content.appendChild(r); recurringUI(d, r);
    }
    if (d.type === 'list') {
      const r = document.createElement('div'); r.className = 'sect'; content.appendChild(r); recurringUI(d, r);
    }
    if (d.type === 'list' || d.type === 'project') {
      const s = document.createElement('div'); s.className = 'sect editor-list';
      s.innerHTML = `<h3>${selMode ? 'Tap subtasks to add to STACK' : 'Subtasks'}</h3><div class="list rev"></div>${selMode ? '' : '<input class="subin" type="text" placeholder="Add a subtask" enterkeyhint="done" autocomplete="off">'}`;
      content.appendChild(s);
      subsList = $('.list', s);
      const si = $('.subin', s);
      if (si) si.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const v = si.value.trim(); if (!v) return;
        d.subtasks.push({ id: uid(), name: v, done: false });
        si.value = ''; renderSubs();
      });
      renderSubs();
    }
    if (d.type === 'event') {
      const s = document.createElement('div'); s.className = 'sect';
      s.innerHTML = `<h3>When</h3><p class="status"></p><button class="btn wide">CHANGE TIME</button>`;
      $('.status', s).textContent = eventWhen(d.event);
      $('button', s).addEventListener('click', changeTime);
      content.appendChild(s);
    }
    renderFoot();
  }

  function renderSubs() {
    if (!subsList) return;
    subsList.innerHTML = '';
    d.subtasks.forEach(s => {
      const b = document.createElement('div');
      b.className = 'block small' + (s.done ? ' done' : '') + (selMode && selected.includes(s.id) ? ' sel' : '');
      b.dataset.key = s.id;
      let extra = '';
      if (d.type === 'project') {
        const bid = findBlock(d.id, s.id), w = bid && whereBlock(bid);
        if (w) extra = `<span class="onstack">${w === 'backlog' ? 'BACKLOG' : w === 'running' ? 'RUNNING' : 'STACK'}</span>`;
      }
      b.innerHTML = `<span class="name">${esc(s.name)}</span>${extra}`;
      subsList.appendChild(b);
    });
    wireList(subsList, {
      reverse: true,
      onReorder: selMode ? null : keys => { d.subtasks = keys.map(k => d.subtasks.find(s => s.id === k)); renderSubs(); },
      swipeLeft: selMode ? null : k => { d.subtasks = d.subtasks.filter(s => s.id !== k); renderSubs(); },
      tap: k => {
        const s = d.subtasks.find(x => x.id === k); if (!s) return;
        if (selMode) {
          if (s.done) return;
          selected = selected.includes(k) ? selected.filter(x => x !== k) : selected.concat(k);
          renderSubs(); renderFoot();
        } else { s.done = !s.done; renderSubs(); }
      }
    });
  }

  function renderFoot() {
    foot.innerHTML = '';
    const row = document.createElement('div'); row.className = 'btnrow';
    const mk = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label; b.addEventListener('click', fn); return b; };
    if (selMode) {
      row.append(mk('CANCEL', 'quiet', () => { selMode = false; selected = []; render(); }));
      const add = mk(selected.length ? `ADD ${selected.length} TO STACK` : 'ADD TO STACK', 'primary', addProjectSubs);
      add.disabled = !selected.length;
      row.append(add); foot.append(row); return;
    }
    if (!isNew) row.append(mk('DELETE', 'danger', del));
    row.append(mk('SAVE', '', onSave));
    foot.append(row);
    if (d.type !== 'event') foot.append(mk('ADD TO STACK', 'primary wide', onAdd));
  }

  function validName() {
    const n = (d.name || '').trim();
    if (!n) { toast('Give it a name first'); return false; }
    const other = itemByName(n);
    if (other && other.id !== d.id) { toast('Another item already has that name'); return false; }
    d.name = n; return true;
  }
  function commit() {
    if (d.type === 'project') {
      const keep = new Set(d.subtasks.map(s => s.id));
      for (const bid of Object.keys(state.blocks)) { const b = state.blocks[bid]; if (b.itemId === d.id && b.subId && !keep.has(b.subId)) removeBlock(bid); }
    }
    state.items[d.id] = d;
    save();
  }
  function onSave() {
    if (!validName()) return;
    if (d.type === 'event') return saveEvent();
    commit(); clearMainInput();
    closeAll(() => { goPanel('stack'); toast('Saved'); });
  }
  function onAdd() {
    if (!validName()) return;
    if (d.type === 'project') {
      if (!d.subtasks.some(s => !s.done)) { toast('Add a subtask first'); return; }
      selMode = true; selected = []; render(); return;
    }
    commit(); clearMainInput();
    const msg = queueForStack(d.id, null); save();
    closeAll(() => { goPanel('stack'); if (msg) toast(msg); });
  }
  function addProjectSubs() {
    if (!validName()) return;
    commit(); clearMainInput();
    const msgs = selected.map(sid => queueForStack(d.id, sid)).filter(Boolean);
    save();
    closeAll(() => { goPanel('stack'); if (msgs.length) toast('Some subtasks were already on STACK'); });
  }
  function del() {
    const msg = d.type === 'project' ? `Delete project “${orig.name}” and remove its subtasks from STACK and BACKLOG?` : `Delete “${orig.name}”?`;
    confirmBox(msg, 'DELETE', () => {
      const gid = orig.type === 'event' && orig.event && orig.event.gcalId;
      const tp = gid ? getToken(true) : null;
      deleteItem(d.id); save(); clearMainInput();
      closeAll(() => { goPanel('stack'); toast('Deleted'); if (tp) setTimeout(() => sync()); });
      const sync = () => tp.then(async tok => {
        if (!tok) return toast('Google is not connected. Delete the event in Google Calendar too.');
        try { await calDeleteEvent(tok, gid); toast('Deleted from Google Calendar'); }
        catch (e) { toast('Could not reach Google Calendar. Delete the event there too.'); }
      });
    });
  }
  function changeTime() {
    openMonth({ title: d.name, picked: d.event && d.event.date, onPick: date => {
      const sel = d.event && d.event.date === date ? { allDay: d.event.allDay, startMin: d.event.startMin, endMin: d.event.endMin } : null;
      openDay({ mode: 'event', date, name: d.name, sel, onSave: ev => {
        d.event = Object.assign({}, ev, { gcalId: d.event && d.event.gcalId || '' });
        closeN(2, render);
      } });
    } });
  }
  function saveEvent() {
    if (!d.event) { toast('Pick a time first'); return; }
    const changed = JSON.stringify([orig.name, orig.event]) !== JSON.stringify([d.name, d.event]) || !d.event.gcalId;
    const tp = changed ? getToken(true) : null;
    commit(); clearMainInput();
    closeAll(() => { goPanel('stack'); toast('Saved'); if (tp) setTimeout(() => sync()); });
    const it = state.items[d.id];
    const sync = () => tp.then(async tok => {
      if (!tok) {
        if (it.event.gcalId) return toast('Google is not connected. Update the event in Google Calendar too.');
        return calFallbackToast('Google is not connected.', it.name, it.event);
      }
      try {
        if (it.event.gcalId) await calUpdateEvent(tok, it.event.gcalId, it.name, it.event);
        else { it.event.gcalId = await calInsertEvent(tok, it.name, it.event); save(); }
        toast('Google Calendar updated');
      } catch (e) {
        if (it.event.gcalId) toast('Could not reach Google Calendar. Update the event there too.');
        else calFallbackToast('Could not reach Google Calendar.', it.name, it.event);
      }
    });
  }

  render();
  openScreen(el);
}

/* ---------- recurring + schedule controls ---------- */
function checkBtn(label, on, fn) {
  const b = document.createElement('button');
  b.className = 'check' + (on ? ' on' : '');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = `<span class="box"></span><span>${esc(label)}</span>`;
  b.addEventListener('click', fn);
  return b;
}
function recurringUI(d, host) {
  host.innerHTML = '';
  const again = () => recurringUI(d, host);
  if (d.type === 'task') {
    host.append(checkBtn('Recurring', d.recurring, () => { d.recurring = !d.recurring; again(); }));
    if (d.recurring) host.append(scheduleUI(d));
  } else if (d.type === 'list') {
    host.append(checkBtn('Recurring list', d.recurring, () => { d.recurring = !d.recurring; if (!d.recurring) d.recSubtasks = false; again(); }));
    if (d.recurring) {
      host.append(checkBtn('Recurring subtasks', d.recSubtasks, () => { d.recSubtasks = !d.recSubtasks; again(); }));
      host.append(scheduleUI(d));
    }
  }
}
function scheduleUI(d) {
  const w = document.createElement('div'); w.className = 'sect';
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function render() {
    const s = d.schedule = Object.assign(defaultSchedule('none'), d.schedule || {});
    w.innerHTML = `<h3>Repeats</h3><div class="seg f">${['none', 'daily', 'weekly', 'monthly', 'annually'].map(f => `<button data-f="${f}" class="${s.freq === f ? 'on' : ''}">${f.toUpperCase()}</button>`).join('')}</div><div class="extra"></div>`;
    w.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { s.freq = b.dataset.f; render(); }));
    const x = $('.extra', w);
    if (s.freq === 'weekly') {
      x.innerHTML = `<div class="seg" style="margin-top:10px">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((l, i) => `<button data-d="${i}" aria-label="${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][i]}" class="${s.days.includes(i) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
      x.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.d;
        s.days = s.days.includes(i) ? s.days.filter(v => v !== i) : s.days.concat(i);
        if (!s.days.length) s.days = [i];
        render();
      }));
    } else if (s.freq === 'monthly') {
      x.innerHTML = `<label class="inline">Day of month <input type="number" min="1" max="31" inputmode="numeric" value="${s.dom}"></label>`;
      $('input', x).addEventListener('change', e => { s.dom = Math.min(31, Math.max(1, parseInt(e.target.value, 10) || 1)); e.target.value = s.dom; });
    } else if (s.freq === 'annually') {
      x.innerHTML = `<div class="inline"><select>${MONTHS.map((m, i) => `<option value="${i}" ${i === s.month ? 'selected' : ''}>${m}</option>`).join('')}</select><input type="number" min="1" max="31" inputmode="numeric" value="${s.dom}"></div>`;
      $('select', x).addEventListener('change', e => { s.month = +e.target.value; });
      $('input', x).addEventListener('change', e => { s.dom = Math.min(31, Math.max(1, parseInt(e.target.value, 10) || 1)); e.target.value = s.dom; });
    }
  }
  render();
  return w;
}

/* ---------- month calendar ---------- */
function openMonth({ title, picked, onPick }) {
  const el = screenEl('monthscreen', `<div class="bar"><button class="back" aria-label="Back">‹</button><span class="label"></span></div><div class="months"></div>`);
  $('.label', el).textContent = title;
  backBtn(el);
  const box = $('.months', el), now = new Date(), today = todayStr();
  let html = '';
  for (let i = -1; i <= 24; i++) {
    const m = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    let cells = '';
    for (let k = 0; k < m.getDay(); k++) cells += '<span></span>';
    for (let dd = 1; dd <= days; dd++) {
      const ds = dateStr(new Date(m.getFullYear(), m.getMonth(), dd));
      const cls = [ds < today ? 'past' : '', ds === today ? 'today' : '', ds === picked ? 'picked' : ''].join(' ');
      cells += `<button class="${cls}" data-date="${ds}">${dd}</button>`;
    }
    html += `<div class="month" ${i === 0 ? 'data-cur' : ''}><h2>${m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }).toUpperCase()}</h2><div class="dow">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div>`;
  }
  box.innerHTML = html;
  box.addEventListener('click', e => { const b = e.target.closest('[data-date]'); if (b) onPick(b.dataset.date); });
  openScreen(el);
  requestAnimationFrame(() => { const c = $('[data-cur]', box); if (c) box.scrollTop = c.getBoundingClientRect().top - box.getBoundingClientRect().top - 8; });
}

/* ---------- day view: event time picker and START time block ---------- */
const SLOT_H = 32;
function openDay({ mode, date, name, sel, onSave, onStart }) {
  const isStart = mode === 'start';
  const el = screenEl('dayscreen', `
    <div class="bar"><button class="back" aria-label="Back">‹</button><span class="label"></span></div>
    <div class="dayhead"><span class="d"></span>${isStart ? '' : '<button class="check allday" style="width:auto"><span class="box"></span><span>All day</span></button>'}</div>
    <div class="allday-strip"></div>
    <div class="dayscroll"><div class="grid" style="margin-top:12px;margin-bottom:24px"></div></div>
    <div class="foot"><div class="selinfo"></div><button class="btn primary wide go">${isStart ? 'START' : 'SAVE'}</button></div>`);
  $('.label', el).textContent = name;
  $('.d', el).textContent = parseDate(date).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  backBtn(el);
  const grid = $('.grid', el), scroller = $('.dayscroll', el), info = $('.selinfo', el), go = $('.go', el);
  let g = '';
  for (let i = 0; i < 48; i++) g += `<div class="slot ${i % 2 === 0 ? 'hr' : ''}"></div>`;
  for (let h = 0; h < 24; h++) g += `<span class="hlabel" style="top:${h * 2 * SLOT_H}px">${minToClock(h * 60).replace(':00', '')}</span>`;
  grid.innerHTML = g;
  const blk = document.createElement('div'); blk.className = 'selblk hidden'; grid.appendChild(blk);

  const nowD = new Date();
  const nowMin = nowD.getHours() * 60 + nowD.getMinutes() + nowD.getSeconds() / 60;
  if (date === todayStr()) { const nl = document.createElement('div'); nl.className = 'nowline'; nl.style.top = (nowMin / 30 * SLOT_H) + 'px'; grid.appendChild(nl); }

  let minEnd = 0;
  if (isStart) {
    const s = Math.floor(nowMin / 30) * 30;
    minEnd = Math.min(1440, Math.ceil((nowMin + 30) / 30) * 30);
    sel = { allDay: false, startMin: s, endMin: minEnd };
    const h = document.createElement('div'); h.className = 'handle'; h.setAttribute('aria-label', 'Drag to set end time'); blk.appendChild(h);
    const setEnd = y => { const r = grid.getBoundingClientRect(); sel.endMin = Math.max(minEnd, Math.min(1440, Math.round((y - r.top) / SLOT_H) * 30)); draw(); };
    h.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });
    h.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); const y = e.touches[0].clientY; edgeScroll(y); setEnd(y); }, { passive: false });
    gesture(grid, { moveEl: false, ignore: t => t.closest('.handle'), onTap: e => { const t = e.changedTouches ? e.changedTouches[0] : e; setEnd(t.clientY + SLOT_H / 2); } });
  } else {
    let anchor = 0;
    const slotAt = y => Math.max(0, Math.min(47, Math.floor((y - grid.getBoundingClientRect().top) / SLOT_H)));
    gesture(grid, {
      moveEl: false,
      enabled: () => !(sel && sel.allDay),
      onHoldStart: (x, y) => { anchor = slotAt(y); sel = { allDay: false, startMin: anchor * 30, endMin: anchor * 30 + 30 }; draw(); },
      onHoldMove: (x, y) => { edgeScroll(y); const s = slotAt(y), a = Math.min(anchor, s), b = Math.max(anchor, s); sel.startMin = a * 30; sel.endMin = (b + 1) * 30; draw(); },
      onHoldEnd: () => {},
      onTap: e => { const t = e.changedTouches ? e.changedTouches[0] : e; const s = slotAt(t.clientY); sel = { allDay: false, startMin: s * 30, endMin: s * 30 + 30 }; draw(); }
    });
    const ad = $('.allday', el);
    ad.addEventListener('click', () => {
      if (sel && sel.allDay) sel = null; else sel = { allDay: true, startMin: 0, endMin: 0 };
      draw();
    });
  }
  function edgeScroll(y) { const r = scroller.getBoundingClientRect(); if (y < r.top + 40) scroller.scrollTop -= 10; else if (y > r.bottom - 40) scroller.scrollTop += 10; }

  function draw() {
    const ad = $('.allday', el);
    if (ad) { ad.classList.toggle('on', !!(sel && sel.allDay)); }
    grid.classList.toggle('off', !!(sel && sel.allDay));
    if (!sel || sel.allDay) {
      blk.classList.add('hidden');
      info.textContent = sel && sel.allDay ? 'All day' : 'Hold and drag to pick a time';
      go.disabled = !sel; return;
    }
    blk.classList.remove('hidden');
    blk.style.top = (sel.startMin / 30 * SLOT_H) + 'px';
    blk.style.height = ((sel.endMin - sel.startMin) / 30 * SLOT_H) + 'px';
    const range = `${minToClock(sel.startMin)} to ${minToClock(sel.endMin % 1440)}`;
    if (blk.firstChild && blk.firstChild.nodeType === 3) blk.firstChild.textContent = range; else blk.insertBefore(document.createTextNode(range), blk.firstChild);
    if (isStart) {
      const mins = Math.max(1, Math.round(sel.endMin - (new Date().getHours() * 60 + new Date().getMinutes() + new Date().getSeconds() / 60)));
      info.textContent = `${range}, ${mins >= 60 ? Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm' : mins + ' min'}`;
    } else info.textContent = range;
    go.disabled = false;
  }

  go.addEventListener('click', () => {
    if (!sel) return;
    if (isStart) onStart(parseDate(date).getTime() + sel.endMin * MIN);
    else onSave({ date, allDay: !!sel.allDay, startMin: sel.startMin, endMin: sel.endMin });
  });

  draw();
  openScreen(el);
  requestAnimationFrame(() => {
    const focusMin = sel && !sel.allDay ? sel.startMin : (date === todayStr() ? nowMin : 8 * 60);
    scroller.scrollTop = Math.max(0, focusMin / 30 * SLOT_H - 3 * SLOT_H);
  });

  calDayEvents(date).then(evs => {
    if (!evs || !el.isConnected) return;
    const strip = $('.allday-strip', el), t0 = parseDate(date).getTime();
    evs.forEach(e => {
      if (e.start && e.start.date) { const s = document.createElement('span'); s.textContent = e.summary || '(busy)'; strip.appendChild(s); return; }
      if (!e.start || !e.start.dateTime) return;
      const a = Math.max(0, (new Date(e.start.dateTime) - t0) / MIN), b = Math.min(1440, (new Date(e.end.dateTime) - t0) / MIN);
      if (b <= a) return;
      const d = document.createElement('div'); d.className = 'ev';
      d.style.top = (a / 30 * SLOT_H) + 'px'; d.style.height = Math.max(14, (b - a) / 30 * SLOT_H) + 'px';
      d.textContent = e.summary || '(busy)';
      grid.insertBefore(d, blk);
    });
  });
}

/* ---------- START screen ---------- */
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4 L20 12 L6 20 Z"/></svg>';
let startTick = null;

function openStartPicker(bid) {
  if (state.running) { toast('Finish or save the running item first'); openStart(); return; }
  openDay({ mode: 'start', date: todayStr(), name: blockName(bid), onStart: endMs => {
    startBlock(bid, endMs);
    closeAll(() => openStart());
  } });
}

function openStart() {
  const r = state.running; if (!r) return;
  if (screens.some(s => s.classList.contains('start'))) return;
  const b = state.blocks[r.bid], it = state.items[b.itemId];
  const isList = !b.subId && it.type === 'list';
  const notes = !b.subId && it.type === 'task' && (it.notes || '').trim();
  const hasDrawer = isList || !!notes;
  const C = 2 * Math.PI * 135;
  const el = screenEl('start', `
    <div class="bar"><button class="back" aria-label="Back to STACK">‹</button></div>
    <div class="stage">
      <div class="ringwrap">
        <svg viewBox="0 0 300 300"><circle class="ring-track" cx="150" cy="150" r="135"/><circle class="ring" cx="150" cy="150" r="135" stroke-dasharray="${C} ${C}"/></svg>
        <button class="pp" aria-label="Pause"></button>
      </div>
      <div class="minirow hidden"><div class="linebar"><i></i></div><button class="pp small" aria-label="Pause"></button></div>
      <div class="tclock"></div>
      <div class="tname"></div>
      <div class="thint"></div>
      ${hasDrawer ? `<div class="swipe-up-hint">Swipe up for ${isList ? 'subtasks' : 'notes'}</div>` : ''}
    </div>
    <div class="drawer"><div class="grab"></div>${isList ? '<div class="list rev"></div>' : notes ? '<div class="notesview"></div>' : ''}</div>`);
  $('.tname', el).textContent = blockName(r.bid);
  if (notes) $('.notesview', el).textContent = it.notes;
  backBtn(el);
  const ring = $('.ring', el), clock = $('.tclock', el), hint = $('.thint', el), bar = $('.linebar', el), barFill = $('.linebar i', el);
  const pps = el.querySelectorAll('.pp');
  pps.forEach(p => p.addEventListener('click', () => { if (isPaused()) resumeRunning(); else pauseRunning(); update(); }));

  function setOpen(open) {
    if (!hasDrawer) return;
    el.classList.toggle('open', open);
    if (isList) { $('.ringwrap', el).classList.toggle('hidden', open); $('.minirow', el).classList.toggle('hidden', !open); }
    const h = $('.swipe-up-hint', el); if (h) h.classList.toggle('hidden', open);
  }
  function renderSubs() {
    const list = $('.list', el); if (!list) return;
    const item = state.items[b.itemId]; if (!item) return;
    list.innerHTML = '';
    item.subtasks.forEach(s => {
      const d = document.createElement('div');
      d.className = 'block small' + (s.done ? ' done' : ''); d.dataset.key = s.id;
      d.innerHTML = `<span class="name">${esc(s.name)}</span>`;
      list.appendChild(d);
    });
    wireList(list, { reverse: true, tap: k => {
      const s = item.subtasks.find(x => x.id === k); if (!s) return;
      s.done = !s.done; save(); renderSubs();
      if (item.subtasks.length && item.subtasks.every(x => x.done) && state.running) {
        pauseRunning();
        hint.textContent = 'All done. Swipe right to complete, left to save.';
        update();
      }
    } });
  }
  renderSubs();

  gesture(el, {
    moveEl: false,
    ignore: t => !!t.closest('.pp, .back, .drawer .list, .notesview'),
    onSwipeRight: () => { if (isPaused()) doComplete(); },
    onSwipeLeft: () => { if (isPaused()) doSave(); },
    onSwipeUp: hasDrawer ? () => setOpen(true) : null,
    onSwipeDown: hasDrawer ? () => setOpen(false) : null
  });

  function update() {
    const rr = state.running; if (!rr) return;
    const worked = sessionWorked(rr), rem = rr.budget - worked, f = Math.max(0, Math.min(1, rem / rr.budget));
    const over = rem < 0;
    ring.setAttribute('stroke-dasharray', `${f * C} ${C}`);
    ring.classList.toggle('over', over);
    barFill.style.width = (f * 100) + '%';
    bar.classList.toggle('over', over);
    clock.textContent = over ? '+' + fmtDur(-rem) : fmtDur(rem);
    clock.classList.toggle('over', over);
    const paused = isPaused();
    pps.forEach(p => { p.innerHTML = paused ? ICON_PLAY : ICON_PAUSE; p.classList.toggle('paused', paused); p.setAttribute('aria-label', paused ? 'Resume' : 'Pause'); });
    if (paused) { if (!hint.textContent) hint.textContent = 'Swipe right to complete, left to save.'; }
    else hint.textContent = '';
    if (over && !paused && !rr.vibrated) { rr.vibrated = true; save(); if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]); }
  }
  update();
  clearInterval(startTick);
  startTick = setInterval(update, 250);
  el._onClose = () => clearInterval(startTick);
  openScreen(el);
}
function doComplete() {
  const tp = getToken(true);
  const res = completeRunning();
  if (!res) return;
  closeAll(() => openSummary(res, tp));
}
function doSave() {
  saveRunning();
  closeAll(() => { goPanel('stack'); toast('Saved to BACKLOG'); });
}

/* ---------- completion summary ---------- */
function openSummary(res, tp) {
  const el = screenEl('sumscreen', `
    <div class="summary">
      <div class="sub">Complete</div>
      <div class="nm"></div>
      <div class="big">${fmtDur(res.total)}</div>
      <div class="sub">Logged ${msToClock(res.start)} to ${msToClock(res.end)}</div>
      <div class="sub status">Adding to your Paradigm calendar</div>
      <div class="fb"></div>
    </div>
    <div class="foot"><button class="btn primary wide done">DONE</button></div>`);
  $('.nm', el).textContent = res.name;
  $('.done', el).addEventListener('click', () => closeAll(() => goPanel('stack')));
  const status = $('.status', el), fb = $('.fb', el);
  const fail = msg => {
    status.textContent = msg;
    fb.innerHTML = '';
    const a = document.createElement('a');
    a.className = 'btn'; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'ADD TO CALENDAR';
    a.href = calLink(res.name, { startMs: res.start, endMs: res.end }, `Worked ${fmtDur(res.total)} in Paradigm`);
    fb.appendChild(a);
  };
  openScreen(el);
  tp.then(async tok => {
    if (!tok) return fail('Google is not connected.');
    try { await calLogCompletion(tok, res); status.textContent = 'Added to your Paradigm calendar'; }
    catch (e) { fail('Could not reach Google Calendar.'); }
  });
}

/* Paradigm: main panels and boot */
'use strict';

const VERSION = '1.0.1';
let panel = 'stack';
let backSel = [];

function goPanel(name) {
  panel = name;
  const x = { backlog: 0, stack: -33.3333, settings: -66.6667 }[name];
  $('#track').style.transform = `translateX(${x}%)`;
  hideSuggest();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

/* ---------- blocks ---------- */
function blockEl(bid) {
  const b = state.blocks[bid], it = state.items[b.itemId], l = blockLabel(bid);
  const el = document.createElement('div');
  el.className = 'block';
  el.dataset.key = bid;
  let meta = '';
  if (it.type === 'list' && !b.subId && it.subtasks.length) meta += `<span class="meta">${it.subtasks.filter(s => s.done).length}/${it.subtasks.length}</span>`;
  if (b.elapsed) meta += `<span class="meta">${fmtShort(b.elapsed)}</span>`;
  if (it.recurring && !b.subId) meta += '<span class="mark" aria-label="Recurring">↻</span>';
  el.innerHTML = `<span class="name">${l.proj ? `<span class="proj">${esc(l.proj)} ›</span> ` : ''}${esc(l.name)}</span>${meta}`;
  return el;
}

function renderAll() {
  if (!state) return;
  renderStack(); renderBacklog(); renderSettings(); renderRunbar();
}

/* ---------- STACK ---------- */
function renderStack() {
  renderPlace();
  const list = $('#stack-list');
  list.innerHTML = '';
  state.stack.forEach(bid => list.appendChild(blockEl(bid)));
  wireList(list, {
    reverse: true,
    onReorder: keys => { state.stack = keys; save(); },
    swipeRight: bid => openStartPicker(bid),
    swipeLeft: bid => withUndo('Sent to BACKLOG', () => { detach(bid); state.backlog.unshift(bid); })
  });
  $('#stack-empty').classList.toggle('hidden', !!(state.stack.length || state.placing.length));
}

function renderPlace() {
  const z = $('#place-zone');
  z.innerHTML = '';
  if (!state.placing.length) return;
  const bid = state.placing[0];
  const blk = blockEl(bid);
  z.appendChild(blk);
  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = (state.stack.length ? 'Hold and drag into place.' : 'Tap or drag to place.') + ' Swipe right to start, left for BACKLOG.';
  z.appendChild(hint);
  let drag = null;
  gesture(blk, {
    onSwipeRight: () => openStartPicker(bid),
    onSwipeLeft: () => { detach(bid); state.backlog.push(bid); save(); renderAll(); toast('Sent to BACKLOG'); },
    onTap: () => { if (!state.stack.length) placeAt(bid, 0); },
    onHoldStart: (x, y) => { drag = beginDrag({ listEl: $('#stack-list'), srcEl: blk, x, y, reverse: true, external: true }); blk.style.visibility = 'hidden'; },
    onHoldMove: (x, y) => drag && drag.move(x, y),
    onHoldEnd: cancelled => {
      if (!drag) return;
      const idx = drag.end(); drag = null;
      if (cancelled) { blk.style.visibility = ''; return; }
      placeAt(bid, Math.max(0, idx));
    }
  });
}
function placeAt(bid, idx) {
  detach(bid);
  state.stack.splice(idx, 0, bid);
  save(); renderAll();
}

function renderRunbar() {
  const rb = $('#runbar');
  const show = !!state.running && !screens.some(s => s.classList.contains('start'));
  rb.classList.toggle('hidden', !show);
  if (!show) return;
  const r = state.running, rem = r.budget - sessionWorked(r);
  rb.innerHTML = `<span>${isPaused() ? 'Paused' : 'Running'}: ${esc(blockName(r.bid))}</span><span>${rem >= 0 ? fmtDur(rem) : '+' + fmtDur(-rem)}</span>`;
}

/* ---------- BACKLOG ---------- */
function renderBacklog() {
  backSel = backSel.filter(b => state.backlog.includes(b));
  const list = $('#backlog-list');
  list.innerHTML = '';
  state.backlog.forEach(bid => { const e = blockEl(bid); if (backSel.includes(bid)) e.classList.add('sel'); list.appendChild(e); });
  wireList(list, {
    reverse: false,
    enabled: () => backSel.length === 0,
    onReorder: keys => { state.backlog = keys; save(); },
    swipeRight: bid => { detach(bid); state.placing.push(bid); save(); goPanel('stack'); renderAll(); },
    swipeLeft: bid => backlogLeft(bid),
    tap: bid => { backSel = backSel.includes(bid) ? backSel.filter(b => b !== bid) : backSel.concat(bid); renderBacklog(); }
  });
  const add = $('#btn-add');
  add.classList.toggle('hidden', !backSel.length);
  add.textContent = backSel.length > 1 ? `ADD ${backSel.length}` : 'ADD';
  $('#backlog-empty').classList.toggle('hidden', !!state.backlog.length);
}
function backlogLeft(bid) {
  const b = state.blocks[bid], it = state.items[b.itemId];
  if (b.subId) withUndo('Returned to project', () => removeBlock(bid));
  else if (it.recurring) withUndo('Skipped until next time', () => removeBlock(bid));
  else withUndo('Deleted', () => deleteItem(it.id));
}
function addSelected() {
  backSel.forEach(bid => { detach(bid); state.placing.push(bid); });
  backSel = [];
  save(); goPanel('stack'); renderAll();
}

/* ---------- search / create ---------- */
function clearMainInput() { $('#main-input').value = ''; hideSuggest(); }
function hideSuggest() { const s = $('#suggest'); if (s) s.classList.add('hidden'); }
function showSuggest() {
  const inp = $('#main-input'), sug = $('#suggest');
  const raw = inp.value.trim(), v = raw.toLowerCase();
  let items = Object.values(state.items);
  if (v) items = items.filter(i => i.name.toLowerCase().includes(v));
  items.sort((a, b) => (a.name.toLowerCase().startsWith(v) ? 0 : 1) - (b.name.toLowerCase().startsWith(v) ? 0 : 1) || a.name.localeCompare(b.name));
  let html = '';
  if (raw && !itemByName(raw)) html += `<div class="sug create" data-new="1"><span class="tag">NEW</span><span>${esc(raw)}</span></div>`;
  html += items.slice(0, 60).map(i => `<div class="sug" data-id="${i.id}"><span class="tag">${TYPES[i.type]}</span><span>${esc(i.name)}</span></div>`).join('');
  if (!html) { hideSuggest(); return; }
  sug.innerHTML = html;
  sug.classList.remove('hidden');
}
function submitInput() {
  const inp = $('#main-input'), v = inp.value.trim();
  if (!v) return;
  const ex = itemByName(v);
  inp.blur(); hideSuggest();
  if (ex) { inp.value = ''; openEditor(ex, false); }
  else openChooser(v);
}

/* ---------- SETTINGS ---------- */
function renderSettings() {
  const body = $('#settings-body');
  if (!body || (document.activeElement && document.activeElement.id === 'cid')) return;
  const s = state.settings;
  const status = tokenValid() ? 'Connected' : s.connected ? 'Connected. Access refreshes on your next sync.' : 'Not connected';
  body.innerHTML = `
    <div class="sect"><h3>Google</h3>
      <p>Paste the OAuth client ID from your Google Cloud project. The README walks through setup.</p>
      <input type="text" id="cid" placeholder="Client ID" autocomplete="off" spellcheck="false">
      <p class="status">${esc(status)}</p>
      <button class="btn wide" id="b-connect">CONNECT GOOGLE</button>
    </div>
    <div class="sect"><h3>Drive backup</h3>
      <p>Backs up automatically after changes while connected. Last backup: ${s.lastBackup ? esc(new Date(s.lastBackup).toLocaleString()) : 'never'}.</p>
      <div class="btnrow"><button class="btn" id="b-backup">BACK UP NOW</button><button class="btn quiet" id="b-restore">RESTORE</button></div>
    </div>
    <div class="sect"><h3>File backup</h3>
      <p>Save or load a copy of everything as a file on this phone.</p>
      <div class="btnrow"><button class="btn" id="b-export">EXPORT</button><button class="btn quiet" id="b-import">IMPORT</button></div>
      <input type="file" id="f-import" accept="application/json,.json" class="hidden">
    </div>
    <div class="sect"><h3>Install</h3>
      <p>In Chrome, open the menu and choose Add to home screen (or Install app) to run Paradigm fullscreen.</p>
      <p>Paradigm ${VERSION}</p>
    </div>`;
  const cid = $('#cid');
  cid.value = s.clientId || '';
  cid.addEventListener('change', () => { s.clientId = cid.value.trim(); tokenClient = null; save({ noBackup: true }); });
  $('#b-connect').addEventListener('click', () => {
    s.clientId = cid.value.trim(); save({ noBackup: true });
    if (!s.clientId) return toast('Paste your client ID first');
    if (!gisReady()) return toast('Google sign-in did not load. Check your connection and reopen the app.');
    getToken(true, true).then(tok => {
      toast(tok ? 'Connected to Google' : 'Could not connect. Check the client ID and that you are a test user.');
      if (tok) driveBackup();
      renderSettings();
    });
  });
  $('#b-backup').addEventListener('click', () => {
    const tp = getToken(true);
    driveBackup(tp).then(ok => toast(ok ? 'Backed up to Drive' : 'Backup failed. Connect Google first.'));
  });
  $('#b-restore').addEventListener('click', () => confirmBox('Replace everything on this phone with your Drive backup?', 'RESTORE', () => {
    const tp = getToken(true);
    driveRestore(tp).then(data => { applyImport(data); toast('Restored from Drive'); }).catch(e => toast(e.message));
  }));
  $('#b-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(exportable(), null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `paradigm-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
  const fin = $('#f-import');
  $('#b-import').addEventListener('click', () => fin.click());
  fin.addEventListener('change', async () => {
    const f = fin.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data.items) throw new Error('bad');
      confirmBox('Replace everything on this phone with this file?', 'IMPORT', () => { applyImport(data); toast('Imported'); });
    } catch (e) { toast('That file is not a Paradigm backup'); }
    fin.value = '';
  });
}
function applyImport(data) {
  const auth = state.auth, settings = state.settings;
  state = normalize(data);
  state.auth = auth;
  state.settings = Object.assign({}, settings, { clientId: settings.clientId || (data.settings && data.settings.clientId) || '' });
  backSel = [];
  repair(); save(); renderAll();
}

/* ---------- due items + clock ---------- */
function flashArrivals(bids) {
  if (!bids || !bids.length) return;
  requestAnimationFrame(() => bids.forEach(bid => {
    const e = $(`#stack-list [data-key="${bid}"]`);
    if (e) { e.classList.add('flash'); setTimeout(() => e.classList.remove('flash'), 1000); }
  }));
}
function checkDue() {
  if (state.lastDueCheck >= todayStr() || dragCtx) return;
  const arrived = runDueCheck();
  renderAll(); flashArrivals(arrived);
}

/* ---------- boot ---------- */
async function boot() {
  history.replaceState({ d: 0 }, '');
  try { await loadState(); }
  catch (e) { state = freshState(); toast('Storage is unavailable. Changes will not be kept.'); }

  gesture($('#t-stack'), { moveEl: false, onSwipeRight: () => goPanel('backlog'), onSwipeLeft: () => goPanel('settings') });
  gesture($('#t-backlog'), { moveEl: false, onSwipeLeft: () => goPanel('stack') });
  gesture($('#t-settings'), { moveEl: false, onSwipeRight: () => goPanel('stack') });
  $('#btn-add').addEventListener('click', addSelected);
  $('#runbar').addEventListener('click', openStart);

  const inp = $('#main-input'), sug = $('#suggest');
  inp.addEventListener('focus', showSuggest);
  inp.addEventListener('input', showSuggest);
  inp.addEventListener('blur', () => setTimeout(hideSuggest, 180));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitInput(); } });
  sug.addEventListener('mousedown', e => e.preventDefault());
  sug.addEventListener('click', e => {
    const r = e.target.closest('.sug'); if (!r) return;
    if (r.dataset.new) { const v = inp.value.trim(); inp.blur(); hideSuggest(); openChooser(v); }
    else { const it = state.items[r.dataset.id]; inp.value = ''; inp.blur(); hideSuggest(); if (it) openEditor(it, false); }
  });

  const arrived = runDueCheck();
  renderAll();
  flashArrivals(arrived);
  if (state.running) openStart();

  setInterval(() => { renderRunbar(); checkDue(); }, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) flush();
    else { checkDue(); renderRunbar(); }
  });
  window.addEventListener('pagehide', flush);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
