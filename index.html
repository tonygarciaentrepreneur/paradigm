      const sync = () => tp.then(async tok => {
        if (!tok) return calFallbackToast('Google is not connected.', it.name, ev);
        try { it.event.gcalId = await calInsertEvent(tok, it.name, it.event); save(); toast('Added to Google Calendar'); }
        catch (e) { calFallbackToast('Could not reach Google Calendar.', it.name, ev); }
      });
    } }) });
  } else {
    openEditor(newItem(t, name), true);
  }
}

/* ---------- editors ---------- */
function eventWhen(ev) {
  if (!ev) return 'No time set';
  const d = parseDate(ev.date).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  return ev.allDay ? `${d}, all day` : `${d}, ${minToClock(ev.startMin)} to ${minToClock(ev.endMin)}`;
}

function openEditor(item, isNew) {
  const orig = clone(item);
  const d = clone(item);
  let selMode = false, selected = [];
  const el = screenEl('editor', `
    <div class="bar"><span class="label">${TYPES[d.type]}</span></div>
    <div class="body"><input class="namein" type="text" autocomplete="off"><div class="content"></div></div>
    <div class="foot"></div>
    <header class="title edit-title"><h1>EDIT</h1></header>`);
  // Swipe right on EDIT saves and returns to the previous screen.
  gesture($('.edit-title', el), { moveEl: false, onSwipeRight: () => onSave() });
  const nameIn = $('.namein', el);
  nameIn.value = d.name;
  nameIn.addEventListener('input', () => { d.name = nameIn.value; });
  const content = $('.content', el), foot = $('.foot', el);
  let subsList = null;

  function render() {
    content.innerHTML = '';
    if (d.type === 'task') {
      const s = document.createElement('div'); s.className = 'sect';
      s.innerHTML = '<h3>Notes</h3><textarea class="notes" placeholder="Anything to remember"></textarea>';
      const ta = $('textarea', s); ta.value = d.notes || ''; ta.addEventListener('input', () => { d.notes = ta.value; });
      content.appendChild(s);
      const r = document.createElement('div'); r.className = 'sect'; content.appendChild(r); recurringUI(d, r);
    }
    if (d.type === 'list') {
      const r = document.createElement('div'); r.className = 'sect'; content.appendChild(r); recurringUI(d, r);
    }
    if (d.type === 'project') {
      const r = document.createElement('div'); r.className = 'sect'; content.appendChild(r);
      r.append(checkBtn('Recurring project', !!d.recurring, () => { d.recurring = !d.recurring; render(); }));
    }
    if (d.type === 'list' || d.type === 'project') {
      const s = document.createElement('div'); s.className = 'sect editor-list';
      s.innerHTML = `<h3>${selMode ? 'Tap subtasks to add to STACK' : 'Subtasks'}</h3><div class="list rev"></div>${selMode ? '' : '<input class="subin" type="text" placeholder="Add a subtask" enterkeyhint="done" autocomplete="off">'}`;
      content.appendChild(s);
      subsList = $('.list', s);
      const si = $('.subin', s);
      if (si) si.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const v = si.value.trim(); if (!v) return;
        d.subtasks.push({ id: uid(), name: v, done: false });
        si.value = ''; renderSubs();
      });
      renderSubs();
    }
    if (d.type === 'event') {
      const s = document.createElement('div'); s.className = 'sect';
      s.innerHTML = `<h3>When</h3><p class="status"></p><button class="btn wide">CHANGE TIME</button>`;
      $('.status', s).textContent = eventWhen(d.event);
      $('button', s).addEventListener('click', changeTime);
      content.appendChild(s);
    }
    renderFoot();
  }

  function renderSubs() {
    if (!subsList) return;
    subsList.innerHTML = '';
    d.subtasks.forEach(s => {
      const b = document.createElement('div');
      b.className = 'block small' + (s.done ? ' done' : '') + (selMode && selected.includes(s.id) ? ' sel' : '');
      b.dataset.key = s.id;
      let extra = '';
      if (d.type === 'project') {
        const bid = findBlock(d.id, s.id), w = bid && whereBlock(bid);
        if (w) extra = `<span class="onstack">${w === 'backlog' ? 'BACKLOG' : w === 'running' ? 'RUNNING' : 'STACK'}</span>`;
      }
      b.innerHTML = `<span class="name">${esc(s.name)}</span>${extra}`;
      subsList.appendChild(b);
    });
    wireList(subsList, {
      reverse: true,
      onReorder: selMode ? null : keys => { d.subtasks = keys.map(k => d.subtasks.find(s => s.id === k)); renderSubs(); },
      swipeLeft: selMode ? null : k => { d.subtasks = d.subtasks.filter(s => s.id !== k); renderSubs(); },
      tap: k => {
        const s = d.subtasks.find(x => x.id === k); if (!s) return;
        if (selMode) {
          if (s.done) return;
          selected = selected.includes(k) ? selected.filter(x => x !== k) : selected.concat(k);
          renderSubs(); renderFoot();
        } else { s.done = !s.done; renderSubs(); }
      }
    });
  }

  function renderFoot() {
    foot.innerHTML = '';
    foot.classList.toggle('hidden', !(d.type === 'event' && !isNew));
    if (d.type === 'event' && !isNew) {
      const b = document.createElement('button');
      b.className = 'btn danger wide'; b.textContent = 'DELETE EVENT';
      b.addEventListener('click', del);
      foot.append(b);
    }
  }

  function validName() {
    const n = (d.name || '').trim();
    if (!n) { toast('Give it a name first'); return false; }
    const other = itemByName(n);
    if (other && other.id !== d.id) { toast('Another item already has that name'); return false; }
    d.name = n; return true;
  }
  function commit() {
    if (d.type === 'project') {
      const keep = new Set(d.subtasks.map(s => s.id));
      for (const bid of Object.keys(state.blocks)) { const b = state.blocks[bid]; if (b.itemId === d.id && b.subId && !keep.has(b.subId)) removeBlock(bid); }
    }
    state.items[d.id] = d;
    if (d.type === 'project') listProject(d.id);
    save();
  }
  function onSave() {
    if (!validName()) return;
    if (d.type === 'event') return saveEvent();
    commit(); clearMainInput();
    let msg = 'Saved';
    if (isNew && d.type === 'list') { addToStack(d.id, null, 'bottom'); msg = 'Added to STACK'; }
    else if (isNew && d.type === 'project') msg = 'Saved to PROJECT BACKLOG';
    else if (placeInBacklog(d.id)) msg = `Saved to ${BACKLOG_TITLE[d.type]}`;
    save();
    // New items came from the chooser, so go home; existing ones return to where you were.
    if (isNew) closeAll(() => { goPanel('stack'); toast(msg); });
    else closeTop(() => { renderAll(); toast(msg); });
  }
  function del() {
    const msg = d.type === 'project' ? `Delete project “${orig.name}” and remove its subtasks from STACK?` : `Delete “${orig.name}”?`;
    confirmBox(msg, 'DELETE', () => {
      const gid = orig.type === 'event' && orig.event && orig.event.gcalId;
      const tp = gid ? getToken(true) : null;
      deleteItem(d.id); save(); clearMainInput();
      closeAll(() => { goPanel('stack'); toast('Deleted'); if (tp) setTimeout(() => sync()); });
      const sync = () => tp.then(async tok => {
        if (!tok) return toast('Google is not connected. Delete the event in Google Calendar too.');
        try { await calDeleteEvent(tok, gid); toast('Deleted from Google Calendar'); }
        catch (e) { toast('Could not reach Google Calendar. Delete the event there too.'); }
      });
    });
  }
  function changeTime() {
    openMonth({ title: d.name, picked: d.event && d.event.date, onPick: date => {
      const sel = d.event && d.event.date === date ? { allDay: d.event.allDay, startMin: d.event.startMin, endMin: d.event.endMin } : null;
      openDay({ mode: 'event', date, name: d.name, sel, onSave: ev => {
        d.event = Object.assign({}, ev, { gcalId: d.event && d.event.gcalId || '' });
        closeN(2, render);
      } });
    } });
  }
  function saveEvent() {
    if (!d.event) { toast('Pick a time first'); return; }
    const changed = JSON.stringify([orig.name, orig.event]) !== JSON.stringify([d.name, d.event]) || !d.event.gcalId;
    const tp = changed ? getToken(true) : null;
    commit(); clearMainInput();
    closeAll(() => { goPanel('stack'); toast('Saved'); if (tp) setTimeout(() => sync()); });
    const it = state.items[d.id];
    const sync = () => tp.then(async tok => {
      if (!tok) {
        if (it.event.gcalId) return toast('Google is not connected. Update the event in Google Calendar too.');
        return calFallbackToast('Google is not connected.', it.name, it.event);
      }
      try {
        if (it.event.gcalId) await calUpdateEvent(tok, it.event.gcalId, it.name, it.event);
        else { it.event.gcalId = await calInsertEvent(tok, it.name, it.event); save(); }
        toast('Google Calendar updated');
      } catch (e) {
        if (it.event.gcalId) toast('Could not reach Google Calendar. Update the event there too.');
        else calFallbackToast('Could not reach Google Calendar.', it.name, it.event);
      }
    });
  }

  render();
  openScreen(el);
}

/* ---------- project subtasks (swipe right on a project in PROJECT BACKLOG) ---------- */
function openProjectSubs(id) {
  const it = state.items[id]; if (!it) return;
  const el = screenEl('projsubs', `
    <div class="bar"><button class="back" aria-label="Back">‹</button><span class="label">PROJECT</span></div>
    <div class="list rev"></div>
    <p class="empty hidden"></p>
    <div class="foot"><button class="btn wide edit">EDIT PROJECT</button></div>
    <header class="title"><h1></h1></header>`);
  backBtn(el);
  const list = $('.list', el), empty = $('.empty', el);
  $('.title h1', el).textContent = it.name.toUpperCase();
  gesture($('.title', el), { moveEl: false, onSwipeRight: () => closeTop(), onSwipeLeft: () => closeTop() });
  $('.edit', el).addEventListener('click', () => openEditor(state.items[id], false));
  function render() {
    const item = state.items[id]; if (!item) return;
    const open = item.subtasks.filter(s => !s.done);
    list.innerHTML = '';
    open.forEach(s => {
      const b = document.createElement('div');
      b.className = 'block'; b.dataset.key = s.id;
      const bid = findBlock(id, s.id), w = bid && whereBlock(bid);
      b.innerHTML = `<span class="name">${esc(s.name)}</span>${w ? `<span class="meta">${w === 'running' ? 'FOCUS' : 'STACK'}</span>` : ''}`;
      list.appendChild(b);
    });
    empty.textContent = item.subtasks.length ? 'All subtasks done.' : 'No subtasks yet. Tap Edit project to add some.';
    empty.classList.toggle('hidden', !!open.length);
    wireList(list, {
      reverse: true,
      onReorder: keys => {
        const done = item.subtasks.filter(s => s.done);
        item.subtasks = keys.map(k => item.subtasks.find(s => s.id === k)).concat(done);
        save(); render();
      },
      armable: () => true,
      openEdit: () => openEditor(state.items[id], false),
      armDelete: sid => {
        const sub = item.subtasks.find(x => x.id === sid);
        withUndo(`Deleted ${sub ? sub.name : 'subtask'}`, () => {
          const bid = findBlock(id, sid); if (bid) removeBlock(bid);
          item.subtasks = item.subtasks.filter(x => x.id !== sid);
        });
        render();
      },
      swipeRight: sid => {
        const msg = addToStack(id, sid);
        save(); renderAll(); render();
        toast(msg || 'Added to top of STACK');
      }
    });
  }
  el._refresh = render;
  render();
  openScreen(el);
}

/* ---------- recurring + schedule controls ---------- */
function checkBtn(label, on, fn) {
  const b = document.createElement('button');
  b.className = 'check' + (on ? ' on' : '');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.innerHTML = `<span class="box"></span><span>${esc(label)}</span>`;
  b.addEventListener('click', fn);
  return b;
}
function recurringUI(d, host) {
  host.innerHTML = '';
  const again = () => recurringUI(d, host);
  if (d.type === 'task') {
    host.append(checkBtn('Recurring', d.recurring, () => { d.recurring = !d.recurring; again(); }));
    if (d.recurring) host.append(scheduleUI(d));
  } else if (d.type === 'list') {
    host.append(checkBtn('Recurring list', d.recurring, () => { d.recurring = !d.recurring; if (!d.recurring) d.recSubtasks = false; again(); }));
    if (d.recurring) {
      host.append(checkBtn('Recurring subtasks', d.recSubtasks, () => { d.recSubtasks = !d.recSubtasks; again(); }));
      host.append(scheduleUI(d));
    }
  }
}
function scheduleUI(d) {
  const w = document.createElement('div'); w.className = 'sect';
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function render() {
    const s = d.schedule = Object.assign(defaultSchedule('none'), d.schedule || {});
    w.innerHTML = `<h3>Repeats</h3><div class="seg f">${['none', 'daily', 'weekly', 'monthly', 'annually'].map(f => `<button data-f="${f}" class="${s.freq === f ? 'on' : ''}">${f.toUpperCase()}</button>`).join('')}</div><div class="extra"></div>`;
    w.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { s.freq = b.dataset.f; render(); }));
    const x = $('.extra', w);
    if (s.freq === 'weekly') {
      x.innerHTML = `<div class="seg" style="margin-top:10px">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((l, i) => `<button data-d="${i}" aria-label="${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][i]}" class="${s.days.includes(i) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
      x.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.d;
        s.days = s.days.includes(i) ? s.days.filter(v => v !== i) : s.days.concat(i);
        if (!s.days.length) s.days = [i];
        render();
      }));
    } else if (s.freq === 'monthly') {
      x.innerHTML = `<label class="inline">Day of month <input type="number" min="1" max="31" inputmode="numeric" value="${s.dom}"></label>`;
      $('input', x).addEventListener('change', e => { s.dom = Math.min(31, Math.max(1, parseInt(e.target.value, 10) || 1)); e.target.value = s.dom; });
    } else if (s.freq === 'annually') {
      x.innerHTML = `<div class="inline"><select>${MONTHS.map((m, i) => `<option value="${i}" ${i === s.month ? 'selected' : ''}>${m}</option>`).join('')}</select><input type="number" min="1" max="31" inputmode="numeric" value="${s.dom}"></div>`;
      $('select', x).addEventListener('change', e => { s.month = +e.target.value; });
      $('input', x).addEventListener('change', e => { s.dom = Math.min(31, Math.max(1, parseInt(e.target.value, 10) || 1)); e.target.value = s.dom; });
    }
  }
  render();
  return w;
}

/* ---------- month calendar ---------- */
function openMonth({ title, picked, onPick }) {
  const el = screenEl('monthscreen', `<div class="bar"><button class="back" aria-label="Back">‹</button><span class="label"></span></div><div class="months"></div>`);
  $('.label', el).textContent = title;
  backBtn(el);
  const box = $('.months', el), now = new Date(), today = todayStr();
  let html = '';
  for (let i = -1; i <= 24; i++) {
    const m = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    let cells = '';
    for (let k = 0; k < m.getDay(); k++) cells += '<span></span>';
    for (let dd = 1; dd <= days; dd++) {
      const ds = dateStr(new Date(m.getFullYear(), m.getMonth(), dd));
      const cls = [ds < today ? 'past' : '', ds === today ? 'today' : '', ds === picked ? 'picked' : ''].join(' ');
      cells += `<button class="${cls}" data-date="${ds}">${dd}</button>`;
    }
    html += `<div class="month" ${i === 0 ? 'data-cur' : ''}><h2>${m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }).toUpperCase()}</h2><div class="dow">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div>`;
  }
  box.innerHTML = html;
  box.addEventListener('click', e => { const b = e.target.closest('[data-date]'); if (b) onPick(b.dataset.date); });
  openScreen(el);
  requestAnimationFrame(() => { const c = $('[data-cur]', box); if (c) box.scrollTop = c.getBoundingClientRect().top - box.getBoundingClientRect().top - 8; });
}

/* ---------- day view: event time picker and START time block ---------- */
const SLOT_H = 32;
function openDay({ mode, date, name, sel, onSave }) {
  // mode 'event': 30-minute steps, All day toggle, SAVE.
  // mode 'complete': 15-minute steps, pre-filled with the half hour ending now, COMPLETE.
  const isComplete = mode === 'complete';
  const step = isComplete ? 15 : 30, slots = 1440 / step, slotH = SLOT_H * step / 30;
  const el = screenEl('dayscreen', `
    <div class="bar"><button class="back" aria-label="Back">‹</button><span class="label"></span></div>
    <div class="dayhead"><span class="d"></span>${isComplete ? '' : '<button class="check allday" style="width:auto"><span class="box"></span><span>All day</span></button>'}</div>
    <div class="allday-strip"></div>
    <div class="dayscroll"><div class="grid" style="margin-top:12px;margin-bottom:24px"></div></div>
    <div class="foot"><div class="selinfo"></div><button class="btn primary wide go">${isComplete ? 'COMPLETE' : 'SAVE'}</button></div>`);
  $('.label', el).textContent = name;
  $('.d', el).textContent = parseDate(date).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  backBtn(el);
  const grid = $('.grid', el), scroller = $('.dayscroll', el), info = $('.selinfo', el), go = $('.go', el);
  let g = '';
  for (let i = 0; i < 48; i++) g += `<div class="slot ${i % 2 === 0 ? 'hr' : ''}"></div>`;
  for (let h = 0; h < 24; h++) g += `<span class="hlabel" style="top:${h * 2 * SLOT_H}px">${minToClock(h * 60).replace(':00', '')}</span>`;
  grid.innerHTML = g;
  const blk = document.createElement('div'); blk.className = 'selblk hidden'; grid.appendChild(blk);

  const nowD = new Date();
  const nowMin = nowD.getHours() * 60 + nowD.getMinutes() + nowD.getSeconds() / 60;
  if (date === todayStr()) { const nl = document.createElement('div'); nl.className = 'nowline'; nl.style.top = (nowMin / 30 * SLOT_H) + 'px'; grid.appendChild(nl); }

  const slotAt = y => Math.max(0, Math.min(slots - 1, Math.floor((y - grid.getBoundingClientRect().top) / slotH)));
  let anchor = 0;
  gesture(grid, {
    moveEl: false,
    enabled: () => !(sel && sel.allDay),
    ignore: t => !!t.closest('.handle'),
    onHoldStart: (x, y) => { anchor = slotAt(y); sel = { allDay: false, startMin: anchor * step, endMin: anchor * step + step }; draw(); },
    onHoldMove: (x, y) => { edgeScroll(y); const s = slotAt(y), lo = Math.min(anchor, s), hi = Math.max(anchor, s); sel.startMin = lo * step; sel.endMin = (hi + 1) * step; draw(); },
    onHoldEnd: () => {},
    onTap: e => { const t = e.changedTouches ? e.changedTouches[0] : e; const s = slotAt(t.clientY); sel = { allDay: false, startMin: s * step, endMin: s * step + step }; draw(); }
  });

  if (isComplete) {
    const end = Math.min(1440, Math.max(30, Math.ceil(nowMin / 15) * 15));
    if (!sel) sel = { allDay: false, startMin: end - 30, endMin: end };
    // Drag the bar at the bottom of the block to change when it ended.
    const h = document.createElement('div'); h.className = 'handle'; h.setAttribute('aria-label', 'Drag to set end time'); blk.appendChild(h);
    h.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });
    h.addEventListener('touchmove', e => {
      if (e.cancelable) e.preventDefault();
      const y = e.touches[0].clientY; edgeScroll(y);
      const r = grid.getBoundingClientRect();
      sel.endMin = Math.max(sel.startMin + step, Math.min(1440, Math.round((y - r.top) / slotH) * step));
      draw();
    }, { passive: false });
  } else {
    $('.allday', el).addEventListener('click', () => {
      if (sel && sel.allDay) sel = null; else sel = { allDay: true, startMin: 0, endMin: 0 };
      draw();
    });
  }
  function edgeScroll(y) { const r = scroller.getBoundingClientRect(); if (y < r.top + 40) scroller.scrollTop -= 10; else if (y > r.bottom - 40) scroller.scrollTop += 10; }

  function draw() {
    const ad = $('.allday', el);
    if (ad) { ad.classList.toggle('on', !!(sel && sel.allDay)); }
    grid.classList.toggle('off', !!(sel && sel.allDay));
    if (!sel || sel.allDay) {
      blk.classList.add('hidden');
      info.textContent = sel && sel.allDay ? 'All day' : 'Hold and drag to pick a time';
      go.disabled = !sel; return;
    }
    blk.classList.remove('hidden');
    blk.style.top = (sel.startMin / 30 * SLOT_H) + 'px';
    blk.style.height = ((sel.endMin - sel.startMin) / 30 * SLOT_H) + 'px';
    const range = `${minToClock(sel.startMin)} to ${minToClock(sel.endMin % 1440)}`;
    if (blk.firstChild && blk.firstChild.nodeType === 3) blk.firstChild.textContent = range; else blk.insertBefore(document.createTextNode(range), blk.firstChild);
    const mins = sel.endMin - sel.startMin;
    info.textContent = isComplete ? `${range}, ${mins >= 60 ? Math.floor(mins / 60) + 'h' + (mins % 60 ? ' ' + (mins % 60) + 'm' : '') : mins + ' min'}` : range;
    go.disabled = false;
  }

  go.addEventListener('click', () => {
    if (!sel) return;
    onSave({ date, allDay: !!sel.allDay, startMin: sel.startMin, endMin: sel.endMin });
  });

  draw();
  openScreen(el);
  requestAnimationFrame(() => {
    const focusMin = sel && !sel.allDay ? sel.startMin : (date === todayStr() ? nowMin : 8 * 60);
    scroller.scrollTop = Math.max(0, focusMin / 30 * SLOT_H - 3 * SLOT_H);
  });

  calDayEvents(date).then(evs => {
    if (!evs || !el.isConnected) return;
    const strip = $('.allday-strip', el), t0 = parseDate(date).getTime();
    evs.forEach(e => {
      if (e.start && e.start.date) { const s = document.createElement('span'); s.textContent = e.summary || '(busy)'; strip.appendChild(s); return; }
      if (!e.start || !e.start.dateTime) return;
      const a = Math.max(0, (new Date(e.start.dateTime) - t0) / MIN), b = Math.min(1440, (new Date(e.end.dateTime) - t0) / MIN);
      if (b <= a) return;
      const d = document.createElement('div'); d.className = 'ev';
      d.style.top = (a / 30 * SLOT_H) + 'px'; d.style.height = Math.max(14, (b - a) / 30 * SLOT_H) + 'px';
      d.textContent = e.summary || '(busy)';
      grid.insertBefore(d, blk);
    });
  });
}

/* ---------- completing a STACK block: pick when it happened ---------- */
function openCompletePicker(bid) {
  const name = blockName(bid);
  openDay({ mode: 'complete', date: todayStr(), name, onSave: sel => {
    const tp = getToken(true);
    const t0 = parseDate(sel.date).getTime();
    const res = completeBlock(bid, t0 + sel.startMin * MIN, t0 + sel.endMin * MIN);
    if (!res) return;
    closeAll(() => {
      goPanel('stack');
      toast(`Completed ${res.name}`);
      tp.then(async tok => {
        const link = () => calFallbackToast('Completed. Google is not connected.', res.name, { startMs: res.start, endMs: res.end }, 'Completed in Paradigm');
        if (!tok) return link();
        try { await calLogCompletion(tok, res); toast(`Completed ${res.name}. Added to Paradigm calendar`); }
        catch (e) { link(); }
      });
    });
  } });
}

/* Paradigm: main panels and boot */
'use strict';

const VERSION = '1.6.0';
const PANELS = ['project', 'list', 'task', 'stack', 'settings'];
let panel = 'stack';

function goPanel(name, instant) {
  panel = name;
  const tr = $('#track');
  if (instant) tr.style.transition = 'none';
  tr.style.transform = `translateX(${-PANELS.indexOf(name) * 100 / PANELS.length}%)`;
  if (instant) requestAnimationFrame(() => { tr.style.transition = ''; });
  hideSuggest();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

/* ---------- blocks ---------- */
function blockEl(bid) {
  const b = state.blocks[bid], it = state.items[b.itemId], l = blockLabel(bid);
  const el = document.createElement('div');
  el.className = 'block';
  el.dataset.key = bid;
  let meta = '';
  if (it.type === 'list' && !b.subId && it.subtasks.length) meta += `<span class="meta">${it.subtasks.filter(s => s.done).length}/${it.subtasks.length}</span>`;
  if (b.elapsed) meta += `<span class="meta">${fmtShort(b.elapsed)}</span>`;
  if (it.recurring && !b.subId) meta += '<span class="mark" aria-label="Recurring">↻</span>';
  el.innerHTML = `<span class="name">${l.proj ? `<span class="proj">${esc(l.proj)} ›</span> ` : ''}${esc(l.name)}</span>${meta}`;
  return el;
}

/* Any block can be held to select, then swiped right to edit (project subtasks edit their project)
   or swiped left to delete (project subtasks delete just that subtask). Deleting never logs to the calendar. */
function blockEditable(bid) { return !!state.blocks[bid]; }
function editBlock(bid) { const b = state.blocks[bid]; if (b) openEditor(state.items[b.itemId], false); }
function deleteBlock(bid) { if (state.blocks[bid]) withUndo(`Deleted ${blockName(bid)}`, () => deleteBlockItem(bid)); }

function renderAll() {
  if (!state) return;
  renderStack(); renderBacklogs(); renderSettings();
}

/* ---------- STACK (bottom = highest priority; new from the input lands at the bottom, from a backlog at the top) ---------- */
function renderStack() {
  const list = $('#stack-list');
  list.innerHTML = '';
  state.stack.forEach(bid => list.appendChild(blockEl(bid)));
  wireList(list, {
    reverse: true,
    onReorder: keys => { state.stack = keys; save(); },
    armable: blockEditable,
    openEdit: editBlock,
    armDelete: deleteBlock,
    swipeRight: bid => openCompletePicker(bid),
    swipeLeft: bid => {
      const b = state.blocks[bid];
      const msg = b.subId ? `Returned to ${state.items[b.itemId].name}` : `Sent to ${BACKLOG_TITLE[blockKind(bid)]}`;
      withUndo(msg, () => sendToBacklog(bid));
    }
  });
  $('#stack-empty').classList.toggle('hidden', !!state.stack.length);
}

/* ---------- BACKLOGS (bottom-aligned; bottom = highest priority) ---------- */
function projectEl(id) {
  const it = state.items[id], n = it.subtasks.length, d = it.subtasks.filter(s => s.done).length;
  const el = document.createElement('div');
  el.className = 'block'; el.dataset.key = id;
  el.innerHTML = `<span class="name">${esc(it.name)}</span>${n ? `<span class="meta">${d}/${n}</span>` : ''}<span class="mark" aria-hidden="true">›</span>`;
  return el;
}
function renderBacklogs() {
  const pl = $('#bl-project');
  pl.innerHTML = '';
  state.backlogs.project.forEach(id => pl.appendChild(projectEl(id)));
  wireList(pl, {
    reverse: true,
    onReorder: keys => { state.backlogs.project = keys; save(); },
    armable: () => true,
    openEdit: id => openEditor(state.items[id], false),
    armDelete: id => withUndo(`Deleted ${state.items[id].name}`, () => deleteItem(id)),
    swipeRight: id => openProjectSubs(id)
  });
  $('#empty-project').classList.toggle('hidden', !!state.backlogs.project.length);
  for (const k of BLOCK_KINDS) {
    const list = $('#bl-' + k);
    list.innerHTML = '';
    state.backlogs[k].forEach(bid => list.appendChild(blockEl(bid)));
    wireList(list, {
      reverse: true,
      onReorder: keys => { state.backlogs[k] = keys; save(); },
      armable: blockEditable,
      openEdit: editBlock,
      armDelete: deleteBlock,
      swipeRight: bid => {
        detach(bid); state.stack.push(bid); save(); renderAll();
        toast('Added to top of STACK');
      }
    });
    $('#empty-' + k).classList.toggle('hidden', !!state.backlogs[k].length);
  }
}
/* ---------- search / create ---------- */
function clearMainInput() { $('#main-input').value = ''; hideSuggest(); }
function hideSuggest() { const s = $('#suggest'); if (s) s.classList.add('hidden'); }
function showSuggest() {
  const inp = $('#main-input'), sug = $('#suggest');
  const raw = inp.value.trim(), v = raw.toLowerCase();
  if (!raw) { hideSuggest(); return; }
  let items = Object.values(state.items).filter(i => i.name.toLowerCase().includes(v));
  items.sort((a, b) => (a.name.toLowerCase().startsWith(v) ? 0 : 1) - (b.name.toLowerCase().startsWith(v) ? 0 : 1) || a.name.localeCompare(b.name));
  let html = '';
  if (!itemByName(raw)) html += `<div class="sug create" data-new="1"><span class="tag">NEW</span><span>${esc(raw)}</span></div>`;
  html += items.slice(0, 60).map(i => `<div class="sug" data-id="${i.id}"><span class="tag">${TYPES[i.type]}</span><span>${esc(i.name)}</span></div>`).join('');
  sug.innerHTML = html;
  sug.classList.remove('hidden');
}
function submitInput() {
  const inp = $('#main-input'), v = inp.value.trim();
  if (!v) return;
  const ex = itemByName(v);
  inp.blur(); hideSuggest();
  if (ex) { inp.value = ''; openEditor(ex, false); }
  else openChooser(v);
}

/* ---------- SETTINGS ---------- */
function renderSettings() {
  const body = $('#settings-body');
  if (!body || (document.activeElement && ['cid', 'fdb'].includes(document.activeElement.id))) return;
  const s = state.settings;
  const status = tokenValid() ? 'Connected' : s.connected ? 'Connected. Access refreshes on your next sync.' : 'Not connected';
  body.innerHTML = `
    <div class="sect"><h3>Google</h3>
      <p>Paste the OAuth client ID from your Google Cloud project. The README walks through setup.</p>
      <input type="text" id="cid" placeholder="Client ID" autocomplete="off" spellcheck="false">
      <p class="status">${esc(status)}</p>
      <button class="btn wide" id="b-connect">CONNECT GOOGLE</button>
    </div>
    <div class="sect"><h3>Glasses</h3>
      <p>Sync with Paradigm on Meta Ray-Ban Display through your free Firebase database. The README walks through setup.</p>
      <input type="text" id="fdb" placeholder="https://…firebaseio.com" autocomplete="off" spellcheck="false">
      <p class="status">${esc({ off: 'Sync off', connecting: 'Connecting…', live: 'Sync on', offline: 'Offline. Will retry.' }[syncStatus] || '')}</p>
      <div class="btnrow"><button class="btn" id="b-sync">CONNECT</button><button class="btn" id="b-pair">PAIR GLASSES</button></div>
      ${(state.calQueue || []).length ? `<p>${state.calQueue.length} completion${state.calQueue.length > 1 ? 's' : ''} from your glasses ${state.calQueue.length > 1 ? 'are' : 'is'} waiting for Google Calendar.</p><button class="btn wide" id="b-logq">LOG TO CALENDAR</button>` : ''}
    </div>
    <div class="sect"><h3>Drive backup</h3>
      <p>Backs up automatically after changes while connected. Last backup: ${s.lastBackup ? esc(new Date(s.lastBackup).toLocaleString()) : 'never'}.</p>
      <div class="btnrow"><button class="btn" id="b-backup">BACK UP NOW</button><button class="btn quiet" id="b-restore">RESTORE</button></div>
    </div>
    <div class="sect"><h3>File backup</h3>
      <p>Save or load a copy of everything as a file on this phone.</p>
      <div class="btnrow"><button class="btn" id="b-export">EXPORT</button><button class="btn quiet" id="b-import">IMPORT</button></div>
      <input type="file" id="f-import" accept="application/json,.json" class="hidden">
    </div>
    <div class="sect"><h3>Install</h3>
      <p>In Chrome, open the menu and choose Add to home screen (or Install app) to run Paradigm fullscreen.</p>
      <p>Paradigm ${VERSION}</p>
    </div>`;
  const fdb = $('#fdb');
  fdb.value = s.syncDb || '';
  $('#b-sync').addEventListener('click', () => {
    const v = fdb.value.trim().replace(/\/+$/, '');
    if (!/^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(v)) return toast('Paste the database URL from Firebase (it ends in firebaseio.com or firebasedatabase.app)');
    s.syncDb = v;
    if (!s.syncKey) s.syncKey = newSyncKey();
    syncCfg = { db: s.syncDb, key: s.syncKey }; syncLastSent = '';
    save({ noSync: true, noBackup: true });
    syncStart().then(() => { toast(syncStatus === 'offline' ? 'Could not reach the database. Check the URL and rules.' : 'Glasses sync is on'); renderSettings(); });
  });
  $('#b-pair').addEventListener('click', () => {
    if (!syncConfigured()) return toast('Connect your Firebase database first');
    if (!location.protocol.startsWith('https')) return toast('Open Paradigm from your GitHub Pages address to pair glasses');
    openPairing();
  });
  const lq = $('#b-logq'); if (lq) lq.addEventListener('click', () => processCalQueue(true));
  const cid = $('#cid');
  cid.value = s.clientId || '';
  cid.addEventListener('change', () => { s.clientId = cid.value.trim(); tokenClient = null; save({ noBackup: true }); });
  $('#b-connect').addEventListener('click', () => {
    s.clientId = cid.value.trim(); save({ noBackup: true });
    if (!s.clientId) return toast('Paste your client ID first');
    if (!gisReady()) return toast('Google sign-in did not load. Check your connection and reopen the app.');
    getToken(true, true).then(tok => {
      toast(tok ? 'Connected to Google' : 'Could not connect. Check the client ID and that you are a test user.');
      if (tok) driveBackup();
      renderSettings();
    });
  });
  $('#b-backup').addEventListener('click', () => {
    const tp = getToken(true);
    driveBackup(tp).then(ok => toast(ok ? 'Backed up to Drive' : 'Backup failed. Connect Google first.'));
  });
  $('#b-restore').addEventListener('click', () => confirmBox('Replace everything on this phone with your Drive backup?', 'RESTORE', () => {
    const tp = getToken(true);
    driveRestore(tp).then(data => { applyImport(data); toast('Restored from Drive'); }).catch(e => toast(e.message));
  }));
  $('#b-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(exportable(), null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `paradigm-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
  const fin = $('#f-import');
  $('#b-import').addEventListener('click', () => fin.click());
  fin.addEventListener('change', async () => {
    const f = fin.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data.items) throw new Error('bad');
      confirmBox('Replace everything on this phone with this file?', 'IMPORT', () => { applyImport(data); toast('Imported'); });
    } catch (e) { toast('That file is not a Paradigm backup'); }
    fin.value = '';
  });
}
function applyImport(data) {
  const auth = state.auth, settings = state.settings;
  state = normalize(data);
  state.auth = auth;
  state.settings = Object.assign({}, settings, { clientId: settings.clientId || (data.settings && data.settings.clientId) || '' });
  repair(); save(); renderAll();
}

/* ---------- due items + clock ---------- */
function flashArrivals(bids) {
  if (!bids || !bids.length) return;
  requestAnimationFrame(() => bids.forEach(bid => {
    const e = $(`#stack-list [data-key="${bid}"]`);
    if (e) { e.classList.add('flash'); setTimeout(() => e.classList.remove('flash'), 1000); }
  }));
}
function checkDue() {
  if (state.lastDueCheck >= todayStr() || dragCtx) return;
  const arrived = runDueCheck();
  renderAll(); flashArrivals(arrived);
}

/* ---------- glasses: sync hooks, calendar queue, pairing ---------- */
function saveSyncMeta() { state.settings.syncRev = syncRev; save({ noSync: true, noBackup: true }); }
function onSyncStatus() { renderSettings(); }
let calQueueToasted = 0;
/* The glasses can't sign in to Google, so their completions wait here until the phone logs them. */
async function processCalQueue(interactive) {
  const n = (state.calQueue || []).length;
  if (!n) return;
  const tok = await getToken(interactive);
  if (!tok) {
    renderSettings();
    if (!interactive && state.settings.clientId && n > calQueueToasted) {
      calQueueToasted = n;
      toast(`${n} completion${n > 1 ? 's' : ''} from your glasses need${n > 1 ? '' : 's'} Google Calendar`, { label: 'LOG', fn: () => processCalQueue(true) });
    }
    return;
  }
  let done = 0;
  for (const c of state.calQueue.slice()) {
    try { await calLogCompletion(tok, c); state.calQueue = state.calQueue.filter(x => x.id !== c.id); done++; }
    catch (e) { break; }
  }
  calQueueToasted = state.calQueue.length;
  save(); renderSettings();
  if (done) toast(`Logged ${done} completion${done > 1 ? 's' : ''} from your glasses to Google Calendar`);
}
function glassesUrl() {
  const u = new URL('glasses.html', location.href);
  u.search = `?db=${encodeURIComponent(state.settings.syncDb)}&k=${encodeURIComponent(state.settings.syncKey)}`;
  u.hash = '';
  return u.href;
}
function openPairing() {
  const link = `fb-viewapp://web_app_deep_link?appName=Paradigm&appUrl=${encodeURIComponent(glassesUrl())}`;
  const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
  const el = screenEl('pairscreen', `
    <div class="bar"><button class="back" aria-label="Back">‹</button><span class="label">GLASSES</span></div>
    <div class="body pair">
      <div class="qrbox">${qr.createSvgTag({ cellSize: 6, margin: 3, scalable: true })}</div>
      <p>Put on your glasses and look at this code, then confirm <b>Paradigm</b> on the glasses. It will say the app is unverified; that's expected for your own app.</p>
      <p>Developer Mode must be on in the Meta AI app (Settings → App Info → tap the version number five times).</p>
      <p class="small">This code links the glasses to your data. Don't share it.</p>
    </div>`);
  backBtn(el);
  openScreen(el);
}

/* ---------- boot ---------- */
function navTitle(id, right, left) {
  gesture($(id), { moveEl: false, onSwipeRight: right ? () => goPanel(right) : null, onSwipeLeft: left ? () => goPanel(left) : null });
}
async function boot() {
  const t0 = Date.now();
  history.replaceState({ d: 0 }, '');
  try { await loadState(); }
  catch (e) { state = freshState(); toast('Storage is unavailable. Changes will not be kept.'); }

  // Panels, left to right: PROJECT BACKLOG, LIST BACKLOG, TASK BACKLOG, STACK, SETTINGS.
  navTitle('#t-project', null, 'stack');   // end of the row: swiping right does nothing
  navTitle('#t-list', 'project', 'stack');
  navTitle('#t-task', 'list', 'stack');
  navTitle('#t-stack', 'task', 'settings');
  navTitle('#t-settings', 'stack', 'stack');

  const inp = $('#main-input'), sug = $('#suggest'), ps = $('#p-stack');
  inp.addEventListener('focus', () => { ps.classList.add('searching'); showSuggest(); });
  inp.addEventListener('input', showSuggest);
  inp.addEventListener('blur', () => setTimeout(() => { hideSuggest(); ps.classList.remove('searching'); }, 180));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitInput(); } });
  sug.addEventListener('mousedown', e => e.preventDefault());
  sug.addEventListener('click', e => {
    const r = e.target.closest('.sug'); if (!r) return;
    if (r.dataset.new) { const v = inp.value.trim(); inp.blur(); hideSuggest(); openChooser(v); }
    else { const it = state.items[r.dataset.id]; inp.value = ''; inp.blur(); hideSuggest(); if (it) openEditor(it, false); }
  });

  const arrived = runDueCheck();
  renderAll();
  flashArrivals(arrived);
  goPanel('stack', true);

  // Glasses sync
  syncDevice = 'phone';
  syncRev = state.settings.syncRev || 0;
  syncCfg = state.settings.syncDb && state.settings.syncKey ? { db: state.settings.syncDb, key: state.settings.syncKey } : null;
  onSyncAdopt = () => { renderAll(); screens.forEach(sc => sc._refresh && sc._refresh()); processCalQueue(false); };
  syncStart();
  processCalQueue(false);

  setInterval(checkDue, 15000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) flush();
    else { checkDue(); if (syncConfigured()) syncFetch().then(syncReceive).catch(() => {}); }
  });
  window.addEventListener('pagehide', flush);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    // Check for a new version on every open; reload once when it takes over.
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true; flush(); setTimeout(() => location.reload(), 150);
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }

  const sp = $('#splash');
  setTimeout(() => { sp.classList.add('gone'); setTimeout(() => sp.remove(), 500); }, Math.max(0, 1200 - (Date.now() - t0)));
}
boot();

</script>
