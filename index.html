:root {
  --bg: #000000;
  --g: #00ff41;
  --g2: #00c434;
  --dim: #0d6b24;
  --faint: #052e11;
  --hot: #d2ffdc;
  --glow: 0 0 6px rgba(0, 255, 65, .45);
  --font: "Share Tech Mono", "Roboto Mono", "Droid Sans Mono", monospace;
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--g); font-family: var(--font); overscroll-behavior: none; overflow: hidden; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; }
.hidden { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; }
#track { position: absolute; top: 0; left: 0; height: 100%; width: 900%; display: flex; transform: translateX(-66.667%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.panel { position: relative; width: 11.1111%; height: 100%; display: flex; flex-direction: column; padding-top: var(--top); padding-bottom: var(--bot); }

.title { flex: none; padding: 14px 12px 18px; text-align: center; touch-action: pan-y; }
.title h1 { margin: 0; font-family: "OCR-A", var(--font); font-size: clamp(20px, 7vw, 30px); font-weight: 400; letter-spacing: .24em; padding-left: .24em; white-space: nowrap; text-shadow: 0 0 10px rgba(0, 255, 65, .55); }
#t-project h1, #t-list h1, #t-task h1 { font-size: clamp(16px, 5.4vw, 24px); letter-spacing: .14em; padding-left: .14em; }

.list { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 6px 14px; display: flex; flex-direction: column; gap: 5px; overscroll-behavior: contain; }
.list.stack, .list.rev { flex-direction: column-reverse; }
.list.stack > :last-child, .list.rev > :last-child { margin-top: auto; }

.empty { position: absolute; left: 0; right: 0; top: 46%; text-align: center; color: var(--dim); margin: 0; pointer-events: none; font-size: 15px; }

/* Blocks */
.block { flex: none; display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 12px 14px; border: 2px solid var(--g); background: var(--bg); color: var(--g); font-size: 17px; line-height: 1.25; text-shadow: var(--glow); touch-action: pan-y; position: relative; will-change: transform; }
.block .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.block .proj { color: var(--g2); }
.block .meta { flex: none; font-size: 13px; color: var(--g2); }
.block .mark { flex: none; font-size: 18px; }
.block.sel { background: var(--g); color: var(--bg); text-shadow: none; }
.block.sel .proj, .block.sel .meta { color: var(--bg); }
.block.done .name { text-decoration: line-through; color: var(--dim); text-shadow: none; }
.block.ph { border-style: dashed; border-color: var(--dim); background: transparent; }
.block.ph > * { visibility: hidden; }
.block.ghost { position: fixed; z-index: 50; pointer-events: none; box-shadow: 0 0 22px rgba(0, 255, 65, .55); }
.block.small { min-height: 46px; padding: 9px 12px; font-size: 16px; }

#place-zone { flex: none; padding: 0 14px; }
#place-zone:empty { display: none; }
#place-zone .block { box-shadow: 0 0 18px rgba(0, 255, 65, .45); transform: translateY(-2px); }
#place-zone .hint { margin: 8px 0 10px; font-size: 13px; color: var(--g2); text-align: center; }

.flash { animation: flash .9s ease-out 1; }
@keyframes flash { 0% { background: rgba(0, 255, 65, .35); } 100% { background: transparent; } }

#runbar { flex: none; margin: 10px 14px 0; padding: 10px 14px; background: var(--faint); border: 1px solid var(--g); text-align: left; display: flex; justify-content: space-between; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 14px rgba(0, 255, 65, .55); } }

/* Input + suggestions */
.inputbar { flex: none; padding: 10px 14px 0; }
#p-stack.searching #stack-list, #p-stack.searching #stack-empty, #p-stack.searching #runbar { visibility: hidden; }
input[type=text], input[type=number], textarea, select { width: 100%; background: var(--bg); color: var(--g); border: 2px solid var(--dim); padding: 13px 14px; font: inherit; font-size: 17px; caret-color: var(--g); outline: none; border-radius: 0; }
input::placeholder, textarea::placeholder { color: var(--dim); }
input:focus, textarea:focus, select:focus { border-color: var(--g); }
.stackfoot { flex: none; position: relative; }
#suggest { position: absolute; left: 14px; right: 14px; bottom: 100%; max-height: 60vh; overflow-y: auto; background: var(--bg); border: 2px solid var(--g); z-index: 20; }
.sug { display: flex; gap: 12px; align-items: baseline; padding: 13px 14px; border-bottom: 1px solid var(--faint); font-size: 17px; }
.sug:last-child { border-bottom: 0; }
.sug .tag { flex: none; width: 4.5em; font-size: 12px; color: var(--g2); }
.sug.create { color: var(--hot); }

/* Buttons */
.btn { background: var(--bg); border: 2px solid var(--g); color: var(--g); padding: 13px 16px; font-size: 16px; letter-spacing: .12em; text-shadow: var(--glow); cursor: pointer; }
.btn:active { background: var(--faint); }
.btn.primary { background: var(--g); color: var(--bg); text-shadow: none; }
.btn.primary:active { background: var(--g2); }
.btn.quiet { border-color: var(--dim); color: var(--g2); text-shadow: none; }
.btn.danger { border-style: dashed; }
.btn:disabled { opacity: .35; }
.btn.wide { width: 100%; }
.btnrow { display: flex; gap: 8px; }
.btnrow .btn { flex: 1; padding-left: 6px; padding-right: 6px; }
.panel-foot { flex: none; padding: 10px 14px 12px; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

/* Overlay screens */
#overlays > .screen { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: flex; flex-direction: column; padding-top: var(--top); padding-bottom: var(--bot); }
.bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px; min-height: 56px; }
.back { background: none; border: 0; font-size: 30px; line-height: 1; padding: 6px 12px; color: var(--g); cursor: pointer; }
.bar .label { flex: 1; font-size: 13px; color: var(--g2); letter-spacing: .2em; text-align: right; padding-right: 10px; }
.screen .body { flex: 1 1 auto; overflow-y: auto; padding: 0 16px 12px; }
.screen .foot { flex: none; padding: 10px 14px 12px; border-top: 1px solid var(--faint); display: flex; flex-direction: column; gap: 8px; }
.namein { font-size: 24px !important; border-color: transparent !important; border-bottom: 2px solid var(--dim) !important; padding: 8px 2px !important; text-align: center; letter-spacing: .06em; }
.namein:focus { border-bottom-color: var(--g) !important; }
.sect { margin-top: 18px; }
.sect h3 { margin: 0 0 8px; font-size: 13px; font-weight: 400; color: var(--g2); letter-spacing: .18em; }
textarea.notes { min-height: 40vh; resize: none; line-height: 1.45; }

.check { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 17px; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; }
.check .box { width: 22px; height: 22px; border: 2px solid var(--g); flex: none; position: relative; }
.check.on .box { background: var(--g); box-shadow: inset 0 0 0 3px var(--bg); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; background: var(--bg); border: 1px solid var(--dim); color: var(--g2); padding: 10px 6px; font-size: 13px; letter-spacing: .08em; cursor: pointer; }
.seg button.on { background: var(--g); color: var(--bg); border-color: var(--g); }
.inline { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 15px; }
.inline input, .inline select { width: auto; flex: 1; padding: 9px 10px; font-size: 16px; }

/* Editor subtask area */
.editor-list { display: flex; flex-direction: column; min-height: 0; }
.editor-list .list { padding: 6px 0; min-height: 120px; max-height: none; }
.subin { margin-top: 8px; }
.onstack { font-size: 12px; color: var(--g2); }

/* Chooser */
.chooser { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 20px; }
.chooser .q { text-align: center; font-size: 22px; margin-bottom: 18px; overflow-wrap: anywhere; text-shadow: var(--glow); }
.chooser .btn { padding: 20px; font-size: 20px; letter-spacing: .3em; }

/* Month calendar */
.months { flex: 1; overflow-y: auto; padding: 0 12px 20px; }
.month h2 { font-weight: 400; font-size: 17px; letter-spacing: .2em; margin: 22px 4px 10px; color: var(--g); }
.dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow span { text-align: center; font-size: 12px; color: var(--dim); padding-bottom: 4px; }
.days button { aspect-ratio: 1; background: var(--bg); border: 1px solid var(--faint); color: var(--g); font-size: 16px; cursor: pointer; }
.days button.past { color: var(--dim); }
.days button.today { border: 2px solid var(--g); }
.days button.picked { background: var(--g); color: var(--bg); }

/* Day view */
.dayhead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 8px; gap: 10px; }
.dayhead .d { font-size: 17px; letter-spacing: .08em; }
.allday-strip { flex: none; padding: 0 14px 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.allday-strip span { font-size: 12px; border: 1px solid var(--dim); color: var(--g2); padding: 3px 6px; }
.dayscroll { flex: 1; overflow-y: auto; position: relative; overscroll-behavior: contain; }
.grid { position: relative; margin-left: 58px; margin-right: 12px; touch-action: pan-y; }
.slot { height: 32px; border-top: 1px solid var(--faint); }
.slot.hr { border-top-color: #0a4019; }
.hlabel { position: absolute; left: -54px; width: 48px; text-align: right; font-size: 12px; color: var(--dim); transform: translateY(-50%); }
.ev { position: absolute; left: 2px; right: 2px; border: 1px solid var(--dim); background: rgba(0, 255, 65, .07); color: var(--dim); font-size: 12px; padding: 3px 6px; overflow: hidden; pointer-events: none; }
.selblk { position: absolute; left: 0; right: 0; background: rgba(0, 255, 65, .2); border: 2px solid var(--g); color: var(--g); padding: 4px 8px; font-size: 14px; z-index: 3; text-shadow: var(--glow); }
.handle { position: absolute; left: 0; right: 0; bottom: -18px; height: 36px; touch-action: none; display: flex; justify-content: center; align-items: center; }
.handle::after { content: ""; width: 54px; height: 8px; background: var(--g); box-shadow: 0 0 10px rgba(0, 255, 65, .7); }
.nowline { position: absolute; left: -6px; right: 0; height: 2px; background: var(--hot); z-index: 4; pointer-events: none; }
.grid.off { opacity: .25; pointer-events: none; }
.selinfo { font-size: 15px; text-align: center; color: var(--g2); min-height: 1.3em; }

/* START screen */
.start { touch-action: none; }
.stage { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 0; transition: flex .25s; }
.ringwrap { position: relative; width: min(78vw, 330px); aspect-ratio: 1; }
.ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring-track { fill: none; stroke: var(--faint); stroke-width: 12; }
.ring { fill: none; stroke: var(--g); stroke-width: 12; filter: drop-shadow(0 0 8px rgba(0, 255, 65, .8)); }
.ring.over { stroke: var(--hot); }
.pp { position: absolute; left: 50%; top: 50%; width: 34%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--g); background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pp svg { width: 40%; height: 40%; transform: none; fill: var(--g); }
.pp.paused { background: var(--g); }
.pp.paused svg { fill: var(--bg); }
.tname { font-size: 24px; text-align: center; padding: 0 20px; overflow-wrap: anywhere; text-shadow: var(--glow); }
.tclock { font-size: 40px; letter-spacing: .06em; text-shadow: 0 0 12px rgba(0, 255, 65, .6); }
.tclock.over { color: var(--hot); }
.thint { font-size: 14px; color: var(--g2); min-height: 1.3em; text-align: center; padding: 0 20px; }
.linebar { width: calc(100% - 40px); height: 14px; border: 1px solid var(--dim); position: relative; }
.linebar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--g); box-shadow: 0 0 10px rgba(0, 255, 65, .7); }
.linebar.over i { background: var(--hot); }
.drawer { flex: 0 0 auto; height: 0; overflow: hidden; display: flex; flex-direction: column; border-top: 1px solid var(--faint); transition: height .25s; }
.start.open .drawer { height: 58%; }
.start.open .stage { justify-content: flex-start; padding-top: 10px; gap: 12px; }
.drawer .grab { flex: none; height: 26px; display: flex; justify-content: center; align-items: center; }
.drawer .grab::after { content: ""; width: 44px; height: 4px; background: var(--dim); }
.drawer .list { touch-action: pan-y; }
.drawer .notesview { flex: 1; overflow-y: auto; padding: 4px 18px 16px; white-space: pre-wrap; font-size: 16px; line-height: 1.5; -webkit-user-select: text; user-select: text; touch-action: pan-y; }
.swipe-up-hint { font-size: 12px; color: var(--dim); padding-bottom: 10px; text-align: center; }

/* Summary */
.summary { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
.summary .big { font-size: 52px; text-shadow: 0 0 14px rgba(0, 255, 65, .6); }
.summary .nm { font-size: 22px; overflow-wrap: anywhere; }
.summary .sub { color: var(--g2); font-size: 15px; }
a.btn { text-decoration: none; display: inline-block; text-align: center; }

/* Settings */
.settings { flex: 1; overflow-y: auto; padding: 4px 16px 24px; }
.settings .sect { border-top: 1px solid var(--faint); padding-top: 14px; }
.settings p { font-size: 14px; color: var(--g2); line-height: 1.45; margin: 6px 0 10px; }
.settings .btn { margin-top: 8px; }
.status { font-size: 15px; color: var(--g); }

/* Toast + modal */
#toast { position: fixed; left: 14px; right: 14px; top: calc(var(--top) + 82px);   /* just below the progress bar */ z-index: 60; background: var(--bg); border: 2px solid var(--g); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 15px; box-shadow: 0 0 16px rgba(0, 255, 65, .35); }
#toast .act { flex: none; padding: 8px 12px; font-size: 14px; }
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .82); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal .box { width: 100%; max-width: 420px; border: 2px solid var(--g); background: var(--bg); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.modal .msg { font-size: 17px; line-height: 1.4; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* START: list mode row with linear bar */
.minirow { width: calc(100% - 40px); display: flex; align-items: center; gap: 14px; }
.minirow .linebar { flex: 1; width: auto; }
.pp.small { position: static; transform: none; width: 56px; flex: none; }
.start.open .ringwrap { width: min(42vw, 180px); }
.start.open .tclock { font-size: 30px; }
.start.open .tname { font-size: 19px; }
/* Toasts never block swipes: only their button takes touches. */
#toast { pointer-events: none; }
#toast .act { pointer-events: auto; }

/* Splash */
#splash { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
#splash img { width: min(64vw, 320px); height: auto; }
#splash.gone { opacity: 0; pointer-events: none; }

/* FOCUS panel */
.focus-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; touch-action: none; }
.focus-body .stage { padding-top: 10px; }
.focus-block { width: calc(100% - 40px); justify-content: center; text-align: center; font-size: 20px; min-height: 60px; }
.focus-block .name { flex: 0 1 auto; }
.subhint { background: none; border: 0; color: var(--g2); font-size: 15px; letter-spacing: .1em; padding: 8px 16px; display: flex; gap: 14px; align-items: center; cursor: pointer; }
.subhint .tri { font-size: 12px; }
.focus-body.open .drawer { height: 55%; }
.focus-body.open .stage { justify-content: flex-end; padding-bottom: 12px; gap: 12px; }
.focus-body.open .ringwrap { width: min(40vw, 170px); }
.focus-body.open .tclock { font-size: 30px; }
.focus-body.open .focus-block { font-size: 17px; min-height: 50px; }
.focus-body .drawer { border-top: 0; }
.drawer .alldone { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--g2); font-size: 15px; }
.selblk { padding: 1px 8px; font-size: 13px; line-height: 1.15; }
.handle { justify-content: flex-end; padding-right: 18px; }

/* FOCUS layer slides in from the right over the panels */
.focus-layer { position: fixed; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; padding-top: var(--top); padding-bottom: var(--bot); transform: translateX(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.focus-layer.show { transform: translateX(0); }
/* Project subtasks screen */
.projsubs .list { padding-top: 10px; }
.projsubs .title h1 { font-size: clamp(16px, 5.4vw, 24px); letter-spacing: .14em; padding-left: .14em; overflow: hidden; text-overflow: ellipsis; }
.projsubs .foot { border-top: 0; }

/* Hold-selected block: inverse colors, same as BACKLOG selection used to be */
.block.armed { background: var(--g); color: var(--bg); text-shadow: none; }
.block.armed .proj, .block.armed .meta, .block.armed .mark { color: var(--bg); }

/* Edit screen bottom nav */
.edit-title { position: relative; touch-action: none; }
.edit-hint { position: absolute; left: 0; right: 0; top: 2px; font-size: 10px; color: var(--dim); }
.editor .bar { justify-content: flex-end; }

/* Glasses pairing screen: QR stays dark-on-white so the glasses camera can read it */
.pair { text-align: center; }
.pair .qrbox { background: #fff; padding: 14px; width: min(78vw, 320px); margin: 10px auto 18px; }
.pair .qrbox svg { display: block; width: 100%; height: auto; }
.pair p { color: var(--g2); font-size: 15px; line-height: 1.45; margin: 0 0 12px; }
.pair b { color: var(--g); font-weight: 400; }
.pair .small { font-size: 13px; color: var(--dim); }
.pair .btn { margin: 4px 0 10px; }
.pair textarea { font-size: 13px; margin-bottom: 12px; }

/* SCHEDULE panel: today's calendar */
.schedtop { flex: none; padding: 10px 14px 4px; }
.schedtop .btn { display: block; }
#p-schedule .dayhead { padding-top: 6px; }
.btn.small { padding: 8px 12px; font-size: 13px; }
.schednote { flex: none; margin: 0 14px 6px; font-size: 14px; color: var(--g2); min-height: 0; }
.schednote:empty { display: none; }
.ev b { font-weight: 400; color: inherit; opacity: .8; margin-right: 4px; }
.ev.live { border-color: var(--g); color: var(--g); background: rgba(0, 255, 65, .1); font-size: 13px; }
.ev.dim { pointer-events: none; }

/* Scheduling day view */
.daynav { background: none; border: 1px solid var(--dim); color: var(--g); font-size: 22px; line-height: 1; padding: 6px 14px; cursor: pointer; }
.schedpick .dayhead .d { flex: 1; text-align: center; }
.schedpick .selblk { touch-action: none; cursor: grab; }
.schedinfo { flex: none; padding: 8px 14px 0; }
.sched-title, .act-title { touch-action: none; }

/* Activity screen (formerly EDIT): built like STACK */
.activity .bar { justify-content: space-between; padding-left: 16px; padding-right: 12px; }
.activity .bar .label { flex: none; text-align: left; }
.optbtn.on { border-color: var(--g); color: var(--g); }
.optpanel { flex: none; max-height: 50vh; overflow-y: auto; padding: 0 16px 8px; border-bottom: 1px solid var(--faint); }
.actmain { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
.actmain .list { flex: 1 1 auto; }
.actmain textarea.notes { flex: 1; min-height: 0; margin: 10px 14px 0; width: auto; }
.actmain .sect { padding: 0 16px; }
.act-title h1 { overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* SETTINGS screen */
.settingsscreen .settings { padding-top: 14px; }

/* Scheduling: the resize bar hangs just below the block so the block itself stays easy to grab and move */
.schedpick .handle { bottom: -26px; height: 26px; align-items: flex-start; padding-top: 4px; }
.settingsscreen #t-settings { touch-action: none; }

/* Titles at the top (SETTINGS, the activity screen): swipe down on them to return to STACK */
.title.top { padding: 18px 12px 12px; border-bottom: 1px solid var(--faint); touch-action: none; }
.activity .bar { min-height: 46px; padding-top: 6px; }
.actinput { padding-bottom: 12px; }

/* RECOVERY */
.recrow { gap: 10px; }
.recrow .name { font-size: 15px; }
.recrow .btn.small { flex: none; margin: 0; }
#p-recovery .list { flex: none; overflow: visible; padding: 4px 0 12px; }
.rec-summary { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--dim); padding: 12px; font: inherit; font-size: 14px; line-height: 1.45; margin: 0 0 12px; -webkit-user-select: text; user-select: text; }
.settings h3 { margin: 0 0 8px; font-size: 13px; font-weight: 400; color: var(--g2); letter-spacing: .18em; }

/* Today's calendar → STACK prompt (when Google needs a tap to sign in again) */
#calbar { display: block; width: 100%; margin: 0; padding: 13px 14px; background: var(--bg); border: 2px dashed var(--g); color: var(--g); font: inherit; font-size: 14px; letter-spacing: .1em; cursor: pointer; }

/* SCHEDULE: CALENDAR sits just above the name, where STACK has its entry box */
.schedfoot { flex: none; padding: 10px 14px 0; }
.schedfoot .btn { display: block; }

/* Activity screen: entry box and OPTIONS share a row just above the name; OPTIONS opens upward */
.actrow { flex: none; display: flex; gap: 8px; padding: 10px 14px 0; }
.actrow .subin { flex: 1; min-width: 0; }
.actrow .optbtn { flex: none; padding: 0 14px; font-size: 13px; }
.activity .optpanel { border-bottom: 0; border-top: 1px solid var(--faint); padding-top: 10px; max-height: 55vh; }
.activity .optnotes { min-height: 120px; height: 22vh; }
.notesline { flex: none; margin: 10px 16px 0; padding: 8px 10px; border: 1px solid var(--dim); color: var(--g2); font-size: 14px; line-height: 1.4; white-space: pre-wrap; max-height: 22vh; overflow-y: auto; }

/* FOCUS: only the chosen block stays */
.panel.focusmode .empty { display: none; }

/* Lists are two blocks tall, name at the bottom */
.block.tall { align-items: flex-end; }   /* height is set per block: one row per open subtask */

/* A task stuck on STACK for more than 3 days: nudge to break it down */
.block.static { border-style: dashed; animation: static 2.6s ease-in-out infinite; }
.block.static .nudge { color: var(--hot); font-size: 12px; letter-spacing: .04em; }
.block.armed.static .nudge { color: var(--bg); }
@keyframes static { 50% { box-shadow: 0 0 14px rgba(0, 255, 65, .45); border-color: var(--hot); } }

/* Subtask screen: OPTIONS at the top right, notes until subtasks replace them */
.acttop { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 6px; }
.acttop .label { font-size: 13px; color: var(--g2); letter-spacing: .2em; }
.activity .optpanel { border-top: 0; border-bottom: 1px solid var(--faint); max-height: 50vh; }
.actnotes { flex: 1; min-height: 0; margin: 6px 14px 0; width: auto; resize: none; line-height: 1.45; }
.screen.slidein { animation: slidein .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes slidein { from { transform: translateX(100%); } to { transform: translateX(0); } }

/* Scheduling flow: block shows the task; ADD TO CALENDAR sits above SCHEDULE */
.schedpick .selblk { font-size: 15px; display: flex; align-items: flex-end; padding-bottom: 6px; }
.schedpick .dayhead { padding-top: 14px; }

/* The block being dragged is highlighted, like a held block */
.block.ghost.armed { background: var(--g); color: var(--bg); text-shadow: none; }
.block.ghost.armed .proj, .block.ghost.armed .meta, .block.ghost.armed .mark { color: var(--bg); }

/* Day picker: months page left to right */
.mpager { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; touch-action: pan-x; overscroll-behavior: contain; }
.mpager::-webkit-scrollbar { display: none; }
.mpage { flex: 0 0 100%; scroll-snap-align: start; padding: 0 14px; display: flex; flex-direction: column; justify-content: flex-end; }
.mpage h2 { font-weight: 400; font-size: 17px; letter-spacing: .2em; margin: 0 4px 12px; }
.mpage .days button.past { color: var(--faint); border-color: transparent; }
.mpage .days button.picked { background: var(--g); color: var(--bg); }
.daypick .acttop .kind { color: var(--g); font-size: 15px; letter-spacing: .08em; }

/* ===== 2.0: MOMENTUM / TODAY, capacity line, sizes ===== */
.scores { flex: none; display: flex; justify-content: space-between; padding: 12px 18px 6px; font-family: "OCR-A", var(--font); font-size: 13px; letter-spacing: .18em; color: var(--g2); }
.scores b { font-weight: 400; color: var(--g); font-size: 20px; letter-spacing: .05em; margin-left: 6px; text-shadow: var(--glow); }
.stackarea { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; overscroll-behavior: contain; }
.capbox { flex: none; margin-top: auto; border-top: 2px dashed var(--g); position: relative; display: flex; flex-direction: column; }
.capbox::before { content: none; position: absolute; right: 16px; top: -8px; background: var(--bg); padding: 0 6px; font-size: 10px; letter-spacing: .2em; color: var(--dim); }
.capbox .list { flex: 1; overflow: visible; padding: 6px 22px 6px; }
/* Size = rows: dashed lines mark each row inside a block */
.block.sized { align-items: flex-end; background-image: var(--rowlines, none); }
.block .rowline { position: absolute; left: 6px; right: 6px; border-top: 1px dashed var(--dim); pointer-events: none; }
.block.armed .rowline { border-top-color: rgba(0, 0, 0, .35); }
/* The active block (bottom of STACK): triangles pointing at it */
.block.active::before, .block.active::after { content: ""; position: absolute; bottom: 19px; border: 8px solid transparent; }   /* point at the bottom row */
.block.active::before { left: -19px; border-left: 10px solid var(--g); }
.block.active::after { right: -19px; border-right: 10px solid var(--g); }
/* Carry-over: a red version of the green block */
.block.carry { border-color: #ff3b3b; color: #ff5a5a; text-shadow: 0 0 6px rgba(255, 59, 59, .45); }
.block.carry .meta, .block.carry .proj { color: #ff8080; }
.block.carry.armed { background: #ff3b3b; color: var(--bg); text-shadow: none; }
.block.carry.armed .meta, .block.carry.armed .proj { color: var(--bg); }
.block.carry.active::before { border-left-color: #ff3b3b; }
.block.carry.active::after { border-right-color: #ff3b3b; }
.block.carry .rowline { border-top-color: rgba(255, 59, 59, .4); }
/* Size icon in backlogs: a little column of 1-4 squares */
.sz { flex: none; display: inline-flex; flex-direction: column-reverse; gap: 2px; margin-left: 4px; }
.sz i { width: 9px; height: 5px; border: 1px solid var(--dim); }
.sz i.on { background: var(--g); border-color: var(--g); }
.block.armed .sz i.on { background: var(--bg); border-color: var(--bg); }
/* Size picker: drag across four segments */
.sizepick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; touch-action: none; padding: 6px 0; }
.sizepick i { height: 26px; border: 2px dashed var(--dim); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 12px; color: var(--dim); }
.sizepick i.on { border: 2px solid var(--g); background: rgba(0, 255, 65, .18); color: var(--g); }

/* Composer */
.composer .compmain { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 22px 10px; gap: 10px; }
.composer .compblk { min-height: 54px; touch-action: pan-y; }
.compsides { flex: none; display: flex; justify-content: space-between; padding: 6px 22px 0; font-size: 12px; letter-spacing: .15em; color: var(--g2); }
.compsides .blocked { color: #ff6060; }
/* SUPPORT */
.support .supopts { padding: 10px 22px; }
.supopt { min-height: 72px; }
.splitprompt { flex: none; padding: 4px 16px 6px; }
.splitprompt .q { margin: 6px 0; color: var(--g); font-size: 15px; line-height: 1.4; }
.splitprompt .outcome { min-height: 0; height: 64px; }
.actinput .newsize { margin-top: 6px; }
.actinput .newsize .sizepick i { height: 20px; }

/* ===== 2.1 ===== */
/* Progress: done (filled) + still on STACK (outlined), with the capacity marked */
.progress { flex: none; padding: 26px 18px 8px; position: relative; }
.pcall { position: absolute; top: 6px; text-align: center; font-size: 10px; letter-spacing: .14em; color: var(--g2); white-space: nowrap; }
.pcall b { font-weight: 400; color: var(--g); }
.pbar { position: relative; height: 14px; border: 1px solid var(--dim); }
.pbar .pdone { position: absolute; left: 0; top: 0; bottom: 0; background: var(--g); box-shadow: 0 0 10px rgba(0, 255, 65, .5); }
.pbar .pleft { position: absolute; top: 2px; bottom: 2px; border: 1px dashed var(--g2); }
.pbar .pcap { position: absolute; top: -8px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--hot); }
.pnums { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; letter-spacing: .16em; color: var(--g2); }
.pnums b { font-weight: 400; color: var(--g); font-size: 14px; margin-left: 4px; }
/* Difficulty in backlogs: equal squares, side by side */
.sz { flex-direction: row; gap: 3px; align-items: center; }
.sz i { width: 8px; height: 8px; }
/* Completing the active block: it fills left to right, then pops */
#stack-list .block.active { --fill: 0%; }
#stack-list .block.active > .fillbar, #stack-list .block.active::marker { display: none; }
#stack-list .block.active { background-image: linear-gradient(90deg, rgba(0, 255, 65, .35) var(--fill), transparent var(--fill)); }
#stack-list .block.active.carry { background-image: linear-gradient(90deg, rgba(255, 59, 59, .35) var(--fill), transparent var(--fill)); }
#stack-list .block.popping { transition: background-image .2s; animation: pop .38s ease-out forwards; }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.06); box-shadow: 0 0 22px rgba(0, 255, 65, .8); } 100% { transform: scale(1.12); opacity: 0; } }
/* Detail: Difficulty and Project at the top */
.dettop { flex: none; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--faint); }
.diffrow, .switchrow { display: flex; align-items: center; gap: 12px; }
.difflabel { flex: none; font-size: 14px; letter-spacing: .08em; color: var(--g); min-width: 92px; }
.diffrow .sizepick { flex: 1; padding: 0; }
.sizepick i { border-style: solid; }
.switch { position: relative; width: 48px; height: 26px; border: 2px solid var(--g); background: var(--bg); padding: 0; cursor: pointer; }
.switch i { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: var(--dim); transition: transform .15s, background .15s; }
.switch[aria-checked="true"] i { transform: translateX(22px); background: var(--g); }
.renamein { margin: 0 14px; text-align: center; font-family: "OCR-A", var(--font) !important; text-transform: uppercase; letter-spacing: .2em; }
.composer .comppick .diffrow { padding-top: 4px; }

/* ===== 2.2 ===== */
#stack-area > #stack-list { flex: 1 0 auto; overflow: visible; padding: 6px 22px; }
.scores { padding: 14px 18px 8px; }
.capscore { flex: none; padding: 12px 16px 0; font-family: "OCR-A", var(--font); font-size: 13px; letter-spacing: .18em; color: var(--g2); display: flex; align-items: baseline; gap: 10px; }
.capscore b { font-weight: 400; font-size: 22px; color: var(--g); text-shadow: var(--glow); }
.capscore .capnote { font-family: var(--font); font-size: 11px; letter-spacing: .1em; color: var(--dim); }
.sizepick i.on { background: var(--g); border-color: var(--g); }          /* solid, like a highlighted block */
.switch { width: 64px; height: 30px; touch-action: none; }
.switch i { top: 4px; left: 4px; width: 18px; height: 18px; }
.switch[aria-checked="true"] i { transform: translateX(34px); }
#toast { top: calc(var(--top) + 52px); }

/* ===== 3.0 ===== */
/* Task names centered everywhere; MOMENTUM centered */
.block { justify-content: center; }
.block .name { flex: 0 1 auto; text-align: center; }
.block .meta, .block .sz, .block .mark { position: absolute; right: 12px; }
.block.sized .meta { bottom: 16px; }
.block .meta + .meta { right: 46px; }
.scores { justify-content: center; touch-action: pan-y; }
/* Repeat detected: yellow caution signs on both sides of the name */
.block .warn { color: #ffd23f; text-shadow: 0 0 6px rgba(255, 210, 63, .6); font-size: 18px; flex: none; margin: 0 6px; }
.block.armed .warn { color: var(--bg); text-shadow: none; }
/* FOCUS and SUPPORT screens */
.focusbody, .supportbody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.focusbody .timerbtn { flex: none; margin: 12px 14px 0; width: auto; }
.focusbody .timerbtn.running { background: var(--g); color: var(--bg); text-shadow: none; }
.focusbody .dettop { border-bottom: 1px solid var(--faint); }
.focusbody .actmain { flex: 1 1 auto; }
.supportbody { padding: 12px 16px; gap: 14px; overflow-y: auto; }
.supportbody .supname { margin: 0; text-align: center; font-size: 18px; text-shadow: var(--glow); }
.supportbody .q { display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: var(--g); line-height: 1.4; }
.supportbody textarea { min-height: 90px; resize: none; }
/* REPEAT DETECTED / BUILD SYSTEM */
.repmain { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 16px; }
.reptxt { margin: 0 0 8px; text-align: center; color: var(--g2); font-size: 15px; line-height: 1.4; }
/* HISTORY */
.histpager .mpage { justify-content: flex-start; padding-top: 14px; }
.hdays { gap: 4px; }
.hday { aspect-ratio: 1; border: 1px solid var(--faint); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hday i { font-style: normal; font-size: 10px; color: var(--dim); }
.hday b { font-weight: 400; font-size: 16px; color: var(--g); }
.hday.has { border-color: var(--dim); }
.hday.today { border: 2px solid var(--g); }
/* GRAPH */
.graphwrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
.graph { width: 100%; height: auto; }
.graph .axis { stroke: var(--dim); stroke-width: 1; }
.graph .line { fill: none; stroke: var(--g); stroke-width: 2; filter: drop-shadow(0 0 4px rgba(0, 255, 65, .7)); }
.graph .dot { fill: var(--g); }
.graph .lbl { fill: var(--g2); font-size: 10px; font-family: var(--font); }
.screen.slideinleft { animation: slideinleft .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes slideinleft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
/* Long names at the bottom shrink to fit */
.repeatscreen .title h1, .buildsys .title h1 { font-size: clamp(16px, 5.4vw, 24px); letter-spacing: .14em; padding-left: .14em; }
#t-focus h1, .act-title h1 { font-size: clamp(16px, 6vw, 30px); overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

</style>

<script>

/* Paradigm: state, persistence and model rules */
'use strict';

const MIN = 60000, HALF = 30 * MIN, DAY = 24 * 60 * MIN;
let state = null;
let idb = null;

/* ---------- small helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
function dateStr(d) { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

/* ---------- persistence (IndexedDB) ---------- */
function idbOpen() {

    const r = indexedDB.open('paradigm', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbGet(k) {

    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
function idbSet(k, v) {

    t.objectStore('kv').put(v, k);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

function freshState() {
  return {
    v: 4, items: {}, blocks: {}, stack: [], backlogs: { project: [], list: [], task: [] }, running: null,
    lastDueCheck: todayStr(),
    calQueue: [],   // schedules made on the glasses, waiting for the phone to add them to Google Calendar
    dayCache: null, // today's calendar as last loaded by the phone, for the glasses' SCHEDULE screen
    calImportDate: '', // the day today's calendar events were last added to STACK
    score: { momentum: 8, today: 0, date: todayStr() },   // MOMENTUM is also STACK's capacity, in rows
    settings: { clientId: '', connected: false, paradigmCalId: '', driveFileId: '', lastBackup: 0 },
    auth: { token: '', exp: 0 }

}
function normalize(s) {
  const f = freshState();
  // v1 -> v2: one backlog becomes three; the placement queue goes to the top of STACK.
  if (!s.backlogs) {
    s.backlogs = { project: [], list: [], task: [] };
    (s.backlog || []).forEach(bid => { const k = blockKind(bid, s); if (k) s.backlogs[k].push(bid); });
  }
  if (Array.isArray(s.placing)) { s.stack = (s.stack || []).concat(s.placing); }
  delete s.backlog; delete s.placing;
  // v3: PROJECT BACKLOG holds projects (item ids), not subtask blocks.
  if ((s.v || 1) < 3) { s.backlogs.project = []; s.v = 3; }
  // v4: no FOCUS timer. Anything mid-session goes back to the bottom of STACK.
  if (s.running) { s.stack = [s.running.bid].concat((s.stack || []).filter(b => b !== s.running.bid)); s.running = null; }
  // v5 (2.0): sizes, MOMENTUM/TODAY, no recurring inside Paradigm (repeats live in Google Calendar).
  for (const it of Object.values(s.items || {})) {
    if (it.type !== 'event' && !(it.size >= 1 && it.size <= 4)) it.size = 1;
    if (it.recurring) { it.recurring = false; it.recSubtasks = false; }
    if (it.type === 'project') (it.subtasks || []).forEach(x => { if (!(x.size >= 1 && x.size <= 4)) x.size = 1; });
  }
  s.v = 5;
  for (const k of Object.keys(f)) if (s[k] === undefined) s[k] = f[k];
  s.settings = Object.assign(f.settings, s.settings || {});
  for (const it of Object.values(s.items || {})) if (it.type === 'task' && !Array.isArray(it.subtasks)) it.subtasks = [];   // v1.11: tasks hold subtasks
  s.auth = Object.assign(f.auth, s.auth || {});
  s.score = Object.assign({ momentum: 8, today: 0, date: todayStr() }, s.score || {});
  return s;
}

let saveTimer = null;
function save(opts) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 200);
  if (!(opts && opts.noBackup) && typeof scheduleBackup === 'function') scheduleBackup();
  if (!(opts && opts.noSync) && typeof scheduleSync === 'function') scheduleSync();
}
function flush() { clearTimeout(saveTimer); if (idb && state) return idbSet('state', state).catch(e => console.error(e)); }

async function loadState() {
  idb = await idbOpen();
  const s = await idbGet('state');
  state = normalize(s || freshState());
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  repair();
}

/* Keep lists consistent: drop dead blocks, rescue orphans into the backlog. */
function repair() {
  const seen = new Set();
  const clean = arr => arr.filter(b => {
    const ok = state.blocks[b] && state.items[state.blocks[b].itemId] && !seen.has(b);
    if (ok) seen.add(b); return ok;
  });
  if (state.running && !(state.blocks[state.running.bid] && state.items[state.blocks[state.running.bid].itemId])) state.running = null;
  if (state.running) seen.add(state.running.bid);
  state.stack = clean(state.stack);
  for (const k of BLOCK_KINDS) state.backlogs[k] = clean(state.backlogs[k] || []);
  // PROJECT BACKLOG lists every project, by item id.
  const pseen = new Set();
  state.backlogs.project = (state.backlogs.project || []).filter(id => state.items[id] && state.items[id].type === 'project' && !pseen.has(id) && pseen.add(id));
  for (const it of Object.values(state.items)) if (it.type === 'project' && !pseen.has(it.id)) state.backlogs.project.push(it.id);
  for (const [bid, b] of Object.entries(state.blocks)) {
    const it = state.items[b.itemId];
    if (!it || (b.subId && !(it.subtasks || []).some(s => s.id === b.subId))) { delete state.blocks[bid]; continue; }
    if (seen.has(bid)) continue;
    if (b.subId) delete state.blocks[bid];   // a loose subtask simply returns to its project
    else state.backlogs[blockKind(bid)].push(bid);
  }
  // Every task and list that isn't on STACK or in FOCUS lives in its backlog, recurring ones included.
  for (const it of Object.values(state.items)) placeInBacklog(it.id);
}

/* ---------- model queries ---------- */
const TYPES = { task: 'TASK', list: 'LIST', event: 'EVENT', project: 'PROJECT' };
const KINDS = ['project', 'list', 'task'];
const BLOCK_KINDS = ['list', 'task'];
const BACKLOG_TITLE = { project: 'PROJECT BACKLOG', list: 'LIST BACKLOG', task: 'TASK BACKLOG' };
/* Which backlog a block belongs to: project subtasks -> project, otherwise the item's type. */
function blockKind(bid, s) {
  s = s || state;
  const b = s.blocks[bid]; if (!b) return null;
  if (b.subId) return 'project';
  const it = s.items[b.itemId]; if (!it) return null;
  return it.type === 'list' ? 'list' : 'task';
}
function inBacklog(bid) { return BLOCK_KINDS.some(k => state.backlogs[k].includes(bid)); }
function itemByName(name) {
  const n = name.trim().toLowerCase();
  return Object.values(state.items).find(i => i.name.trim().toLowerCase() === n) || null;
}
function findBlock(itemId, subId) {
  return Object.keys(state.blocks).find(b => state.blocks[b].itemId === itemId && (state.blocks[b].subId || null) === (subId || null)) || null;
}
function whereBlock(bid) {

  if (state.stack.includes(bid)) return 'stack';
  if (inBacklog(bid)) return 'backlog';
  return null;
}
function detach(bid) {
  state.stack = state.stack.filter(b => b !== bid);
  for (const k of BLOCK_KINDS) state.backlogs[k] = state.backlogs[k].filter(b => b !== bid);
}
function removeBlock(bid) {
  detach(bid);
  if (state.running && state.running.bid === bid) state.running = null;
  delete state.blocks[bid];
}
function blockLabel(bid) {
  const b = state.blocks[bid], it = state.items[b.itemId];
  if (b.subId) { const s = it.subtasks.find(x => x.id === b.subId); return { proj: it.name, name: s ? s.name : '?' }; }
  return { proj: null, name: it.name };
}
function blockName(bid) { const l = blockLabel(bid); return l.proj ? `${l.proj}: ${l.name}` : l.name; }

function newItem(type, name) {
  const it = { id: uid(), type, name: name.trim(), created: Date.now(), size: 1 };
  if (type === 'task') Object.assign(it, { notes: '', subtasks: [], recurring: false, schedule: { freq: 'none' } });
  if (type === 'list') Object.assign(it, { subtasks: [], recurring: false, recSubtasks: false, schedule: { freq: 'none' } });
  if (type === 'project') Object.assign(it, { subtasks: [], recurring: false });
  if (type === 'event') Object.assign(it, { event: null });
  return it;
}
function deleteItem(id) {
  for (const bid of Object.keys(state.blocks)) if (state.blocks[bid].itemId === id) removeBlock(bid);
  delete state.items[id];
  state.backlogs.project = state.backlogs.project.filter(x => x !== id);
}
/* Puts a task or list with no block anywhere onto the top (lowest priority) of its backlog. */
function placeInBacklog(itemId) {
  const it = state.items[itemId];
  if (!it || (it.type !== 'task' && it.type !== 'list') || findBlock(itemId, null)) return false;
  const bid = uid();
  state.blocks[bid] = { bid, itemId, subId: null, elapsed: 0 };
  state.backlogs[it.type].push(bid);
  return true;
}
/* Changing what an item is:
   task -> list when it gets its first subtask (OPTIONS keeps it a list from then on);
   task or list -> project (OPTIONS → Project): it leaves STACK and its backlog and lives in PROJECT BACKLOG;
   project -> list (or task, with no subtasks) when Project is unchecked. */
function convertItem(id, toType) {
  const it = state.items[id]; if (!it || it.type === toType) return;
  const from = it.type;

    it.type = 'project'; it.subtasks = it.subtasks || [];

    return;
  }

    for (const bid of Object.keys(state.blocks)) if (state.blocks[bid].itemId === id && state.blocks[bid].subId) removeBlock(bid);
    state.backlogs.project = state.backlogs.project.filter(x => x !== id);
  }
  it.type = toType;
  Object.assign(it, { subtasks: it.subtasks || [], recurring: !!it.recurring, schedule: it.schedule || { freq: 'none' } });

  const bid = findBlock(id, null);

/* A list with nothing left to do turns back into a task (and moves back to TASK BACKLOG if it's there).

function listIsEmpty(it) {

}

  if (!listIsEmpty(it)) return false;
  it.subtasks = [];
  convertItem(id, 'task');
  return true;
}
/* ---------- size and capacity ----------
   Size (1-4) is how much a block weighs: its height in rows on STACK and its points when completed.
   Project subtasks have their own size; list subtasks don't. STACK holds at most MOMENTUM rows. */
function clampSize(n) { return Math.max(1, Math.min(4, Math.round(Number(n) || 1))); }
function blockSize(bid) {
  const b = state.blocks[bid]; if (!b) return 1;
  const it = state.items[b.itemId]; if (!it) return 1;
  if (b.subId) { const x = (it.subtasks || []).find(y => y.id === b.subId); return clampSize(x && x.size); }

function stackLoad() { return state.stack.reduce((n, bid) => n + blockSize(bid), 0); }
/* CAPACITY: the average MOMENTUM of the last CAP_WEEKS days that fell on today's weekday (e.g. past Tuesdays on a
   Tuesday), rounded down. With no matching day yet, the last CAP_DAYS days you used Paradigm; with no history at all,
   the RESET baseline (8 by default). RESET only restarts the count from that day; HISTORY is kept. */
const CAP_WEEKS = 4, CAP_DAYS = 7;
function capacity(forDate) {
  const day = forDate || todayStr(), wd = parseDate(day).getDay();
  const h = (state.score.history || []).filter(d => d.date < day && (!state.score.capFrom || d.date >= state.score.capFrom));
  const avg = list => Math.max(1, Math.floor(list.reduce((n, d) => n + d.done, 0) / list.length));
  const same = h.filter(d => parseDate(d.date).getDay() === wd).slice(-CAP_WEEKS);
  if (same.length) return avg(same);

function fits(rows) { return stackLoad() + rows <= capacity(); }
const NO_ROOM = 'STACK is at capacity (see SCHEDULE)';

/* MOMENTUM (score.today) adds the difficulty of what you complete; it starts at 0 each day. */
function addPoints(n) {
  const sc = state.score;
  if (sc.date !== todayStr()) dayRollover();
  sc.today += n;
  if (sc.today > sc.momentum) sc.momentum = sc.today;
}
/* A new day: everything still on STACK carries over and turns red (MOMENTUM is untouched).
   Red blocks can only be completed, or go through SUPPORT. Returns how many carried over. */
function dayRollover() {
  const today = todayStr(), sc = state.score;
  if (sc.date >= today) return 0;
  let carried = 0, penalty = 0;
  for (const bid of state.stack) {
    const b = state.blocks[bid]; if (!b) continue;
    carried++; penalty += blockSize(bid);
    countRepeat(bid);                 // still on STACK at midnight: it counts again
    delete b.at; delete b.atDone;     // yesterday's time placement is over
  }
  // The day that just ended loses the difficulty it carried over (never below 0), then goes into the capacity average.
  const ended = Math.max(0, (sc.today || 0) - penalty);

function isCarried() { return false; }   // red carry-over is gone (3.0): repeats and the midnight penalty replace it

function listProject(id) { if (!state.backlogs.project.includes(id)) state.backlogs.project.push(id); }

/* Adds an item (or project subtask) to STACK. where: 'top' (lowest priority, from a backlog)
   or 'bottom' (highest priority, new from the STACK input). Returns a message or null. */
function addToStack(itemId, subId, where) {
  let bid = findBlock(itemId, subId);
  const w = bid && whereBlock(bid);
  if (w === 'stack') return 'Already on STACK';
  const it = state.items[itemId];
  const size = subId ? clampSize(((it && it.subtasks) || []).find(x => x.id === subId)?.size) : clampSize(it && it.size);
  if (!fits(size)) return NO_ROOM;
  if (w === 'backlog') detach(bid);
  if (!bid) { bid = uid(); state.blocks[bid] = { bid, itemId, subId: subId || null, elapsed: 0 }; }
  delete state.blocks[bid].carried;
  if (where === 'bottom') state.stack.unshift(bid); else state.stack.push(bid);
  countRepeat(bid);
  return null;
}

/* ---------- repeats ----------
   Every time a task lands on STACK counts once, and every midnight it's still there counts again.
   At REPEAT_AT or more it gets caution signs; REQUIRES SUPPORT or REQUIRES SYSTEM resets the count. */
const REPEAT_AT = 3;
function repeatTarget(bid) {
  const b = state.blocks[bid]; if (!b) return null;
  const it = state.items[b.itemId]; if (!it) return null;
  return b.subId ? (it.subtasks || []).find(x => x.id === b.subId) || null : it;
}
function countRepeat(bid) { const t = repeatTarget(bid); if (t) t.repeats = (t.repeats || 0) + 1; }
function isCaution(bid) { const t = repeatTarget(bid); return !!(t && (t.repeats || 0) >= REPEAT_AT); }
function clearRepeats(bid) { const t = repeatTarget(bid); if (t) t.repeats = 0; }

/* ---------- placed at a time today ----------
   A block placed on today's SCHEDULE stays on STACK; when its time comes it moves to the bottom (active). */
function dueTimed() {
  const now = Date.now(), moved = [];
  for (const bid of state.stack.slice()) {
    const b = state.blocks[bid];
    if (b && b.at && b.at <= now && !b.atDone) {
      b.atDone = true;
      state.stack = [bid].concat(state.stack.filter(x => x !== bid));
      moved.push(bid);
    }
  }
  return moved;
}
/* Deletes what a block stands for: the task or list, or just the subtask for a project subtask. */
function deleteBlockItem(bid) {
  const b = state.blocks[bid]; if (!b) return;
  if (b.subId) {
    const it = state.items[b.itemId];
    if (it) it.subtasks = it.subtasks.filter(s => s.id !== b.subId);
    removeBlock(bid);
  } else deleteItem(b.itemId);
}
/* ---------- scheduling an item to another day ----------
   It becomes an all-day event on the Paradigm calendar and leaves STACK / its backlog. Its subtasks and notes
   travel with the event (readable checklist + a hidden copy) and come back when that day's calendar is pulled in.
   A project subtask leaves its project and returns as its own task. */
function defaultSchedule(freq) { const d = new Date(); return { freq, days: [d.getDay()], dom: d.getDate(), month: d.getMonth() }; }

const RRULE_DAYS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
function rruleFor(sch) {

  if (sch.freq === 'monthly') return 'FREQ=MONTHLY;BYMONTHDAY=' + (sch.dom || new Date().getDate());
  if (sch.freq === 'annually') return `FREQ=YEARLY;BYMONTH=${(sch.month ?? new Date().getMonth()) + 1};BYMONTHDAY=${sch.dom || new Date().getDate()}`;
  return null;
}
/* Removes the item (or project subtask) and queues its all-day event. Returns the queue entry. */
function scheduleBlockToDay(bid, date, rrule) {
  const b = state.blocks[bid]; if (!b) return null;
  const it = state.items[b.itemId]; if (!it) return null;
  let entry;
  if (b.subId) {
    const sub = (it.subtasks || []).find(x => x.id === b.subId);
    entry = { id: uid(), kind: 'allday', date, name: sub ? sub.name : '?', rrule: null, payload: { type: 'task', subtasks: [], notes: '', size: clampSize(sub && sub.size) } };
    it.subtasks = (it.subtasks || []).filter(x => x.id !== b.subId);
    removeBlock(bid);
  } else {
    const open = (it.subtasks || []).filter(x => !x.done).map(x => x.name);
    entry = { id: uid(), kind: 'allday', date, name: it.name, rrule: null,
      payload: { type: open.length ? 'list' : 'task', subtasks: open, notes: it.notes || '', size: clampSize(it.size) } };
    deleteItem(it.id);
  }
  if (rrule) entry.rrule = rrule;
  entry.at = Date.now();   // posted after the undo window (see processCalQueue)
  state.calQueue.push(entry);
  return entry;
}

/* Sends a block to the bottom (highest priority) of its backlog. Project subtasks return to their project. */
function sendToBacklog(bid) {
  if (state.blocks[bid].subId) { removeBlock(bid); return; }
  detach(bid);
  state.backlogs[blockKind(bid)].unshift(bid);
}

/* Repeating things now live in Google Calendar (they arrive with the daily import). */
function runDueCheck() { state.lastDueCheck = todayStr(); return []; }

/* ---------- completion ---------- */
/* Completes a block: it leaves STACK, nothing goes on the calendar, and TODAY gains its size. Returns { name, size }. */
function completeBlock(bid) {
  const b = state.blocks[bid]; if (!b) return null;
  const it = state.items[b.itemId];
  const res = { name: blockName(bid), size: blockSize(bid) };
  if (b.subId) it.subtasks = it.subtasks.filter(x => x.id !== b.subId);
  else delete state.items[it.id];
  removeBlock(bid);
  addPoints(res.size);
  save();
  return res;
}
/* SUPPORT's answer is always the same: split it. The original becomes a project (PROJECT BACKLOG) and the
   pieces ("Original: Piece", each with a size) take its place on STACK, as many as fit; the rest wait in the
   project. From a backlog, the pieces simply stay in the project. Returns how many went on STACK. */
function splitIntoProject(bid, pieces, notes) {
  const b = state.blocks[bid]; if (!b) return 0;
  let it = state.items[b.itemId]; if (!it) return 0;
  const pos = state.stack.indexOf(bid);
  const fresh = pieces.map(p => ({ id: uid(), name: p.name, done: false, size: clampSize(p.size) }));
  if (b.subId) {
    // A project subtask: its pieces replace it inside the same project.
    const i = it.subtasks.findIndex(x => x.id === b.subId);
    it.subtasks.splice(Math.max(0, i), i >= 0 ? 1 : 0, ...fresh);
  } else {
    const old = (it.subtasks || []).filter(x => !x.done).map(x => ({ id: x.id, name: x.name, done: false, size: 1 }));
    it.type = 'project'; it.subtasks = fresh.concat(old);
    if (notes) it.notes = (it.notes ? it.notes + '\n' : '') + notes;
    delete it.recurring; delete it.recSubtasks; delete it.schedule;
  }
  removeBlock(bid);
  listProject(it.id);
  let placed = 0;
  if (pos >= 0) {
    let at = pos;
    for (const p of fresh) {
      if (!fits(p.size)) break;
      const nb = uid(); state.blocks[nb] = { bid: nb, itemId: it.id, subId: p.id, elapsed: 0 };
      state.stack.splice(at++, 0, nb); placed++;
    }
  }
  return placed;
}

/* Paradigm: touch gestures.
   hold ~300ms = pick up and drag; quick horizontal flick = swipe; vertical flick = scroll (or swipe up/down where enabled). */
'use strict';

const HOLD_MS = 300, SLOP = 10, SWIPE_DIST = 80;

function gesture(el, o) {
  let st = null;
  const hasH = () => !!(o.onSwipeLeft || o.onSwipeRight);
  const hasV = () => !!(o.onSwipeUp || o.onSwipeDown);
  // moveEl: false (nothing moves), an element, or a function(direction) picking one at swipe time.
  let lastDir = 0, moved = null;
  const mover = dir => o.moveEl === false ? null : typeof o.moveEl === 'function' ? o.moveEl(dir) : (o.moveEl || el);

  el.addEventListener('touchstart', e => {
    if (e.touches.length > 1) { cancel(); return; }
    if (o.ignore && o.ignore(e.target)) { st = null; return; }
    const en = !o.enabled || o.enabled();
    const t = e.touches[0];
    st = { x: t.clientX, y: t.clientY, t: Date.now(), mode: null, dx: 0, dy: 0, tapOnly: !en };
    if (o.onHoldStart && en) {
      st.timer = setTimeout(() => {
        if (st && !st.mode) {
          st.mode = 'hold';
          if (navigator.vibrate) navigator.vibrate(12);
          o.onHoldStart(st.x, st.y);
        }
      }, HOLD_MS);
    }
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!st) return;
    const t = e.touches[0];
    const dx = t.clientX - st.x, dy = t.clientY - st.y;
    st.dx = dx; st.dy = dy; st.cx = t.clientX; st.cy = t.clientY;
    if (st.mode === 'hold') { if (e.cancelable) e.preventDefault(); o.onHoldMove && o.onHoldMove(t.clientX, t.clientY); return; }
    if (!st.mode) {
      if (Math.abs(dx) < SLOP && Math.abs(dy) < SLOP) return;
      clearTimeout(st.timer);
      if (st.tapOnly) st.mode = 'scroll';
      else if (Math.abs(dx) > Math.abs(dy) && hasH()) st.mode = 'h';
      else if (Math.abs(dy) >= Math.abs(dx) && hasV()) st.mode = 'v';
      else st.mode = 'scroll';
    }
    if (st.mode === 'h') {
      if (e.cancelable) e.preventDefault();
      // Directions that do nothing don't move the block.
      let x = dx;
      if (x < 0 && o.allowLeft && !o.allowLeft()) x = 0;
      if (x > 0 && o.allowRight && !o.allowRight()) x = 0;
      lastDir = Math.sign(dx);
      const m = mover(lastDir);
      if (moved && moved !== m) { moved.style.transition = 'none'; moved.style.transform = ''; }   // direction flipped mid-swipe
      moved = m;
      if (m) { m.style.transition = 'none'; m.style.transform = `translateX(${x}px)`; }
      if (o.onDrag) o.onDrag(dx);
    } else if (st.mode === 'v') {
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });

  function snapBack() {
    if (o.onDrag) o.onDrag(0);
    const m = moved || mover(lastDir); moved = null; if (!m) return;
    m.style.transition = 'transform .18s ease-out'; m.style.transform = '';
  }
  function fly(dir, cb) {
    const m = mover(dir); moved = null;
    if (!m || o.noFly) { if (m) { m.style.transition = ''; m.style.transform = ''; } cb(); return; }
    // Something sliding in on top (o.holdAfter) needs time to cover the screen before what flew out comes back.
    const hold = typeof o.holdAfter === 'function' ? o.holdAfter(dir) : 0;
    m.style.transition = 'transform .15s ease-in';
    m.style.transform = `translateX(${dir * window.innerWidth}px)`;
    setTimeout(() => {
      cb();
      setTimeout(() => requestAnimationFrame(() => { if (m.isConnected) { m.style.transition = 'none'; m.style.transform = ''; } }), hold);
    }, 150);
  }
  function cancel() {
    if (!st) return;
    clearTimeout(st.timer);
    if (st.mode === 'hold') o.onHoldEnd && o.onHoldEnd(true);
    if (st.mode === 'h') snapBack();
    st = null;
  }

  el.addEventListener('touchend', e => {
    if (!st) return;
    clearTimeout(st.timer);
    const s = st; st = null;
    if (s.mode === 'hold') { o.onHoldEnd && o.onHoldEnd(false); return; }
    if (s.mode === 'h') {
      const fast = Math.abs(s.dx) > 40 && Date.now() - s.t < 260;
      if (Math.abs(s.dx) > SWIPE_DIST || fast) {
        if (s.dx > 0 && o.onSwipeRight && !(o.allowRight && !o.allowRight())) return fly(1, o.onSwipeRight);
        if (s.dx < 0 && o.onSwipeLeft && !(o.allowLeft && !o.allowLeft())) return fly(-1, o.onSwipeLeft);
      }
      snapBack(); return;
    }
    if (s.mode === 'v') {
      const dist = o.vDist || 60;   // labels at the screen's bottom edge use a shorter swipe down
      if (s.dy < -dist && o.onSwipeUp) o.onSwipeUp();
      else if (s.dy > Math.min(dist, o.downDist || dist) && o.onSwipeDown) o.onSwipeDown();
      return;
    }
    if (!s.mode && Date.now() - s.t < 450 && o.onTap) { o.onTap(e); }
  });
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());

  // Mouse fallback for desktop testing: click = tap.
  if (o.onTap) el.addEventListener('click', e => { if (!('ontouchstart' in window)) o.onTap(e); });
}

/* ---------- drag-to-sort ----------
   listEl: container of .block children. reverse: true when the list is column-reverse (index 0 at the bottom).
   srcEl: the element being dragged (already in listEl), or a detached element when placing a new block. */
let dragCtx = null;
function beginDrag({ listEl, srcEl, x, y, reverse, external }) {
  const r = srcEl.getBoundingClientRect();
  const ghost = srcEl.cloneNode(true);
  ghost.classList.add('ghost', 'armed');   // the block being moved shows highlighted
  ghost.classList.remove('ph');
  ghost.style.width = r.width + 'px';
  ghost.style.left = r.left + 'px';
  const offY = y - r.top;
  ghost.style.top = (y - offY) + 'px';
  document.getElementById('ghost-layer').appendChild(ghost);

  let ph = srcEl;
  if (external) { ph = document.createElement('div'); ph.className = 'block ph'; ph.innerHTML = srcEl.innerHTML; listEl.appendChild(ph); }
  ph.classList.add('ph');

  let scrollTimer = null, lastY = y;
  function place(cy) {
    const sibs = [...listEl.children].filter(c => c !== ph && c.classList.contains('block'));
    let idx = 0;
    for (const s of sibs) {
      const b = s.getBoundingClientRect(), mid = b.top + b.height / 2;
      if (reverse ? mid > cy : mid < cy) idx++;
    }
    const ref = sibs[idx] || null;
    if (ref) { if (ph.nextSibling !== ref) listEl.insertBefore(ph, ref); }
    else if (listEl.lastElementChild !== ph) listEl.appendChild(ph);
  }
  function autoscroll() {
    const lr = listEl.getBoundingClientRect();
    let v = 0;
    if (lastY < lr.top + 50) v = -12; else if (lastY > lr.bottom - 50) v = 12;
    if (v) { listEl.scrollTop += v; place(lastY); }
  }
  scrollTimer = setInterval(autoscroll, 30);
  place(y);

  dragCtx = {
    move(cx, cy) { lastY = cy; ghost.style.top = (cy - offY) + 'px'; place(cy); },
    end() {
      clearInterval(scrollTimer);
      ghost.remove();
      const idx = [...listEl.children].filter(c => c.classList.contains('block')).indexOf(ph);
      if (external) ph.remove(); else ph.classList.remove('ph');
      dragCtx = null;
      return idx;
    }
  };
  return dragCtx;
}

/* ---------- hold-to-select ----------
   Hold a block and let go: it turns inverse (selected) = FOCUS. Swipe it right to schedule, left to delete.
   Touching anywhere else clears it, except elements marked data-keeparm (the bottom labels).
   Touching anywhere else clears the selection. Hold and drag still reorders. */
let armed = null;
function arm(el) { disarm(); armed = el; el.classList.add('armed'); if (typeof onArmChange === 'function') onArmChange(el); }
function disarm() { if (armed) { armed.classList.remove('armed'); armed = null; if (typeof onArmChange === 'function') onArmChange(null); } }
function isArmed(el) { return armed === el && el.isConnected; }
document.addEventListener('touchstart', e => {
  if (!armed || (armed.isConnected && armed.contains(e.target))) return;
  if (e.target.closest && (e.target.closest('[data-keeparm]') || e.target.closest('.panel.focusmode'))) return;   // FOCUS ends by tapping the block itself
  disarm();
}, { capture: true, passive: true });

/* Wires a rendered list: each child .block with data-key gets swipe/hold/tap per opts.
   opts: { reverse, onReorder(newKeys), swipeRight(key), swipeLeft(key), tap(key), enabled(),
           armable(key) -> bool, openEdit(key), armDelete(key) } */
function wireList(listEl, opts) {
  [...listEl.children].forEach(el => {
    if (!el.classList.contains('block')) return;
    const key = el.dataset.key;
    const canArm = !!(opts.armable && opts.armable(key));   // highlighting may have no block swipes (its actions live on the title)
    let drag = null, hold = null;
    gesture(el, {
      enabled: opts.enabled,
      // FOCUS: swiping left slides the whole screen (to its subtask screen); swiping right moves only the block (to scheduling).
      // opts.moves(key, dir, armed) → false when nothing should slide (e.g. the active block fills instead)
      moveEl: dir => (opts.moves && opts.moves(key, dir, isArmed(el)) === false) ? null : el,
      onDrag: opts.drag ? dx => opts.drag(key, dx, el, isArmed(el)) : null,
      onSwipeRight: (opts.swipeRight || canArm) ? () => {
        if (isArmed(el)) { if (opts.openEdit) { disarm(); opts.openEdit(key); } return; }
        if (opts.swipeRight) opts.swipeRight(key);
      } : null,
      // A highlighted block only moves where it has highlighted actions; otherwise the plain swipes apply.
      allowLeft: () => isArmed(el) ? !!opts.armDelete : !!opts.swipeLeft,
      allowRight: () => isArmed(el) ? !!opts.openEdit : !!opts.swipeRight,
      onSwipeLeft: (opts.swipeLeft || (canArm && opts.armDelete)) ? () => {
        if (isArmed(el)) { if (opts.armDelete) { disarm(); opts.armDelete(key); } return; }
        if (opts.swipeLeft) opts.swipeLeft(key);
      } : null,
      onTap: () => {
        if (isArmed(el)) { disarm(); return; }
        if (opts.tap) opts.tap(key);
      },
      onHoldStart: (opts.onReorder || canArm) ? (x, y) => { hold = { x, y }; } : null,
      onHoldMove: (x, y) => {
        if (!drag && hold && opts.onReorder && (Math.abs(y - hold.y) > 8 || Math.abs(x - hold.x) > 8)) {
          if (isArmed(el)) disarm();
          drag = beginDrag({ listEl, srcEl: el, x: hold.x, y: hold.y, reverse: opts.reverse });
        }
        if (drag) drag.move(x, y);
      },
      onHoldEnd: cancelled => {
        const was = hold; hold = null;
        if (drag) {
          drag.end(); drag = null;
          const keys = [...listEl.children].filter(c => c.classList.contains('block')).map(c => c.dataset.key);
          opts.onReorder(keys);
          return;
        }
        if (!cancelled && was && canArm) arm(el);
      }
    });
  });
}

/* Paradigm: Google Calendar + Drive (free tier, browser token flow). */
'use strict';

const SCOPES = 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/drive.appdata';
const CAL = 'https://www.googleapis.com/calendar/v3';
const BACKUP_NAME = 'paradigm-backup.json';
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

let tokenClient = null, tokenClientFor = '', tokenWaiters = [], tokenPending = false, backupDirty = false, backupTimer = null;

const gisReady = () => !!(window.google && google.accounts && google.accounts.oauth2);
function tokenValid() { return !!state.auth.token && Date.now() < state.auth.exp - MIN; }

function ensureTokenClient() {
  const id = (state.settings.clientId || '').trim();
  if (!id || !gisReady()) return null;
  if (tokenClient && tokenClientFor === id) return tokenClient;
  tokenClientFor = id;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: id, scope: SCOPES,
    callback: resp => {
      if (resp && resp.access_token) {
        state.auth.token = resp.access_token;
        state.auth.exp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
        state.settings.connected = true;
        save({ noBackup: true });
        settleTokens(resp.access_token);
        if (backupDirty) driveBackup();
      } else settleTokens(null);
    },
    error_callback: () => settleTokens(null)
  });
  return tokenClient;
}
function settleTokens(tok) { tokenPending = false; const w = tokenWaiters; tokenWaiters = []; w.forEach(f => f(tok)); if (typeof renderSettings === 'function') renderSettings(); }

/* Call FIRST inside a tap/swipe handler (before any await) so the sign-in popup is allowed. */
function getToken(interactive, forceConsent) {
  if (tokenValid() && !forceConsent) return Promise.resolve(state.auth.token);
  if (!interactive) return Promise.resolve(null);
  const tc = ensureTokenClient();
  if (!tc) return Promise.resolve(null);
  return new Promise(res => {
    tokenWaiters.push(res);
    if (tokenPending) return;
    tokenPending = true;
    try { tc.requestAccessToken({ prompt: forceConsent || !state.settings.connected ? 'consent' : '' }); }
    catch (e) { settleTokens(null); }
  });
}

async function gfetch(tok, method, url, body, headers) {
  const h = Object.assign({ Authorization: 'Bearer ' + tok }, headers || {});
  let payload = body;
  if (body !== undefined && body !== null && typeof body !== 'string') { payload = JSON.stringify(body); h['Content-Type'] = 'application/json'; }
  const r = await fetch(url, { method, headers: h, body: payload });
  if (r.status === 401) { state.auth.token = ''; state.auth.exp = 0; throw Object.assign(new Error('auth'), { status: 401 }); }
  if (!r.ok) throw Object.assign(new Error('http ' + r.status), { status: r.status });
  if (r.status === 204) return null;
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

/* ---------- Calendar ---------- */
async function paradigmCalId(tok) {
  if (state.settings.paradigmCalId) return state.settings.paradigmCalId;
  const list = await gfetch(tok, 'GET', `${CAL}/users/me/calendarList?maxResults=250`);
  let cal = (list.items || []).find(c => c.summary === 'Paradigm');
  if (!cal) cal = await gfetch(tok, 'POST', `${CAL}/calendars`, { summary: 'Paradigm', timeZone: TZ });
  state.settings.paradigmCalId = cal.id; save({ noBackup: true });
  return cal.id;
}
function eventTimes(ev) {
  if (ev.allDay) return { start: { date: ev.date }, end: { date: addDays(ev.date, 1) } };
  const base = parseDate(ev.date).getTime();
  return {
    start: { dateTime: new Date(base + ev.startMin * MIN).toISOString(), timeZone: TZ },
    end: { dateTime: new Date(base + ev.endMin * MIN).toISOString(), timeZone: TZ }
  };
}
async function calInsertEvent(tok, name, ev) {
  const r = await gfetch(tok, 'POST', `${CAL}/calendars/primary/events`, Object.assign({ summary: name }, eventTimes(ev)));
  return r.id;
}
async function calUpdateEvent(tok, id, name, ev) {
  await gfetch(tok, 'PATCH', `${CAL}/calendars/primary/events/${encodeURIComponent(id)}`, Object.assign({ summary: name }, eventTimes(ev)));
}
async function calDeleteEvent(tok, id) {
  try { await gfetch(tok, 'DELETE', `${CAL}/calendars/primary/events/${encodeURIComponent(id)}`); }
  catch (e) { if (e.status !== 404 && e.status !== 410) throw e; }
}
/* Adds { name, start, end } to the Paradigm calendar. */
async function calAddParadigm(tok, ev, description) {
  const body = {
    summary: ev.name,
    description: description || 'Added by Paradigm',
    start: { dateTime: new Date(ev.start).toISOString(), timeZone: TZ },
    end: { dateTime: new Date(ev.end).toISOString(), timeZone: TZ }
  };
  let id = await paradigmCalId(tok);
  try { await gfetch(tok, 'POST', `${CAL}/calendars/${encodeURIComponent(id)}/events`, body); }
  catch (e) {
    if (e.status !== 404) throw e;
    state.settings.paradigmCalId = '';
    id = await paradigmCalId(tok);
    await gfetch(tok, 'POST', `${CAL}/calendars/${encodeURIComponent(id)}/events`, body);
  }
}
/* ---------- all-day events scheduled from Paradigm ----------
   The subtasks and notes ride along twice: as a readable checklist in the description, and as a hidden copy
   (Google Calendar's private extended properties, split into chunks) that Paradigm reads back exactly. */
function paradigmDescription(p) {
  const lines = (p.subtasks || []).map(n => '☐ ' + n);
  if ((p.notes || '').trim()) lines.push((lines.length ? '\n' : '') + p.notes.trim());
  lines.push((lines.length ? '\n' : '') + '— Scheduled in Paradigm');
  return lines.join('\n');
}
function packPayload(p) {
  const j = JSON.stringify(p), out = {}, size = 900;
  const n = Math.ceil(j.length / size) || 1;
  for (let i = 0; i < n; i++) out['pdg' + i] = j.slice(i * size, (i + 1) * size);
  out.pdgn = String(n);
  return out;
}
function readPayload(e) {
  const pr = e && e.extendedProperties && e.extendedProperties.private;
  if (!pr || !pr.pdgn) return null;
  let j = '';
  for (let i = 0; i < Number(pr.pdgn); i++) j += pr['pdg' + i] || '';
  try { return JSON.parse(j); } catch (err) { return null; }
}
async function calAddParadigmAllDay(tok, c) {
  const body = {
    summary: c.name,
    description: paradigmDescription(c.payload || {}),
    start: { date: c.date }, end: { date: addDays(c.date, 1) },
    extendedProperties: { private: packPayload(c.payload || {}) }
  };
  if (c.rrule) body.recurrence = ['RRULE:' + c.rrule];
  let id = await paradigmCalId(tok);
  try { return (await gfetch(tok, 'POST', `${CAL}/calendars/${encodeURIComponent(id)}/events`, body)).id; }
  catch (e) {
    if (e.status !== 404) throw e;
    state.settings.paradigmCalId = '';
    id = await paradigmCalId(tok);
    return (await gfetch(tok, 'POST', `${CAL}/calendars/${encodeURIComponent(id)}/events`, body)).id;
  }
}
async function calDeleteParadigmEvent(tok, eventId) {
  const id = await paradigmCalId(tok);
  try { await gfetch(tok, 'DELETE', `${CAL}/calendars/${encodeURIComponent(id)}/events/${encodeURIComponent(eventId)}`); }
  catch (e) { if (e.status !== 404 && e.status !== 410) throw e; }
}
/* Plain text from an event description (Google allows simple HTML there). */
function descriptionText(html) {
  if (!html) return '';
  const t = String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li)>/gi, '\n');
  const d = new DOMParser().parseFromString(t, 'text/html');
  return (d.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}

/* Existing events for a day, for the dimmed background in day views. Never prompts. */
async function calDayEvents(date) {
  const tok = await getToken(false);
  if (!tok) return null;
  const t0 = parseDate(date).getTime();
  const q = `timeMin=${encodeURIComponent(new Date(t0).toISOString())}&timeMax=${encodeURIComponent(new Date(t0 + DAY).toISOString())}&singleEvents=true&orderBy=startTime&maxResults=100`;
  const cals = ['primary'];
  if (state.settings.paradigmCalId) cals.push(state.settings.paradigmCalId);
  const out = [];
  for (const c of cals) {
    try {
      const r = await gfetch(tok, 'GET', `${CAL}/calendars/${encodeURIComponent(c)}/events?${q}`);
      (r.items || []).forEach(e => { e._cal = c; out.push(e); });   // remember which calendar it came from
    } catch (e) { /* show what we can */ }
  }
  return out;
}

/* One-tap fallback when Google access has lapsed. */
function calLink(name, ev, details) {
  const f = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  let dates;
  if (ev.allDay) dates = `${ev.date.replace(/-/g, '')}/${addDays(ev.date, 1).replace(/-/g, '')}`;
  else if (ev.startMs) dates = `${f(ev.startMs)}/${f(ev.endMs)}`;
  else { const b = parseDate(ev.date).getTime(); dates = `${f(b + ev.startMin * MIN)}/${f(b + ev.endMin * MIN)}`; }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(name)}&dates=${dates}${details ? '&details=' + encodeURIComponent(details) : ''}`;
}

/* ---------- Drive backup (hidden app folder) ---------- */
function exportable() {
  const s = clone(state);
  delete s.auth;
  s.settings = { clientId: state.settings.clientId };
  s.exportedAt = Date.now();
  return s;
}
function scheduleBackup() {
  if (!state.settings.connected) return;
  backupDirty = true;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(driveBackup, 4000);
}
async function driveFileId(tok) {
  if (state.settings.driveFileId) return state.settings.driveFileId;
  const q = encodeURIComponent(`name='${BACKUP_NAME}'`);
  const r = await gfetch(tok, 'GET', `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`);
  const id = r.files && r.files[0] ? r.files[0].id : '';
  state.settings.driveFileId = id;
  return id;
}
async function driveBackup(interactiveTokPromise) {
  const tok = interactiveTokPromise ? await interactiveTokPromise : await getToken(false);
  if (!tok) { backupDirty = true; return false; }
  try {
    const data = JSON.stringify(exportable());
    let id = await driveFileId(tok);
    if (id) {
      try { await gfetch(tok, 'PATCH', `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, data, { 'Content-Type': 'application/json' }); }
      catch (e) { if (e.status === 404) id = ''; else throw e; }
    }
    if (!id) {
      const b = 'paradigm' + uid();
      const meta = JSON.stringify({ name: BACKUP_NAME, parents: ['appDataFolder'] });
      const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${b}--`;
      const r = await gfetch(tok, 'POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', body, { 'Content-Type': `multipart/related; boundary=${b}` });
      state.settings.driveFileId = r.id;
    }
    backupDirty = false;
    state.settings.lastBackup = Date.now();
    save({ noBackup: true });
    if (typeof renderSettings === 'function') renderSettings();
    return true;
  } catch (e) { console.warn('backup failed', e); backupDirty = true; return false; }
}
async function driveRestore(tokPromise) {
  const tok = await tokPromise;
  if (!tok) throw new Error('Not connected to Google');
  state.settings.driveFileId = '';
  const id = await driveFileId(tok);
  if (!id) throw new Error('No backup found in Drive');
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: 'Bearer ' + tok } });
  if (!r.ok) throw new Error('Download failed');
  return r.json();
